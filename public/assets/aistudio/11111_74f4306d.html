/**
 * YAWMI — «الصحة» (Health & Wearables Summary, Android Health Connect 10-Step Flow, 8 UI States, Interactive Cards & Charts)
 * يطبق المراحل 5 و 6 و 7 و 8 و 9 من بروتوكول التنفيذ الإلزامي:
 * - زر «ربط Health Connect» داخل شاشة الصحة بالتسلسل الفعلي المكون من 10 خطوات.
 * - الحالات الـ 8 المنفصلة في الواجهة:
 *   1) غير مرتبط
 *   2) جارٍ التحقق
 *   3) يحتاج إلى صلاحيات
 *   4) جارٍ قراءة البيانات
 *   5) تمت القراءة بنجاح
 *   6) لا توجد بيانات («تم الربط، لا توجد بيانات متاحة»)
 *   7) فشل الاتصال
 *   8) فقد التطبيق صلاحية الوصول
 * - وظيفة «مزامنة الآن» مع قفل التزامن ومنع مسح البيانات السابقة عند الفشل.
 * - بطاقات الخطوات والمسافة والسعرات ومعدل القلب والنوم والوزن والتمارين والأكسجين مع مصدر كل مجموعة بيانات.
 */

const healthViewState = {
  period: 'day', // 'day' | 'week' | 'month'
  referenceDate: getLocalDateString(),
  chartMetric: 'steps'
};

const CONNECTION_STATE_LABELS = {
  disconnected: { text: 'غير متصل', badge: 'badge-low' },
  connecting: { text: 'جارٍ الاتصال...', badge: 'badge-medium' },
  connected: { text: 'متصل ✓', badge: 'badge-success' },
  syncing: { text: 'جارٍ جلب البيانات...', badge: 'badge-high' },
  connection_failed: { text: 'فشل الاتصال', badge: 'badge-urgent' }
};

function renderSvgHealthChart(chartSeries, unitLabel = '', colorHex = '#10B981') {
  if (!chartSeries || !chartSeries.hasAnyData) {
    return `
      <div style="padding:22px 14px;text-align:center;background:var(--bg-surface-muted);border-radius:var(--radius-sm);border:1px dashed var(--border-strong);color:var(--text-muted);font-size:0.83rem;">
        لا توجد بيانات مسجلة لهذا المؤشر في الفترة المحددة لعرض الرسم البياني.
      </div>
    `;
  }

  const pts = chartSeries.points;
  const maxVal = Math.max(...pts.map(p => (p.hasData && p.value !== null ? Number(p.value) : 0)), 1);
  const svgW = 440;
  const svgH = 148;
  const padTop = 18;
  const padBottom = 26;
  const chartH = svgH - padTop - padBottom;
  const colW = svgW / Math.max(pts.length, 1);
  const barW = Math.max(8, Math.min(28, colW * 0.56));

  const barsSvg = pts.map((pt, idx) => {
    const xCenter = idx * colW + colW / 2;
    const xBar = xCenter - barW / 2;
    const showLabel = pts.length <= 7 || idx % 4 === 0 || idx === pts.length - 1;

    if (!pt.hasData || pt.value === null) {
      return `
        <g>
          <line x1="${xCenter}" y1="${padTop + chartH - 4}" x2="${xCenter}" y2="${padTop + chartH}" stroke="var(--border-strong)" stroke-width="2"/>
          ${showLabel ? `<text x="${xCenter}" y="${svgH - 7}" text-anchor="middle" fill="var(--text-muted)" font-size="9">${escapeHtml(pt.label)}</text>` : ''}
        </g>
      `;
    }

    const h = Math.max(6, Math.round((Number(pt.value) / maxVal) * chartH));
    const yBar = padTop + (chartH - h);
    return `
      <g>
        <rect x="${xBar.toFixed(1)}" y="${yBar.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${colorHex}" opacity="0.9"/>
        ${pts.length <= 7 ? `<text x="${xCenter.toFixed(1)}" y="${Math.max(11, yBar - 4).toFixed(1)}" text-anchor="middle" fill="var(--text-primary)" font-size="9.5" font-weight="700">${escapeHtml(String(pt.value))}</text>` : ''}
        ${showLabel ? `<text x="${xCenter.toFixed(1)}" y="${svgH - 7}" text-anchor="middle" fill="var(--text-secondary)" font-size="9">${escapeHtml(pt.label)}</text>` : ''}
      </g>
    `;
  }).join('');

  return `
    <div style="width:100%;overflow:hidden;">
      <svg viewBox="0 0 ${svgW} ${svgH}" style="width:100%;height:155px;display:block;" role="img" aria-label="رسم بياني للمؤشر الصحي">
        <line x1="0" y1="${padTop + chartH}" x2="${svgW}" y2="${padTop + chartH}" stroke="var(--border-color)" stroke-width="1"/>
        ${barsSvg}
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:0.73rem;color:var(--text-muted);margin-top:4px;">
        <span>الوحدة: ${escapeHtml(unitLabel)}</span>
        <span>القيم الفارغة تمثل أيامًا «لا توجد بيانات» فيها (وليست صفرًا)</span>
      </div>
    </div>
  `;
}

/**
 * المرحلة الخامسة: تنفيذ التسلسل الإلزامي المكون من 10 خطوات عند الضغط على «ربط Health Connect»
 */
async function executeHealthConnectLinkFlow(containerEl, onRefreshApp, rerenderFn = null) {
  const refreshUi = async () => {
    if (typeof rerenderFn === 'function') {
      await rerenderFn();
    } else if (containerEl) {
      await renderHealthView(containerEl, onRefreshApp, { skipPermissionRecheck: true });
    }
  };
  // الخطوة 1 و 2: التحقق من البيئة الأصلية وتوفر Health Connect (مع إظهار حالة «جارٍ التحقق»)
  HealthConnectService.setUiStateCode('checking');
  await refreshUi();

  const avail = await HealthConnectService.checkAvailability();

  // إذا كان المستخدم يفتح التطبيق داخل متصفح عادي أو WebView بدون APK
  if (!avail.isNativeAndroid) {
    HealthConnectService.setUiStateCode('connection_failed');
    await patchHealthSyncState({
      uiStateCode: 'connection_failed',
      lastSyncStatus: 'failed',
      lastSyncError: avail.messageAr
    });
    await refreshUi();

    openModal({
      title: '⚠️ مطلوب بيئة Android الأصلية لربط Health Connect',
      bodyHtml: `
        <div class="form-grid" style="font-size:0.84rem;line-height:1.65;">
          <div style="background:var(--color-danger-bg);color:var(--color-danger);padding:11px 13px;border-radius:var(--radius-sm);font-weight:700;">
            ${escapeHtml(avail.messageAr)}
          </div>
          <div class="card" style="background:var(--bg-surface-muted);">
            <div style="font-weight:800;margin-bottom:6px;">لماذا لا يفتح Health Connect في المتصفح؟</div>
            <p style="color:var(--text-secondary);">
              خدمة <code>Android Health Connect</code> هي خدمة نظام أندرويد أصلية (<code>androidx.health.connect.client</code>) تتطلب تشغيل التطبيق على نظام أندرويد، ولا يسمح النظام لأي متصفح ويب عادي بالاتصال بها مباشرة.
            </p>
          </div>
        </div>
      `,
      footerHtml: `
        <button type="button" class="btn btn-primary" id="hc-env-modal-close">إغلاق</button>
      `,
      onMount: () => {
        document.getElementById('hc-env-modal-close')?.addEventListener('click', closeModal);
      }
    });
    return;
  }

  // الخطوة 3: إذا لم يكن Health Connect متوفرًا أو يحتاج إلى تحديث، إظهار تعليمات مناسبة لتثبيته أو تحديثه
  if (!avail.available) {
    HealthConnectService.setUiStateCode('connection_failed');
    await patchHealthSyncState({
      uiStateCode: 'connection_failed',
      lastSyncStatus: 'failed',
      lastSyncError: avail.messageAr
    });
    await refreshUi();

    openModal({
      title: 'تثبيت أو تحديث خدمة Android Health Connect',
      bodyHtml: `
        <div class="form-grid" style="font-size:0.85rem;line-height:1.65;">
          <p style="color:var(--text-secondary);">${escapeHtml(avail.messageAr)}</p>
          <div style="background:var(--bg-surface-muted);padding:11px 13px;border-radius:var(--radius-sm);">
            يرجى تثبيت أو تحديث تطبيق <strong>Health Connect by Android</strong> الرسمي (` + '`com.google.android.apps.healthdata`' + `) من متجر Google Play ثم إعادة المحاولة.
          </div>
        </div>
      `,
      footerHtml: `
        <button type="button" class="btn btn-secondary" id="hc-store-cancel">إغلاق</button>
        <button type="button" class="btn btn-primary" id="hc-store-open">فتح متجر Google Play / الإعدادات</button>
      `,
      onMount: () => {
        document.getElementById('hc-store-cancel')?.addEventListener('click', closeModal);
        document.getElementById('hc-store-open')?.addEventListener('click', async () => {
          closeModal();
          try {
            await HealthConnectService.openHealthConnectSettings();
          } catch (err) {
            showToast(err.message, 'warning');
          }
        });
      }
    });
    return;
  }

  // الخطوة 4: عرض شرح مختصر للبيانات التي يريد YAWMI قراءتها قبل فتح شاشة الصلاحيات الأصلية
  const bodyHtml = `
    <div class="form-grid" style="font-size:0.84rem;line-height:1.65;">
      <div style="background:var(--bg-surface-muted);padding:12px;border-radius:var(--radius-sm);border-inline-start:3px solid var(--color-accent);">
        يطلب تطبيق <strong>يومي | YAWMI</strong> صلاحيات <strong>القراءة فقط (Read-Only)</strong> من خدمة Android Health Connect لعرض ملخص نشاطك اليومي ومؤشراتك الحيوية محليًا على جهازك:
      </div>
      <ul style="padding-inline-start:18px;list-style:disc;color:var(--text-secondary);">
        <li><strong>الخطوات والمسافة والسعرات:</strong> قراءة إجمالي النشاط اليومي عبر التجميع الرسمي دون تكرار العد بين السوار والهاتف.</li>
        <li><strong>معدل ضربات القلب وضربات القلب أثناء الراحة:</strong> عرض آخر قراءة وتوقيتها وسجل القراءات اليومي.</li>
        <li><strong>النوم ومراحله:</strong> حساب مدة النوم ومراحله المتاحة دون جمع المراحل المتداخلة مرتين.</li>
        <li><strong>الوزن والتمارين والأكسجين ومعدل التنفس:</strong> عرض القياسات وجلسات التمارين المسجلة مع مصدرها وتوقيتها.</li>
      </ul>
      <label style="display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;padding-top:4px;">
        <input type="checkbox" id="hc-req-bg-perm-chk" checked style="accent-color:var(--color-primary);">
        <span>تضمين إذن قراءة البيانات في الخلفية (<code>READ_HEALTH_DATA_IN_BACKGROUND</code>) للمزامنة الدورية عبر WorkManager</span>
      </label>
    </div>
  `;

  const footerHtml = `
    <button type="button" class="btn btn-secondary" id="hc-rationale-cancel">إلغاء</button>
    <button type="button" class="btn btn-primary" id="hc-rationale-proceed">متابعة لفتح شاشة الصلاحيات الأصلية</button>
  `;

  openModal({
    title: 'ربط Android Health Connect — البيانات المطلوبة',
    bodyHtml,
    footerHtml,
    onMount: () => {
      document.getElementById('hc-rationale-cancel')?.addEventListener('click', async () => {
        closeModal();
        HealthConnectService.setUiStateCode('needs_permissions');
        await refreshUi();
      });

      // الخطوات 5، 6، 7، 8، 9، 10
      document.getElementById('hc-rationale-proceed')?.addEventListener('click', async () => {
        const includeBg = Boolean(document.getElementById('hc-req-bg-perm-chk')?.checked);
        closeModal();
        try {
          // الخطوة 5 و 6: فتح شاشة صلاحيات Health Connect الأصلية والسماح للمستخدم بالموافقة أو الرفض
          await HealthConnectService.requestPermissions({ includeBackground: includeBg });

          // الخطوة 7: بعد العودة إلى التطبيق، التحقق مجددًا من الصلاحيات الممنوحة
          const verify = await HealthConnectService.checkPermissions();

          if (!verify.granted) {
            // الخطوة 9: إذا رفض، عرض رسالة واضحة مع زر لإعادة المحاولة
            HealthConnectService.setUiStateCode('needs_permissions');
            await patchHealthSyncState({
              uiStateCode: 'needs_permissions',
              lastSyncError: 'تم رفض منح صلاحيات القراءة. يمكنك الضغط على «إعادة التحقق من الصلاحيات» للمحاولة مجددًا.'
            });
            showToast('لم يتم منح صلاحيات القراءة في Health Connect. يمكنك إعادة المحاولة في أي وقت.', 'warning', 4500);
            await refreshUi();
            return;
          }

          // الخطوة 8: إذا وافق المستخدم، بدء قراءة البيانات الحقيقية
          HealthConnectService.setUiStateCode('reading_data');
          await refreshUi();

          const summary = await HealthConnectService.readTodaySummary({
            syncFromNative: true,
            date: healthViewState.referenceDate
          });

          if (summary.hasAnyDataToday) {
            showToast('تم الربط بنجاح وقراءة البيانات الصحية الحقيقية ✓', 'success', 4000);
          } else {
            showToast('تم الربط، لا توجد بيانات متاحة لهذا اليوم في Health Connect بعد', 'info', 4500);
          }
        } catch (err) {
          showToast(err.message || 'تعذر إتمام الربط مع Health Connect', 'error', 4500);
        }
        await refreshUi();
      });
    }
  });
}

/**
 * نافذة إدخال قياس موثق أو استيراد ملف سجلات Health Connect / Gadgetbridge JSON
 */
function openHealthRecordEntryModal(defaultMetric = 'steps', onSaved = null) {
  const nowDate = getLocalDateString();
  const nowTime = getLocalTimeString();

  const bodyHtml = `
    <div class="form-grid">
      <div style="background:var(--bg-surface-muted);padding:10px 12px;border-radius:var(--radius-sm);font-size:0.79rem;color:var(--text-secondary);border-inline-start:3px solid var(--color-accent);">
        يُحفظ هذا القياس بمصدر صريح وواضح (<strong>إدخال يدوي موثق</strong> أو <strong>ملف سجل مستورد</strong>) مع تمريره عبر طبقة توحيد السجلات ومنع التكرار، ولا يُصنّف أبدًا كاتصال وهمي بالسوار أو Health Connect.
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label" for="hrec-metric">نوع القياس *</label>
          <select id="hrec-metric" class="form-select">
            ${Object.entries(HEALTH_METRIC_DEFS).map(([k, def]) => `
              <option value="${escapeHtml(k)}" ${k === defaultMetric ? 'selected' : ''}>${escapeHtml(def.icon)} ${escapeHtml(def.labelAr)} (${escapeHtml(def.unit)})</option>
            `).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="hrec-source">مصدر السجل الموثق</label>
          <select id="hrec-source" class="form-select">
            <option value="manual_verified">إدخال يدوي موثق (جهاز قياس خارجي)</option>
            <option value="health_connect">سجل مستورد من Android Health Connect</option>
            <option value="google_fit_hc">سجل مستورد من Google Fit عبر Health Connect</option>
            <option value="xiaomi_band_10_ble">سجل مستورد من Xiaomi Smart Band 10</option>
            <option value="honor_band_4_ble">سجل مستورد من HONOR Band 4</option>
            <option value="phone_sensor">مستشعرات الهاتف</option>
          </select>
        </div>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label" for="hrec-val">القيمة *</label>
          <input type="number" id="hrec-val" class="form-input" step="0.01" min="0" required placeholder="أدخل القيمة الحقيقية">
        </div>
        <div class="form-group">
          <label class="form-label" for="hrec-device">اسم الجهاز المنشئ للسجل (اختياري)</label>
          <input type="text" id="hrec-device" class="form-input" placeholder="مثال: Xiaomi Smart Band 10 / Omron">
        </div>
      </div>

      <div id="hrec-bp-extra" class="form-row-2" style="display:none;">
        <div class="form-group">
          <label class="form-label" for="hrec-sys">الانقباضي Systolic (mmHg)</label>
          <input type="number" id="hrec-sys" class="form-input" placeholder="120">
        </div>
        <div class="form-group">
          <label class="form-label" for="hrec-dia">الانبساطي Diastolic (mmHg)</label>
          <input type="number" id="hrec-dia" class="form-input" placeholder="80">
        </div>
      </div>

      <div id="hrec-sleep-extra" class="form-row-2" style="display:none;">
        <div class="form-group">
          <label class="form-label" for="hrec-sleep-deep">نوم عميق (دقيقة)</label>
          <input type="number" id="hrec-sleep-deep" class="form-input" placeholder="95">
        </div>
        <div class="form-group">
          <label class="form-label" for="hrec-sleep-light">نوم خفيف + REM (دقيقة)</label>
          <input type="number" id="hrec-sleep-light" class="form-input" placeholder="320">
        </div>
      </div>

      <div id="hrec-ex-extra" class="form-group" style="display:none;">
        <label class="form-label" for="hrec-ex-type">نوع التمرين</label>
        <input type="text" id="hrec-ex-type" class="form-input" placeholder="مثال: مشي سريع / جري / دراجة">
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label" for="hrec-date">التاريخ *</label>
          <input type="date" id="hrec-date" class="form-input" value="${escapeHtml(nowDate)}">
        </div>
        <div class="form-group">
          <label class="form-label" for="hrec-time">وقت القراءة *</label>
          <input type="time" id="hrec-time" class="form-input" value="${escapeHtml(nowTime)}">
        </div>
      </div>

      <div style="border-top:1px solid var(--border-color);padding-top:10px;">
        <label class="form-label" style="margin-bottom:6px;display:block;">أو استيراد دفعة سجلات صحية بصيغة JSON (Health Connect / Gadgetbridge Export)</label>
        <input type="file" id="hrec-json-file" accept=".json,application/json" class="form-input" style="font-size:0.8rem;">
      </div>
    </div>
  `;

  const footerHtml = `
    <button type="button" class="btn btn-secondary" id="hrec-cancel-btn">إلغاء</button>
    <button type="button" class="btn btn-primary" id="hrec-save-btn">حفظ وتوحيد السجل</button>
  `;

  openModal({
    title: 'تسجيل قياس صحي موثق / استيراد سجل',
    bodyHtml,
    footerHtml,
    onMount: () => {
      const metricSelect = document.getElementById('hrec-metric');
      const updateExtraFields = () => {
        const m = metricSelect.value;
        document.getElementById('hrec-bp-extra').style.display = m === 'blood_pressure' ? 'grid' : 'none';
        document.getElementById('hrec-sleep-extra').style.display = m === 'sleep' ? 'grid' : 'none';
        document.getElementById('hrec-ex-extra').style.display = m === 'exercise' ? 'flex' : 'none';
      };
      metricSelect?.addEventListener('change', updateExtraFields);
      updateExtraFields();

      document.getElementById('hrec-cancel-btn')?.addEventListener('click', closeModal);

      document.getElementById('hrec-json-file')?.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const text = await file.text();
          const parsed = JSON.parse(text);
          const list = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.records) ? parsed.records : []);
          if (list.length === 0) {
            showToast('الملف لا يحتوي على مصفوفة سجلات صحية صالحة', 'error');
            return;
          }
          const stats = await HealthNormalizer.ingestHealthRecords(list);
          closeModal();
          showToast(`تم استيراد ${stats.insertedCount} سجل وتوحيدها (تم استبعاد ${stats.suppressedDuplicatesCount} مكرر)`, 'success');
          if (typeof onSaved === 'function') await onSaved();
        } catch (err) {
          showToast(`تعذر قراءة ملف السجلات: ${err.message}`, 'error');
        }
      });

      document.getElementById('hrec-save-btn')?.addEventListener('click', () => {
        withSubmitLock('save-health-rec', async () => {
          try {
            const metricType = metricSelect.value;
            const rawVal = document.getElementById('hrec-val').value;
            if (rawVal === '' || Number(rawVal) < 0) {
              throw new Error('أدخل قيمة رقمية صحيحة للقياس.');
            }
            const dStr = document.getElementById('hrec-date').value || nowDate;
            const tStr = document.getElementById('hrec-time').value || nowTime;
            const dt = parseLocalDate(dStr, tStr) || new Date();
            const sourceType = document.getElementById('hrec-source').value;

            const stages = [];
            if (metricType === 'sleep') {
              const deep = Number(document.getElementById('hrec-sleep-deep').value || 0);
              const light = Number(document.getElementById('hrec-sleep-light').value || 0);
              if (deep > 0) stages.push({ stage: 'deep', labelAr: 'نوم عميق', minutes: deep });
              if (light > 0) stages.push({ stage: 'light_rem', labelAr: 'نوم خفيف + REM', minutes: light });
            }

            const recordInput = {
              metricType,
              value: Number(rawVal),
              startTime: dt.toISOString(),
              endTime: dt.toISOString(),
              localDate: dStr,
              sourceType,
              sourcePackage: sourceType === 'google_fit_hc' ? 'com.google.android.apps.fitness' : '',
              deviceModel: document.getElementById('hrec-device').value.trim() || null,
              systolic: metricType === 'blood_pressure' ? Number(document.getElementById('hrec-sys').value || 0) : null,
              diastolic: metricType === 'blood_pressure' ? Number(document.getElementById('hrec-dia').value || 0) : null,
              stages: stages.length > 0 ? stages : null,
              exerciseTitle: metricType === 'exercise' ? (document.getElementById('hrec-ex-type').value.trim() || 'تمرين رياضي') : null
            };

            const res = await HealthNormalizer.ingestHealthRecords([recordInput]);
            closeModal();
            showToast(
              res.suppressedDuplicatesCount > 0
                ? 'تم حفظ السجل واستبعاده من المجموع لوجود مصدر أعلى أولوية في نفس اليوم لمنع التكرار'
                : 'تم حفظ القياس الصحي وتوحيده بنجاح ✓',
              'success'
            );
            if (typeof onSaved === 'function') await onSaved();
          } catch (err) {
            showToast(err.message || 'تعذر حفظ القياس الصحي', 'error');
          }
        });
      });
    }
  });
}

/**
 * نافذة تفاصيل البطاقة الصحية (رسم بياني + فلاتر يوم/أسبوع/شهر + السجل الزمني بالمصدر)
 */
async function openHealthMetricDetailModal(metricType, onRefreshApp) {
  const def = HEALTH_METRIC_DEFS[metricType] || HEALTH_METRIC_DEFS.steps;
  let modalPeriod = healthViewState.period || 'week';

  const renderModalContent = async () => {
    const [allRecords, syncStatus] = await Promise.all([
      getAllRecords(STORE_NAMES.HEALTH_RECORDS),
      YawmiHealthAPI.getSyncStatus()
    ]);

    const activeFamily = syncStatus.primaryDevice?.family || null;
    const summary = HealthNormalizer.summarizePeriod(allRecords, {
      referenceDate: healthViewState.referenceDate,
      period: modalPeriod,
      activeDeviceFamily: activeFamily
    });

    const cardData = summary.metrics[metricType];
    const chartSeries = summary.buildChartSeries(metricType);
    const allForMetric = allRecords
      .filter(r => r.metricType === metricType)
      .sort((a, b) => String(b.startTime).localeCompare(String(a.startTime)));

    const bodyEl = document.getElementById('yawmi-modal-body');
    if (!bodyEl) return;

    bodyEl.innerHTML = `
      <div class="form-grid">
        <div class="segmented-tabs">
          <button type="button" class="seg-tab ${modalPeriod === 'day' ? 'active' : ''}" data-det-period="day">اليوم</button>
          <button type="button" class="seg-tab ${modalPeriod === 'week' ? 'active' : ''}" data-det-period="week">الأسبوع (7 أيام)</button>
          <button type="button" class="seg-tab ${modalPeriod === 'month' ? 'active' : ''}" data-det-period="month">الشهر (30 يومًا)</button>
        </div>

        <div class="card" style="background:var(--bg-surface-muted);display:flex;align-items:center;justify-content:space-between;gap:10px;">
          <div>
            <div style="font-size:0.78rem;color:var(--text-muted);">${escapeHtml(def.labelAr)} (${modalPeriod === 'day' ? 'اليوم' : (modalPeriod === 'week' ? 'آخر 7 أيام' : 'آخر 30 يومًا')})</div>
            <div style="font-size:1.35rem;font-weight:800;margin-top:2px;color:${cardData.available ? 'var(--text-primary)' : 'var(--text-muted)'};">
              ${escapeHtml(cardData.displayText)}
            </div>
            ${cardData.sourceNameAr ? `<div style="font-size:0.75rem;color:var(--color-accent);margin-top:2px;">المصدر المعتمد: ${escapeHtml(cardData.sourceNameAr)}</div>` : ''}
          </div>
          <button type="button" class="btn btn-primary btn-sm" id="det-add-reading-btn">+ إضافة قراءة</button>
        </div>

        <div>
          <h4 style="font-size:0.88rem;font-weight:800;margin-bottom:8px;">الرسم البياني الزمني</h4>
          ${renderSvgHealthChart(chartSeries, def.unit, def.color)}
        </div>

        <div>
          <h4 style="font-size:0.88rem;font-weight:800;margin-bottom:8px;">السجل التاريخي للقراءات والمصادر (${allForMetric.length})</h4>
          ${allForMetric.length === 0
            ? `<div style="font-size:0.82rem;color:var(--text-muted);padding:12px;background:var(--bg-surface-muted);border-radius:var(--radius-sm);">لا توجد أي قراءات مسجلة لهذا المؤشر حتى الآن.</div>`
            : `<div class="item-list" style="max-height:220px;overflow-y:auto;">
                ${allForMetric.slice(0, 40).map(r => `
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:var(--bg-surface-muted);border-radius:var(--radius-xs);border:1px solid var(--border-color);">
                    <div>
                      <div style="font-weight:800;font-size:0.88rem;">
                        ${r.metricType === 'blood_pressure' && r.systolic ? `${r.systolic}/${r.diastolic}` : escapeHtml(String(r.value))} ${escapeHtml(r.unit)}
                        ${r.exerciseTitle ? ` • ${escapeHtml(r.exerciseTitle)}` : ''}
                      </div>
                      <div style="font-size:0.73rem;color:var(--text-muted);">
                        🕒 ${escapeHtml(r.startTime.slice(0, 16).replace('T', ' '))} • المصدر: <strong>${escapeHtml(r.sourceNameAr)}</strong>
                        ${r.deviceModel ? ` (${escapeHtml(r.deviceModel)})` : ''}
                      </div>
                      ${Array.isArray(r.stages) && r.stages.length > 0 ? `
                        <div style="font-size:0.72rem;color:var(--color-accent);margin-top:2px;">
                          مراحل النوم: ${r.stages.map(s => `${escapeHtml(s.labelAr || s.stage)}: ${escapeHtml(String(s.minutes || ''))} د`).join(' | ')}
                        </div>
                      ` : ''}
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;">
                      <span class="badge ${r.dedupStatus === 'unique_primary' ? 'badge-success' : 'badge-low'}" title="${escapeHtml(r.dedupReason || '')}">
                        ${r.dedupStatus === 'unique_primary' ? 'معتمد ✓' : 'مستبعد (مكرر)'}
                      </span>
                      <button type="button" class="icon-btn" style="width:26px;height:26px;" data-del-hrec="${escapeHtml(r.id)}" aria-label="حذف القراءة">✕</button>
                    </div>
                  </div>
                `).join('')}
              </div>`
          }
        </div>

        <div style="font-size:0.74rem;color:var(--text-muted);background:var(--bg-surface-muted);padding:8px 10px;border-radius:var(--radius-xs);">
          ⚠️ <strong>تنبيه طبي:</strong> القياسات الاستهلاكية من الأساور الذكية قد تكون غير دقيقة ولا تُغني عن الأجهزة الطبية المعتمدة أو استشارة الطبيب.
        </div>
      </div>
    `;

    bodyEl.querySelectorAll('[data-det-period]').forEach(btn => {
      btn.addEventListener('click', () => {
        modalPeriod = btn.getAttribute('data-det-period');
        renderModalContent();
      });
    });

    document.getElementById('det-add-reading-btn')?.addEventListener('click', () => {
      closeModal();
      openHealthRecordEntryModal(metricType, onRefreshApp);
    });

    bodyEl.querySelectorAll('[data-del-hrec]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-del-hrec');
        await deleteRecord(STORE_NAMES.HEALTH_RECORDS, id);
        showToast('تم حذف القراءة من السجل الصحي', 'info');
        await renderModalContent();
        if (typeof onRefreshApp === 'function') await onRefreshApp();
      });
    });
  };

  openModal({
    title: `${def.icon} تفاصيل ${def.labelAr}`,
    bodyHtml: `<div style="padding:18px;text-align:center;">جارٍ تحميل السجل والرسوم البيانية...</div>`,
    onMount: () => {
      renderModalContent();
    }
  });
}

/**

  const diag = syncStatus.diagnostics || YawmiHealthAPI.diagnoseRuntimeCapabilities();

        </div>
        <div>• <strong>البيئة الحالية:</strong> ${escapeHtml(diag.environmentLabelAr)}</div>
        <div>• <strong>إضافة الأندرويد الأصلية (Kotlin APK Plugin):</strong> <span style="color:${diag.isNativeAndroidApk ? 'var(--color-success)' : 'var(--color-danger)'};font-weight:700;">${diag.isNativeAndroidApk ? 'محمّلة ومتصلة ✓' : 'غير محمّلة (لأنك تفتح ملف HTML داخل شاشة المعاينة وليس كتطبيق APK مثبّت)'}</span></div>
        <div>• <strong>بلوتوث المتصفح (Web Bluetooth API):</strong> <span style="color:${diag.canRealBleScanNow ? 'var(--color-success)' : 'var(--color-danger)'};font-weight:700;">${diag.canRealBleScanNow ? 'متاح للمسح الحقيقي ✓' : 'محجوب داخل نافذة المعاينة المعزولة (WebView Iframe)'}</span></div>
        <div>• <strong>خدمة Android Health Connect:</strong> <span style="color:${diag.canRealHealthConnectNow ? 'var(--color-success)' : 'var(--color-danger)'};font-weight:700;">${diag.canRealHealthConnectNow ? 'متاحة ✓' : 'غير متاحة لصفحات الويب (تتطلب حصريًا تثبيت ملف APK الأصلي)'}</span></div>
      </div>

      <div class="card" style="display:flex;flex-direction:column;gap:8px;">
        <div style="font-weight:800;font-size:0.88rem;">🛠️ كيف تشغّل الربط الفعلي الحقيقي على هاتفك؟</div>
        <div style="font-size:0.78rem;color:var(--text-secondary);line-height:1.6;">
          <div><strong>1) لتشغيل Health Connect + البلوتوث الأصلي الكامل (APK):</strong></div>
          <div>نظام أندرويد يمنع أي صفحة ويب (HTML) من قراءة <code>Health Connect</code>، ويشترط أن يكون التطبيق مثبّتًا كحزمة <strong>APK</strong> موقّعة. أضفنا لك داخل أرشيف المشروع <code>YAWMI_v1.0_Project.zip</code> ملف بناء سحابي تلقائي (<code>.github/workflows/build-android-apk.yml</code>): بمجرد رفع المشروع إلى حساب GitHub مجاني، يبني لك ملف <strong><code>YAWMI-debug.apk</code></strong> جاهزًا للتثبيت على هاتفك دون الحاجة لحاسوب.</div>
          <div style="margin-top:6px;"><strong>2) لتجربة Web Bluetooth الحقيقي في متصفح Chrome:</strong></div>
          <div>حمل ملف <code>yawmi_app.html</code> وافتحه في متصفح <strong>Google Chrome</strong> الخارجي (عبر خادم محلي أو HTTPS) ليفتح لك نافذة اقتران البلوتوث الحقيقية للنظام.</div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;">
          <button type="button" class="btn btn-primary btn-sm" id="diag-download-html-btn">
            📥 تنزيل yawmi_app.html لفتحه في Chrome
          </button>
          <button type="button" class="btn btn-danger btn-sm" id="diag-reset-clean-btn">
            🧹 تصفير ومسح أي أجهزة أو بيانات سابقة
          </button>

      </div>

      <div class="card" style="display:flex;flex-direction:column;gap:8px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-weight:800;font-size:0.86rem;">🚶 مستشعر تسارع الهاتف الفعلي (لا يُحسب كسوار)</span>

          </span>
        </div>
        <div style="font-size:0.78rem;color:var(--text-secondary);" id="wiz-ped-stats">
          إشارات المستشعر المستلمة: <strong>${ped.motionEventsReceived || 0}</strong> • الخطوات الفعلية: <strong>${ped.steps} خطوة</strong>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">
          <button type="button" class="btn btn-secondary btn-sm" id="wiz-ped-toggle-btn">
            ${ped.isRunning ? 'إيقاف مستشعر الهاتف' : 'تشغيل مستشعر المشي الفعلي'}
          </button>
          <button type="button" class="btn btn-primary btn-sm" id="wiz-ped-sync-btn">

          </button>
        </div>
      </div>

    title: '🔍 تشخيص العتاد وتفعيل الاتصال الحقيقي',
    bodyHtml,
    footerHtml: `<button type="button" class="btn btn-secondary" id="wiz-close-btn">إغلاق</button>`,
    onMount: () => {
      document.getElementById('wiz-close-btn')?.addEventListener('click', closeModal);

      document.getElementById('diag-download-html-btn')?.addEventListener('click', () => {
        const htmlContent = '<' + '!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'yawmi_app.html';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2500);
        showToast('تم بدء تنزيل yawmi_app.html لفتحه خارج نافذة المعاينة', 'info');
      });

      document.getElementById('diag-reset-clean-btn')?.addEventListener('click', async () => {
        await YawmiHealthAPI.revokeConsentAndClearHealthData();
        await patchHealthSyncState({ consentGranted: true });
        HealthConnectService.setUiStateCode('unlinked');
        closeModal();
        showToast('تم مسح جميع الأجهزة والبيانات السابقة وإعادة الحالة إلى «غير مرتبط» بصدق ✓', 'info');
        if (typeof onCompleted === 'function') await onCompleted();
      });

      const refreshPedUi = (m) => {
        const statsEl = document.getElementById('wiz-ped-stats');
        const badgeEl = document.getElementById('wiz-ped-badge');
        const toggleBtn = document.getElementById('wiz-ped-toggle-btn');
        if (statsEl) {
          statsEl.innerHTML = `إشارات المستشعر المستلمة: <strong>${m.motionEventsReceived || 0}</strong> • الخطوات الفعلية: <strong>${m.steps} خطوة</strong>`;
        }
        if (badgeEl) {
          badgeEl.className = `badge ${m.isRunning ? 'badge-success' : 'badge-low'}`;
          badgeEl.textContent = m.isRunning ? 'يقرأ اهتزاز المشي الفعلي ✓' : 'متوقف';
        }
        if (toggleBtn) {
          toggleBtn.textContent = m.isRunning ? 'إيقاف مستشعر الهاتف' : 'تشغيل مستشعر المشي الفعلي';
        }
      };

      document.getElementById('wiz-ped-toggle-btn')?.addEventListener('click', () => {
        try {
          if (YawmiHealthAPI.PhoneSensorPedometer.isRunning) {
            YawmiHealthAPI.PhoneSensorPedometer.stop();
            refreshPedUi(YawmiHealthAPI.PhoneSensorPedometer.getMetrics());
            showToast('تم إيقاف مستشعر الهاتف', 'info');
          } else {
            YawmiHealthAPI.PhoneSensorPedometer.start(refreshPedUi);
            refreshPedUi(YawmiHealthAPI.PhoneSensorPedometer.getMetrics());
            showToast('تم تشغيل مستشعر الحركة؛ امشِ بالهاتف لالتقاط الخطوات الحقيقية', 'info');
          }
        } catch (err) {
          showToast(err.message, 'error');
        }
      });

      document.getElementById('wiz-ped-sync-btn')?.addEventListener('click', async () => {
        try {
          await YawmiHealthAPI.PhoneSensorPedometer.syncToDatabase();
          closeModal();
          showToast('تم حفظ الخطوات الملتقطة فعليًا من مستشعر الهاتف ✓', 'success');
          if (typeof onCompleted === 'function') await onCompleted();
        } catch (err) {
          showToast(err.message, 'warning');
        }
      });
    }
  });
}

/**

async function renderHealthView(containerEl, onRefreshApp, options = {}) {
  // إعادة التحقق من الصلاحيات المحفوظة عند فتح قسم الصحة في بيئة Android الأصلية
  if (!options.skipPermissionRecheck && YawmiHealthAPI.isNativeAndroidAvailable()) {
    try {
      await HealthConnectService.checkPermissions();
    } catch {
      // ignore check error on view load
    }
  }

  const [syncStatus, allRecords, allHabits, allHabitLogs] = await Promise.all([
    YawmiHealthAPI.getSyncStatus(),
    getAllRecords(STORE_NAMES.HEALTH_RECORDS),
    getAllRecords(STORE_NAMES.HABITS),
    getAllRecords(STORE_NAMES.HABIT_LOGS)
  ]);

  const activeDevice = syncStatus.primaryDevice;
  const activeFamily = activeDevice?.family || null;

  const summary = HealthNormalizer.summarizePeriod(allRecords, {
    referenceDate: healthViewState.referenceDate,
    period: healthViewState.period,
    activeDeviceFamily: activeFamily
  });

  const m = summary.metrics;
  const chartMetricDef = HEALTH_METRIC_DEFS[healthViewState.chartMetric] || HEALTH_METRIC_DEFS.steps;
  const activeChartSeries = summary.buildChartSeries(healthViewState.chartMetric);

  const walkingHabit = allHabits.find(h => h.status === 'active' && /مشي|خطوات|رياضة|تمرين/i.test(h.name));
  const walkingHabitStats = walkingHabit
    ? HabitsRepo.calculateHabitStats(walkingHabit, allHabitLogs, healthViewState.referenceDate)
    : null;

  containerEl.innerHTML = `
    <!-- شريط التحكم العلوي في قسم الصحة: الفلاتر الزمنية (اليوم / الأسبوع / الشهر) + التاريخ + زر الزائد (+) لإضافة أي شيء يخص الصحة -->

      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <div>
          <h2 class="section-title" style="margin:0;font-size:1.1rem;">❤️ صحتي ونشاطي اليومي</h2>
          <div style="font-size:0.75rem;color:var(--text-muted);margin-top:2px;">اضغط زر (+) لإضافة وجبة أو قياس صحي أو عادة</div>
        </div>
        <button type="button" class="health-fab-btn" id="health-plus-add-btn" title="إضافة في الصحة" aria-label="إضافة في الصحة">
          ${getIconSvg('plus', 22)}

      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
        <div class="segmented-tabs" style="flex:1;">
          <button type="button" class="seg-tab ${healthViewState.period === 'day' ? 'active' : ''}" data-health-period="day">اليوم</button>
          <button type="button" class="seg-tab ${healthViewState.period === 'week' ? 'active' : ''}" data-health-period="week">الأسبوع</button>
          <button type="button" class="seg-tab ${healthViewState.period === 'month' ? 'active' : ''}" data-health-period="month">الشهر</button>
        </div>
        <input type="date" id="health-ref-date" class="form-input" style="width:auto;padding:7px 10px;font-size:0.82rem;" value="${escapeHtml(healthViewState.referenceDate)}" aria-label="تاريخ عرض الصحة">
      </div>
    </div>

    <!-- بطاقات المؤشرات الصحية (الخطوات، المسافة، السعرات، معدل القلب، النوم، الوزن، التمارين، الأكسجين) -->
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;">
      <!-- 1. بطاقة الخطوات -->
      <div class="card card-interactive" data-open-metric="steps" style="display:flex;flex-direction:column;gap:6px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:0.8rem;font-weight:700;color:var(--text-secondary);">👣 الخطوات</span>
          <span class="badge ${m.steps.available ? 'badge-success' : 'badge-low'}">${m.steps.available ? 'متاح' : 'لا توجد بيانات'}</span>
        </div>
        <div style="font-size:1.15rem;font-weight:800;color:${m.steps.available ? 'var(--text-primary)' : 'var(--text-muted)'};">
          ${escapeHtml(m.steps.displayText)}
        </div>
        <div style="font-size:0.72rem;color:var(--text-muted);">
          ${m.steps.sourceNameAr ? `المصدر: ${escapeHtml(m.steps.sourceNameAr)}` : 'التجميع الموحد (دون مضاعفة)'}

/**
 * تحليل بصري ذكي للصورة المرفوعة (الألوان السائدة + اسم الملف) لاقتراح نوع الأكل تلقائيًا
 */
function detectFoodFromImageAndCanvas(canvas, fileName = '') {
  const lowerName = String(fileName || '').toLowerCase();
  for (const item of FOOD_CALORIE_DATABASE) {
    if (item.keywords && item.keywords.some(kw => lowerName.includes(kw))) {
      return { matched: item, reasonAr: 'تم التعرف من بيانات الصورة واسمها' };
    }
  }

  try {
    const ctx = canvas.getContext('2d');
    const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    let rSum = 0, gSum = 0, bSum = 0, count = 0;
    for (let i = 0; i < data.length; i += 16) {
      rSum += data[i];
      gSum += data[i + 1];
      bSum += data[i + 2];
      count++;
    }
    const r = rSum / Math.max(count, 1);
    const g = gSum / Math.max(count, 1);
    const b = bSum / Math.max(count, 1);

    let profile = 'golden_brown';
    if (g > r * 1.08 && g > b * 1.15) {
      profile = 'green';
    } else if (r > g * 1.25 && r > 130) {
      profile = 'red_orange';
    } else if (r > 195 && g > 195 && b > 185) {
      profile = 'light_neutral';
    } else if (r > 170 && g > 145 && b < 120) {
      profile = 'warm_yellow';
    } else if (r < 130 && g < 105 && b < 90) {
      profile = 'brown';
    }

    const candidates = FOOD_CALORIE_DATABASE.filter(x => x.colorProfile === profile);
    const chosen = candidates[0] || FOOD_CALORIE_DATABASE[0];
    return {
      matched: chosen,
      reasonAr: 'تم تحليل الصورة بصريًا واقتراح نوع الأكل الأقرب (يمكنك تعديله من القائمة)'
    };
  } catch {
    return { matched: FOOD_CALORIE_DATABASE[0], reasonAr: 'تم فتح الصورة بنجاح' };
  }
}

        <div class="form-group">
          <label class="form-label" for="food-custom-kcal100">السعرات لكل 100 غرام</label>
          <input type="number" id="food-custom-kcal100" class="form-input" value="200" min="1">
        </div>
      </div>

      <!-- بطاقة النتيجة الفورية للسعرات والقيم الغذائية -->
      <div class="card" id="food-calc-result-card" style="background:var(--bg-surface-muted);border-color:var(--color-accent);">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
          <span style="font-weight:800;font-size:0.9rem;">🔥 إجمالي السعرات الحرارية للوجبة:</span>
          <span id="food-total-kcal-badge" style="font-size:1.25rem;font-weight:800;color:var(--color-accent);">495 kcal</span>
        </div>
        <div id="food-macros-row" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;font-size:0.76rem;color:var(--text-secondary);">
          <div style="background:var(--bg-surface);padding:6px;border-radius:8px;">🥩 بروتين: <strong id="food-macro-p">22.5 غ</strong></div>
          <div style="background:var(--bg-surface);padding:6px;border-radius:8px;">🍞 كربوهيدرات: <strong id="food-macro-c">69.0 غ</strong></div>
          <div style="background:var(--bg-surface);padding:6px;border-radius:8px;">🥑 دهون: <strong id="food-macro-f">13.5 غ</strong></div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="food-meal-note">ملاحظات إضافية حول الوجبة (اختياري)</label>
        <input type="text" id="food-meal-note" class="form-input" placeholder="مثال: وجبة الغداء / العشاء...">
      </div>
    </div>
  `;

  const footerHtml = `
    <button type="button" class="btn btn-secondary" id="food-modal-cancel">إلغاء</button>
    <button type="button" class="btn btn-primary" id="food-modal-save">🍲 حفظ الأكل والسعرات</button>
  `;

  openModal({
    title: '🍲 إضافة أكل وحساب السعرات',
    bodyHtml,
    footerHtml,
    onMount: () => {
      const selectEl = document.getElementById('food-item-select');
      const gramsEl = document.getElementById('food-grams-input');
      const customWrap = document.getElementById('food-custom-fields');
      const customNameEl = document.getElementById('food-custom-name');
      const customKcalEl = document.getElementById('food-custom-kcal100');

      const computeCurrentMeal = () => {
        const selectedId = selectEl?.value || 'couscous_meat';
        const grams = Math.max(1, Number(gramsEl?.value || 100));
        if (selectedId === 'custom') {
          if (customWrap) customWrap.style.display = 'grid';
          const kcal100 = Math.max(1, Number(customKcalEl?.value || 200));
          const totalKcal = Math.round((kcal100 * grams) / 100);
          return {
            nameAr: customNameEl?.value?.trim() || 'وجبة غذائية مخصصة',
            grams,
            totalKcal,
            protein: Math.round(totalKcal * 0.05 * 10) / 10,
            carbs: Math.round(totalKcal * 0.12 * 10) / 10,
            fat: Math.round(totalKcal * 0.03 * 10) / 10
          };
        }
        if (customWrap) customWrap.style.display = 'none';
        const found = FOOD_CALORIE_DATABASE.find(x => x.id === selectedId) || FOOD_CALORIE_DATABASE[0];
        const ratio = grams / 100;
        return {
          nameAr: found.nameAr,
          grams,
          totalKcal: Math.round(found.kcalPer100g * ratio),
          protein: Math.round(found.protein * ratio * 10) / 10,
          carbs: Math.round(found.carbs * ratio * 10) / 10,
          fat: Math.round(found.fat * ratio * 10) / 10
        };
      };

      const updateMacroPreview = () => {
        const res = computeCurrentMeal();
        const badge = document.getElementById('food-total-kcal-badge');
        const pEl = document.getElementById('food-macro-p');
        const cEl = document.getElementById('food-macro-c');
        const fEl = document.getElementById('food-macro-f');
        if (badge) badge.textContent = `${res.totalKcal} kcal`;
        if (pEl) pEl.textContent = `${res.protein} غ`;
        if (cEl) cEl.textContent = `${res.carbs} غ`;
        if (fEl) fEl.textContent = `${res.fat} غ`;
      };

      selectEl?.addEventListener('change', () => {
        const found = FOOD_CALORIE_DATABASE.find(x => x.id === selectEl.value);
        if (found && gramsEl) gramsEl.value = found.defaultGrams;
        updateMacroPreview();
      });
      gramsEl?.addEventListener('input', updateMacroPreview);
      customNameEl?.addEventListener('input', updateMacroPreview);
      customKcalEl?.addEventListener('input', updateMacroPreview);

      const handleImageFile = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 480;
            let w = img.width;
            let h = img.height;
            if (w > h && w > maxDim) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else if (h > maxDim) {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            attachedImageDataUrl = canvas.toDataURL('image/jpeg', 0.78);

            // التعرف على نوع الأكل من الصورة وتحديث القائمة تلقائيًا
            const detection = detectFoodFromImageAndCanvas(canvas, file.name);
            if (detection.matched && selectEl) {
              selectEl.value = detection.matched.id;
              if (gramsEl) gramsEl.value = detection.matched.defaultGrams;
              updateMacroPreview();
            }

            const previewBox = document.getElementById('food-photo-preview-box');
            const previewImg = document.getElementById('food-photo-img');
            const detTitle = document.getElementById('food-detected-title');
            const detSub = document.getElementById('food-detected-sub');
            if (previewBox && previewImg) {
              previewImg.src = attachedImageDataUrl;
              previewBox.style.display = 'flex';
            }
            if (detTitle && detection.matched) {
              detTitle.textContent = `✓ نوع الأكل المقترح: ${detection.matched.nameAr}`;
            }
            if (detSub && detection.reasonAr) {
              detSub.textContent = detection.reasonAr;
            }
            showToast(`تم فتح الصورة والتعرف على: ${detection.matched?.nameAr || 'الوجبة'} 🍲`, 'success');
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      };

      document.getElementById('food-camera-capture-input')?.addEventListener('change', (e) => {
        handleImageFile(e.target.files?.[0]);
      });
      document.getElementById('food-gallery-file-input')?.addEventListener('change', (e) => {
        handleImageFile(e.target.files?.[0]);
      });

      document.getElementById('food-modal-cancel')?.addEventListener('click', () => {
        closeModal();
      });

      document.getElementById('food-modal-save')?.addEventListener('click', async () => {
        const meal = computeCurrentMeal();
        const extraNote = document.getElementById('food-meal-note')?.value?.trim() || '';
        const nowIso = new Date().toISOString();
        const todayStr = getLocalDateString();

        // 1. حفظ السعرات في السجل الصحي الموحد
        await HealthNormalizer.ingestHealthRecords([
          {
            metricType: 'calories',
            value: meal.totalKcal,
            unit: 'سعرة (kcal)',
            startTime: nowIso,
            endTime: nowIso,
            localDate: todayStr,
            sourceType: 'manual_verified',
            deviceModel: `وجبة غذائية: ${meal.nameAr} (${meal.grams} غ)`
          }
        ]);

        // 2. حفظ بطاقة الوجبة مع الصورة المرفقة والقيم الغذائية في دفتر الملاحظات للرجوع إليها
        await NotesRepo.saveNote({
          title: `🍲 وجبة: ${meal.nameAr} (${meal.totalKcal} سعرة)`,
          content: `الكمية: ${meal.grams} غرام | السعرات: ${meal.totalKcal} kcal | بروتين: ${meal.protein}غ | كربوهيدرات: ${meal.carbs}غ | دهون: ${meal.fat}غ.${extraNote ? '\nملاحظة: ' + extraNote : ''}${attachedImageDataUrl ? '\n[تم إرفاق صورة الوجبة محليًا]' : ''}`,
          noteType: 'text',
          category: 'تغذية وسعرات',
          tags: ['سعرات', 'غذاء', 'صحة'],
          foodImageDataUrl: attachedImageDataUrl || null
        });

        closeModal();
        showToast(`تم تسجيل وجبة «${meal.nameAr}» (${meal.totalKcal} سعرة حرارية) بنجاح ✓`, 'success', 4200);
        if (typeof onSaved === 'function') await onSaved();
      });
    }
  });
}

function openCustomizeDashboardModal(onSaved) {
  const cards = structuredClone(appState.dashboardCards);

  const renderListHtml = () => cards.map((c, idx) => `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--bg-surface-muted);border:1px solid var(--border-color);border-radius:var(--radius-sm);">
      <label style="display:flex;align-items:center;gap:10px;font-weight:700;font-size:0.88rem;cursor:pointer;">
        <input type="checkbox" data-card-vis="${idx}" ${c.visible ? 'checked' : ''} style="width:18px;height:18px;accent-color:var(--color-primary);">
        <span>${escapeHtml(c.labelAr)}</span>
      </label>
      <div style="display:flex;gap:4px;">
        <button type="button" class="icon-btn" style="width:30px;height:30px;" data-move-up="${idx}" ${idx === 0 ? 'disabled' : ''}>↑</button>
        <button type="button" class="icon-btn" style="width:30px;height:30px;" data-move-down="${idx}" ${idx === cards.length - 1 ? 'disabled' : ''}>↓</button>
      </div>
    </div>
  `).join('');

  const bodyHtml = `
    <p style="font-size:0.82rem;color:var(--text-secondary);margin-bottom:10px;">
      رتّب أقسام الصفحة الرئيسية أو أخفِ ما لا تحتاج إليه. تُحفظ تفضيلاتك محليًا تلقائيًا.
    </p>
    <div id="customize-cards-list" class="item-list">${renderListHtml()}</div>
  `;

  const footerHtml = `
    <button type="button" class="btn btn-secondary" id="cust-cancel">إلغاء</button>
    <button type="button" class="btn btn-primary" id="cust-save">حفظ الترتيب</button>
  `;

  openModal({
    title: 'تخصيص بطاقات الصفحة الرئيسية',
    bodyHtml,
    footerHtml,
    onMount: () => {
      const listEl = document.getElementById('customize-cards-list');
      const bindEvents = () => {
        listEl.querySelectorAll('[data-card-vis]').forEach(cb => {
          cb.addEventListener('change', () => {
            const idx = Number(cb.getAttribute('data-card-vis'));
            cards[idx].visible = cb.checked;
          });
        });
        listEl.querySelectorAll('[data-move-up]').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = Number(btn.getAttribute('data-move-up'));
            if (idx > 0) {
              const tmp = cards[idx - 1];
              cards[idx - 1] = cards[idx];
              cards[idx] = tmp;
              listEl.innerHTML = renderListHtml();
              bindEvents();
            }
          });
        });
        listEl.querySelectorAll('[data-move-down]').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = Number(btn.getAttribute('data-move-down'));
            if (idx < cards.length - 1) {
              const tmp = cards[idx + 1];
              cards[idx + 1] = cards[idx];
              cards[idx] = tmp;
              listEl.innerHTML = renderListHtml();
              bindEvents();
            }
          });
        });
      };
      bindEvents();

      document.getElementById('cust-cancel')?.addEventListener('click', closeModal);
      document.getElementById('cust-save')?.addEventListener('click', async () => {
        appState.dashboardCards = cards;
        saveCachedPreferences();
        closeModal();
        showToast('تم حفظ ترتيب بطاقات الرئيسية', 'success');
        if (typeof onSaved === 'function') await onSaved();
      });
    }
  });
}
async function renderDashboardView(containerEl, onRefreshApp) {
  const todayStr = getLocalDateString();
  const [tasks, events, transactions, habits, habitLogs, upcomingReminders, assistantAnalysis, healthRecords, healthSync] = await Promise.all([
    getAllRecords(STORE_NAMES.TASKS),
    getAllRecords(STORE_NAMES.EVENTS),
    getAllRecords(STORE_NAMES.TRANSACTIONS),
    getAllRecords(STORE_NAMES.HABITS),
    getAllRecords(STORE_NAMES.HABIT_LOGS),
    NotificationsService.getUpcomingReminders(),
    LocalAssistant.analyzeWorkspace({
      referenceDateStr: todayStr,
      weights: appState.assistantWeights,
      dismissedSuggestionIds: appState.dismissedSuggestionIds
    }),
    getAllRecords(STORE_NAMES.HEALTH_RECORDS),
    YawmiHealthAPI.getSyncStatus()
  ]);
  const todayHealth = HealthNormalizer.summarizePeriod(healthRecords, { referenceDate: todayStr, period: 'day', activeDeviceFamily: healthSync.primaryDevice?.family || null });

  // Calculate strict metrics from yawmiDB
  const totalTasksCount = tasks.length;
  const completedTasksCount = tasks.filter(t => t.status === 'completed').length;
  const remainingTasksCount = tasks.filter(t => t.status !== 'completed').length;
  const progressPct = totalTasksCount > 0 ? Math.round((completedTasksCount / totalTasksCount) * 100) : 0;

  const upcomingEvents = events
    .filter(ev => (ev.endDate || ev.startDate) >= todayStr)
    .sort((a, b) => {
      const d = String(a.startDate).localeCompare(String(b.startDate));
      if (d !== 0) return d;
      return String(a.startTime || '').localeCompare(String(b.startTime || ''));
    });

  const todayFinance = FinanceRepo.calculateSummary(transactions, {
    startDate: todayStr,
    endDate: todayStr
  });
  const monthFinance = FinanceRepo.calculateSummary(transactions, {
    month: todayStr.slice(0, 7)
  });

  const topOpenTasks = TasksRepo.filterAndSortTasks(tasks, { status: 'open', sortBy: 'priority' }, todayStr).slice(0, 4);
  const activeHabits = habits.filter(h => h.status === 'active');

  const hour = new Date().getHours();
  const greetingText = hour < 17 ? t('greeting_morning') : t('greeting_evening');

  // Render individual reorderable dashboard sections
  const sectionBuilders = {
    urgentTasks: () => `
      <section>
        <div class="section-header">
          <h2 class="section-title">${escapeHtml(t('top_tasks'))}</h2>
          <button type="button" class="section-link" data-dash-nav="planning" data-sub="tasks">${escapeHtml(t('view_all'))}</button>
        </div>
        <div class="item-list">
          ${topOpenTasks.length === 0
            ? `
              <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
                <div>
                  <div style="font-weight:700;font-size:0.9rem;">${escapeHtml(t('no_tasks_today'))}</div>
                  <div style="font-size:0.78rem;color:var(--text-muted);">ابدأ يومك بإضافة مهامك الحقيقية الآن.</div>
                </div>
                <button type="button" class="btn btn-primary btn-sm" id="dash-add-first-task-btn">+ مهمة</button>
              </div>
            `
            : topOpenTasks.map(task => renderTaskCardRow(task)).join('')
          }
        </div>
      </section>
    `,

    assistantSuggestion: () => {
      const sug = assistantAnalysis.topSuggestion;
      if (!sug) return '';
      return `
        <section class="card" style="border-color:rgba(16,185,129,0.35);background:var(--bg-surface-elevated);">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
            <span class="badge badge-success">✨ ${escapeHtml(t('assistant_suggestion'))}</span>
            <button type="button" class="section-link" id="dash-dismiss-suggestion" data-sug-id="${escapeHtml(sug.id)}" style="font-size:0.75rem;">تجاهل</button>

          <div style="display:flex;gap:8px;">

    healthSummary: () => {

      const bandName = healthSync.primaryDevice ? healthSync.primaryDevice.name : 'لا يوجد سوار محفوظ';

    upcomingReminders: () => `

          <h3 class="section-title" style="font-size:0.95rem;">🔔 ${escapeHtml(t('upcoming_reminders'))}</h3>
          <span class="badge badge-low">${upcomingReminders.length}</span>
        </div>
        ${upcomingReminders.length === 0

        }
      </section>
    `
  };

  const orderedSectionsHtml = appState.dashboardCards
    .filter(c => c.visible && sectionBuilders[c.id])
    .map(c => sectionBuilders[c.id]())
    .join('');

  containerEl.innerHTML = `
    <div class="hero-dashboard">
      <div class="hero-top-row">
        <div>
          <div class="hero-date-text">${escapeHtml(formatReadableDate(todayStr, appState.language))}</div>
          <h1 class="hero-greeting">${escapeHtml(greetingText)}</h1>
        </div>
        <button type="button" class="hero-customize-btn" id="hero-customize-cards-btn" title="تخصيص بطاقات الرئيسية" aria-label="تخصيص بطاقات الرئيسية">
          ${getIconSvg('tune', 20)}
        </button>

      <div class="hero-progress-box">
        <div class="hero-progress-header">
          <div class="hero-progress-label">
            <span style="color:var(--color-gold);">${getIconSvg('target', 20)}</span>
            <span>${escapeHtml(t('today_progress'))}</span>
          </div>
          <div class="hero-progress-pct">${progressPct}%</div>
        </div>
        <div class="hero-progress-track">
          <div class="hero-progress-fill" style="width:${progressPct}%;"></div>

        <div class="hero-progress-sub">
          <span>${escapeHtml(t('tasks_completed_of', { done: completedTasksCount, total: totalTasksCount }))}</span>
          <span>${escapeHtml(t('tasks_remaining', { count: remainingTasksCount }))}</span>
        </div>
      </div>

      <div class="hero-metrics-grid">
        <div class="hero-metric-card" data-dash-nav="planning" data-sub="calendar">
          <div class="hero-metric-icon">${getIconSvg('calendar', 20)}</div>
          <div class="hero-metric-val">${upcomingEvents.length}</div>
          <div class="hero-metric-label">${escapeHtml(t('upcoming_events'))}</div>
        </div>
        <div class="hero-metric-card" data-dash-nav="finance">
          <div class="hero-metric-icon">${getIconSvg('wallet', 20)}</div>
          <div class="hero-metric-val">${escapeHtml((todayFinance.expenseMinor / 100).toLocaleString('en-US'))}</div>
          <div class="hero-metric-label">${escapeHtml(t('today_expense'))}</div>
        </div>
      </div>
    </div>

    ${orderedSectionsHtml}
  `;

  document.getElementById('hero-customize-cards-btn')?.addEventListener('click', () => {
    openCustomizeDashboardModal(onRefreshApp);
  });

  document.getElementById('dash-add-first-task-btn')?.addEventListener('click', () => {
    openTaskFormModal(null, onRefreshApp);
  });

  document.getElementById('dash-dismiss-suggestion')?.addEventListener('click', (e) => {
    e.stopPropagation();
    const sugId = e.currentTarget.getAttribute('data-sug-id');
    if (sugId) {
      appState.dismissedSuggestionIds.push(sugId);
      renderDashboardView(containerEl, onRefreshApp);
    }
  });

  document.getElementById('dash-exec-suggestion')?.addEventListener('click', (e) => {
    const route = e.currentTarget.getAttribute('data-route') || 'planning';
    const sub = e.currentTarget.getAttribute('data-sub') || 'tasks';
    navigateTo(route, { planningSubTab: sub, financeSubTab: sub });
  });

  containerEl.querySelectorAll('[data-dash-nav]').forEach(el => {
    el.addEventListener('click', () => {
      const route = el.getAttribute('data-dash-nav');
      const sub = el.getAttribute('data-sub');
      const more = el.getAttribute('data-more');
      navigateTo(route, {
        planningSubTab: sub || undefined,
        moreSubView: more || undefined
      });
    });
  });

  bindTaskRowEvents(containerEl, onRefreshApp);
}

      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:0.84rem;font-weight:700;cursor:pointer;">

    <button type="button" class="btn btn-primary" id="wdev-save">حفظ ملف الجهاز</button>
  `;

        else nameEl.value = 'سوار ذكي BLE';

/**
 * نافذة إعداد مفتاح المصادقة الآمن (Android Keystore) وتفاصيل بروتوكول السوار
 */
async function openWearableProtocolAndAuthModal(deviceId, onSaved) {
  const dev = await YawmiHealthAPI.getDeviceStatus(deviceId);
  if (!dev) return;
  const prof = dev.capabilityProfile || DEVICE_CAPABILITY_PROFILES.xiaomi_band_10;

  const bodyHtml = `
    <div class="form-grid">
      <div class="card" style="background:var(--bg-surface-muted);font-size:0.81rem;line-height:1.6;">
        <div><strong>الجهاز:</strong> ${escapeHtml(dev.name)} (${escapeHtml(prof.modelCode)})</div>
        <div><strong>البروتوكول الفعلي:</strong> ${escapeHtml(prof.protocolName)}</div>
        <div><strong>التطبيق الرسمي الموافق:</strong> ${escapeHtml(prof.officialApp)}</div>
        <div style="margin-top:6px;"><strong>القياسات المدعومة:</strong> ${escapeHtml(prof.supportedMetrics.map(k => HEALTH_METRIC_DEFS[k]?.labelAr || k).join('، '))}</div>
        <div style="color:var(--color-danger);"><strong>غير مدعوم:</strong> ${escapeHtml(prof.unsupportedMetrics.map(k => HEALTH_METRIC_DEFS[k]?.labelAr || k).join('، ') || 'لا يوجد')}</div>
      </div>

      <div style="font-size:0.79rem;color:var(--text-secondary);background:var(--bg-surface-muted);padding:10px 12px;border-radius:var(--radius-sm);border-inline-start:3px solid var(--color-warning);">
        <strong>قيود تقنية موثقة (Gadgetbridge & Official Docs):</strong>
        <ul style="margin-top:4px;padding-inline-start:16px;list-style:disc;">
          ${prof.limitationsAr.map(lim => `<li>${escapeHtml(lim)}</li>`).join('')}
        </ul>
      </div>

      <div class="form-group">
        <label class="form-label" for="wauth-secret-input">
          ${dev.family === 'xiaomi_band_10' ? 'مفتاح المصادقة (Auth Key 32-Hex مسبوق بـ 0x)' : 'معرّف حساب Huawei للتعايش دون فرمتة (17-digit HUID - اختياري)'}
        </label>
        <div style="display:flex;gap:6px;">
          <input type="text" id="wauth-secret-input" class="form-input" style="flex:1;" dir="ltr" autocomplete="off" value="${dev.family === 'xiaomi_band_10' ? '0x46fec12c98382d00aabbccddeeff0011' : '20007000023812345'}">
          <button type="button" class="btn btn-secondary btn-sm" id="wauth-gen-key-btn">توليد مفتاح</button>
        </div>
        <span style="font-size:0.73rem;color:var(--text-muted);">
          🔒 لا نطلب كلمة مرور حسابك أبدًا، ولا نخزن هذا المفتاح كنص صريح؛ يُشفر بواسطة <strong>Android Keystore (AES/GCM/NoPadding)</strong> في الإضافة الأصلية.
        </span>
      </div>
    </div>
  `;

  const footerHtml = `
    <button type="button" class="btn btn-secondary" id="wauth-close">إغلاق</button>
    <button type="button" class="btn btn-primary" id="wauth-save">التحقق وحفظ المفتاح بأمان</button>
  `;

  openModal({
    title: `بروتوكول ومصادقة ${dev.name}`,
    bodyHtml,
    footerHtml,
    onMount: () => {
      document.getElementById('wauth-close')?.addEventListener('click', closeModal);
      document.getElementById('wauth-gen-key-btn')?.addEventListener('click', () => {
        const inp = document.getElementById('wauth-secret-input');
        if (!inp) return;
        inp.value = dev.family === 'xiaomi_band_10'
          ? XiaomiBand10Protocol.generateCompliantAuthKey()
          : HonorBand4Protocol.generateCompliantHuid();
      });
      document.getElementById('wauth-save')?.addEventListener('click', async () => {
        const val = document.getElementById('wauth-secret-input')?.value || '';
        try {
          const res = await YawmiHealthAPI.setDeviceAuthKey(dev.id, val);
          closeModal();
          showToast(res.notice || 'تم تشفير وحفظ مفتاح المصادقة في Android Keystore بنجاح ✓', 'success', 4800);
          if (typeof onSaved === 'function') await onSaved();
        } catch (err) {
          showToast(err.message, 'error');
        }
      });
    }
  });
}

      renderAssistantView(containerEl, onRefreshApp);

  });

    const route = e.currentTarget.getAttribute('data-route') || 'planning';

    navigateTo(route, { planningSubTab: sub, financeSubTab: sub });

      overdueBonus: Number(document.getElementById('w-over').value),
      shortDurationBonus: Number(document.getElementById('w-dur').value)
    };

      consentGranted: Boolean(document.getElementById('online-ai-consent').checked),
      proxyEndpoint: document.getElementById('online-ai-endpoint').value.trim()
    };

    showToast('تم حفظ إعدادات التكامل الشبكي الاختياري', 'success');
  });

    try {

        openTasksCount: analysis.todaySummary.openTotalCount,
        overdueCount: analysis.overdueTasks.length,
        nextEventMinutes: analysis.availableMinutesBeforeNextEvent
      });
      showToast(res.advice, 'info');
    } catch (err) {
      showToast(err.message, 'warning');
    }
  });
}
async function renderGlobalReportsView(containerEl) {
  const todayStr = getLocalDateString();
  const monthKey = todayStr.slice(0, 7);
  const [tasks, events, transactions, habits, habitLogs, notes] = await Promise.all([
    getAllRecords(STORE_NAMES.TASKS),
    getAllRecords(STORE_NAMES.EVENTS),
    getAllRecords(STORE_NAMES.TRANSACTIONS),
    getAllRecords(STORE_NAMES.HABITS),
    getAllRecords(STORE_NAMES.HABIT_LOGS),
    getAllRecords(STORE_NAMES.NOTES)
  ]);

  const completedTasks = tasks.filter(t => t.status === 'completed').length;
  const taskCompletionRate = tasks.length > 0 ? Math.round((completedTasks / tasks.length) * 100) : 0;
  const monthFin = FinanceRepo.calculateSummary(transactions, { month: monthKey });
  const activeHabits = habits.filter(h => h.status === 'active');
  const avgHabitAdherence = activeHabits.length > 0
    ? Math.round(
        activeHabits.reduce((acc, h) => acc + HabitsRepo.calculateHabitStats(h, habitLogs, todayStr).adherencePercent, 0) /
        activeHabits.length
      )
    : 0;

  containerEl.innerHTML = `
    <div class="card">
      <h3 class="section-title" style="margin-bottom:10px;">📊 التقرير الشامل للإنتاجية والحياة اليومية</h3>
      <div class="kpi-grid-3">
        <div class="kpi-box">
          <div class="kpi-box-label">إنجاز المهام</div>
          <div class="kpi-box-val">${taskCompletionRate}% (${completedTasks}/${tasks.length})</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-box-label">التزام العادات</div>
          <div class="kpi-box-val">${avgHabitAdherence}%</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-box-label">المواعيد والملاحظات</div>
          <div class="kpi-box-val">${events.length} موعد • ${notes.length} ملاحظة</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h4 class="section-title" style="margin-bottom:8px;">الملخص المالي لشهر ${escapeHtml(monthKey)}</h4>
      <div style="display:flex;flex-direction:column;gap:6px;font-size:0.88rem;">
        <div style="display:flex;justify-content:space-between;">
          <span>إجمالي الدخل المسجل:</span>
          <strong style="color:var(--color-success);">${escapeHtml(formatMoney(monthFin.incomeMinor, appState.currency))}</strong>
        </div>
        <div style="display:flex;justify-content:space-between;">
          <span>إجمالي المصروفات المسجلة:</span>
          <strong style="color:var(--color-danger);">${escapeHtml(formatMoney(monthFin.expenseMinor, appState.currency))}</strong>
        </div>
        <div style="display:flex;justify-content:space-between;border-top:1px solid var(--border-color);padding-top:6px;">
          <span>صافي الرصيد الشهري:</span>
          <strong>${escapeHtml(formatMoney(monthFin.netMinor, appState.currency))}</strong>
        </div>
      </div>
    </div>
  `;
}

  // === ربط أزرار بطاقة Health Connect وإعدادات الأساور الذكية ===
  const refreshSettings = () => renderSettingsView(containerEl, onRefreshApp, runInAppTestsCallback);

  document.getElementById('set-hero-hc-link-btn')?.addEventListener('click', () => {
    executeHealthConnectLinkFlow(null, onRefreshApp, refreshSettings);
  });
  document.getElementById('set-hero-retry-link-btn')?.addEventListener('click', () => {
    executeHealthConnectLinkFlow(null, onRefreshApp, refreshSettings);
  });
  document.getElementById('set-hero-sync-now-btn')?.addEventListener('click', async () => {
    try {
      if (healthSyncStatus.connectedDevice) {
        await YawmiHealthAPI.syncDeviceData(healthSyncStatus.connectedDevice.id);
        showToast('تمت مزامنة السوار المتصل بنجاح ✓', 'success');
      } else {
        const res = await HealthConnectService.syncNow(getLocalDateString());
        if (res.hasAnyDataToday) {
          showToast('تمت قراءة وتحديث بيانات Health Connect بنجاح ✓', 'success');
        } else {
          showToast('تم الربط، لا توجد بيانات متاحة لهذا اليوم في Health Connect', 'info');
        }
      }
    } catch (err) {
      showToast(err.message, 'warning', 4500);
    }
    await refreshSettings();
  });

  document.getElementById('set-open-wizard-btn')?.addEventListener('click', () => {
    openQuickWearableAndHealthConnectWizard(refreshSettings);
  });
  document.getElementById('set-ble-add-device-btn')?.addEventListener('click', () => {
    openAddWearableDeviceModal(() => renderSettingsView(containerEl, onRefreshApp, runInAppTestsCallback));
  });

  document.getElementById('set-ble-scan-btn')?.addEventListener('click', () => {
    confirmAction({
      title: 'توضيح سبب طلب أذونات Bluetooth للأجهزة القريبة',
      message: 'يحتاج تطبيق «يومي | YAWMI» إلى إذن الأجهزة القريبة (BLUETOOTH_SCAN و BLUETOOTH_CONNECT في Android 12+، أو إذن الموقع في Android 11 فما دون) للبحث عن سوار Xiaomi Smart Band 10 أو HONOR Band 4 والاتصال به فقط. لا نستخدم البلوتوث لتتبع موقعك الجغرافي.',
      confirmLabel: 'موافق، ابدأ البحث',
      danger: false,
      onConfirm: async () => {
        try {
          const found = await YawmiHealthAPI.scanDevices();
          showToast(`اكتمل المسح الفعلي: تم العثور على ${found.length} جهاز`, 'success');
        } catch (err) {
          showToast(err.message, 'warning', 5500);
          openQuickWearableAndHealthConnectWizard(() => renderSettingsView(containerEl, onRefreshApp, runInAppTestsCallback));
        }
        renderSettingsView(containerEl, onRefreshApp, runInAppTestsCallback);
      }
    });
  });

  containerEl.querySelectorAll('[data-wdev-connect]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-wdev-connect');
      try {
        await YawmiHealthAPI.connectDevice(id);
        showToast('تم الاتصال بالسوار بنجاح ✓', 'success');
      } catch (err) {
        showToast(err.message, 'warning', 5000);
      }
      renderSettingsView(containerEl, onRefreshApp, runInAppTestsCallback);
    });
  });

  containerEl.querySelectorAll('[data-wdev-disconnect]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-wdev-disconnect');
      await YawmiHealthAPI.disconnectDevice(id);
      showToast('تم قطع الاتصال بالسوار', 'info');
      renderSettingsView(containerEl, onRefreshApp, runInAppTestsCallback);
    });
  });

  containerEl.querySelectorAll('[data-wdev-sync]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-wdev-sync');
      try {
        await YawmiHealthAPI.syncDeviceData(id);
        showToast('تمت مزامنة بيانات السوار بنجاح ✓', 'success');
      } catch (err) {
        showToast(err.message, 'error');
      }
      renderSettingsView(containerEl, onRefreshApp, runInAppTestsCallback);
    });
  });

  containerEl.querySelectorAll('[data-wdev-auth]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-wdev-auth');
      openWearableProtocolAndAuthModal(id, () => renderSettingsView(containerEl, onRefreshApp, runInAppTestsCallback));
    });
  });

  containerEl.querySelectorAll('[data-wdev-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-wdev-remove');
      confirmAction({
        title: 'إزالة الجهاز المحفوظ',
        message: 'هل تريد إزالة هذا السوار من قائمة الأجهزة المحفوظة؟ (لن يتم حذف سجلاتك الصحية التاريخية).',
        confirmLabel: 'إزالة الجهاز',
        onConfirm: async () => {
          await YawmiHealthAPI.removeSavedDevice(id);
          showToast('تمت إزالة الجهاز من القائمة', 'info');
          renderSettingsView(containerEl, onRefreshApp, runInAppTestsCallback);
        }
      });
    });
  });

  document.getElementById('set-hc-connect-btn')?.addEventListener('click', () => {

      title: 'توضيح سبب طلب صلاحيات البيانات الصحية (Health Connect)',
      message: 'يطلب تطبيق «يومي | YAWMI» صلاحية القراءة فقط (Read-Only) للخطوات، المسافة، السعرات، ضربات القلب، النوم، التمارين، والأكسجين من Android Health Connect لعرض ملخصك الصحي محليًا على هاتفك دون رفعها لأي خادم.',
      confirmLabel: 'فحص وربط Health Connect',
      danger: false,
      onConfirm: async () => {
        try {
          await patchHealthSyncState({ consentGranted: true });
          const st = await YawmiHealthAPI.connectHealthConnect();
          if (st.healthConnectSdkStatus === 'requires_native_android_apk') {
            showToast(st.lastSyncError, 'warning', 5200);
          } else {
            showToast('تم التحقق من Health Connect وتحديث حالة الربط ✓', 'success');
          }
        } catch (err) {
          showToast(err.message, 'warning', 4800);
        }
        renderSettingsView(containerEl, onRefreshApp, runInAppTestsCallback);
      }
    });
  });

/**
 * YAWMI — Database Layer Automated Tests (Section 20.1)
 */
async function runDatabaseTests(assert) {
  const testDb = 'yawmi_test_db_layer';
  await initDatabase(testDb, 1);
  for (const s of Object.values(STORE_NAMES)) {
    await clearStore(s, testDb);
  }

  // 1. Database & 10 stores + indexes creation
  const meta = await getDatabaseMetadata(testDb);
  assert(meta.name === testDb, 'إنشاء قاعدة البيانات بالاسم المحدد');
  assert(meta.storeNames.length === 13, 'إنشاء جميع المخازن الثلاثة عشر المطلوبة (13 stores شاملة مخازن الصحة والأساور)');
  assert(meta.indexes.tasks.includes('dueDate') && meta.indexes.habitLogs.includes('habitDate'), 'إنشاء الفهارس المطلوبة للتاريخ والحالة والمعرفات');

  // 2. Add record
  const rec = await addRecord('tasks', { id: 't_db_1', title: 'اختبار قاعدة البيانات', status: 'open', priority: 'high' }, testDb);
  assert(rec.id === 't_db_1', 'إضافة سجل جديد بنجاح');

  // 3. Read record
  const fetched = await getRecord('tasks', 't_db_1', testDb);
  assert(fetched && fetched.title === 'اختبار قاعدة البيانات', 'قراءة السجل المحفوظ من القاعدة');

  // 4. Update record
  await updateRecord('tasks', { ...fetched, title: 'عنوان محدّث', status: 'completed' }, testDb);
  const afterUpdate = await getRecord('tasks', 't_db_1', testDb);
  assert(afterUpdate.title === 'عنوان محدّث' && afterUpdate.status === 'completed', 'تعديل السجل وحفظ التغييرات');

  // 5. Handle invalid data (missing ID or invalid store)
  let rejectedInvalid = false;
  try {
    await addRecord('tasks', { title: 'بدون معرف' }, testDb);
  } catch {
    rejectedInvalid = true;
  }
  assert(rejectedInvalid, 'رفض وحماية القاعدة من السجلات غير الصالحة (بدون معرّف id)');

  // 6. Data persistence across re-opening connection & schema upgrade v1 -> v2
  const upgradedConn = await initDatabase(testDb, 2);
  const afterUpgrade = await getRecord('tasks', 't_db_1', testDb);
  assert(Boolean(upgradedConn) && afterUpgrade && afterUpgrade.title === 'عنوان محدّث', 'الاحتفاظ بالبيانات بعد إعادة الفتح وترقية إصدار مخطط القاعدة (v1 -> v2)');

  // 7. Delete record
  await deleteRecord('tasks', 't_db_1', testDb);
  const afterDelete = await getRecord('tasks', 't_db_1', testDb);
  assert(afterDelete === null, 'حذف السجل من قاعدة البيانات بنجاح');
}

/**
 * YAWMI — Tasks Module Automated Tests (Section 20.2)
 */
async function runTasksTests(assert) {
  const testDb = 'yawmi_test_tasks_db';
  await initDatabase(testDb, 1);
  await clearStore('tasks', testDb);
  await clearStore('reminders', testDb);

  const today = '2026-10-20';
  const yesterday = '2026-10-19';
  const tomorrow = '2026-10-21';

  // 1. Add task with valid title
  const t1 = await TasksRepo.createTask({
    title: 'إنهاء التقرير المالي',
    priority: 'medium',
    dueDate: today,
    estimatedMinutes: 45
  }, testDb);
  assert(t1.id && t1.title === 'إنهاء التقرير المالي', 'إضافة مهمة بعنوان صحيح');

  // 2. Reject empty title
  let emptyRejected = false;
  try {
    await TasksRepo.createTask({ title: '   ' }, testDb);
  } catch {
    emptyRejected = true;
  }
  assert(emptyRejected, 'رفض إضافة مهمة بعنوان فارغ');

  // 3. Change priority
  const updatedPrio = await TasksRepo.updateTask(t1.id, { priority: 'urgent' }, testDb);
  assert(updatedPrio.priority === 'urgent', 'تغيير أولوية المهمة إلى عاجلة');

  // 4. Complete task
  const completed = await TasksRepo.toggleTaskCompletion(t1.id, testDb);
  assert(completed.status === 'completed' && Boolean(completed.completedAt), 'إكمال المهمة وتسجيل تاريخ الإنجاز');

  // Re-open task for search/filter tests
  await TasksRepo.toggleTaskCompletion(t1.id, testDb);

  // Add overdue and tomorrow tasks
  const tOverdue = await TasksRepo.createTask({
    title: 'تسديد فاتورة الإنترنت',
    priority: 'high',
    dueDate: yesterday
  }, testDb);

  await TasksRepo.createTask({
    title: 'شراء مستلزمات المكتب',
    priority: 'low',
    dueDate: tomorrow
  }, testDb);

  const allTasks = await getAllRecords('tasks', testDb);

  // 5. Instant search
  const searchRes = TasksRepo.filterAndSortTasks(allTasks, { query: 'فاتورة' }, today);
  assert(searchRes.length === 1 && searchRes[0].id === tOverdue.id, 'البحث الفوري في المهام');

  // 6. Filter by date (today & overdue)
  const todayRes = TasksRepo.filterAndSortTasks(allTasks, { timeScope: 'today' }, today);
  const overdueRes = TasksRepo.filterAndSortTasks(allTasks, { timeScope: 'overdue' }, today);
  assert(todayRes.length === 1 && overdueRes.length === 1, 'تصفية المهام حسب التاريخ (اليوم والمتأخرة)');

  // 7. Delete task
  await TasksRepo.deleteTask(t1.id, testDb);
  const remaining = await getAllRecords('tasks', testDb);
  assert(remaining.length === 2 && !remaining.some(x => x.id === t1.id), 'حذف المهمة بنجاح');
}
