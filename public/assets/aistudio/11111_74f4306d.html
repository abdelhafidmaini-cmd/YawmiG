   */
  summarizePeriod(allRecords, options = {}) {
    const referenceDate = options.referenceDate || getLocalDateString();
    const period = options.period || 'day'; // 'day' | 'week' | 'month'
    const activeDeviceFamily = options.activeDeviceFamily || null;

    let startDate = referenceDate;
    let daysCount = 1;
    if (period === 'week') {
      startDate = addDaysToDateString(referenceDate, -6);
      daysCount = 7;
    } else if (period === 'month') {
      startDate = addDaysToDateString(referenceDate, -29);
      daysCount = 30;
    }

    const inRange = allRecords.filter(r => r.localDate >= startDate && r.localDate <= referenceDate);
    const primaryInRange = inRange.filter(r => r.dedupStatus === 'unique_primary');
    const todayPrimary = primaryInRange.filter(r => r.localDate === referenceDate);

    const unsupportedByActiveBand = new Set(
      activeDeviceFamily && DEVICE_CAPABILITY_PROFILES[activeDeviceFamily]
        ? DEVICE_CAPABILITY_PROFILES[activeDeviceFamily].unsupportedMetrics
        : []
    );

    const buildMetricCardSummary = (metricType, scopeRecords) => {
      const def = HEALTH_METRIC_DEFS[metricType];
      const matching = scopeRecords
        .filter(r => r.metricType === metricType)
        .sort((a, b) => String(b.endTime || b.startTime).localeCompare(String(a.endTime || a.startTime)));

      if (matching.length === 0) {
        const isUnsupported = unsupportedByActiveBand.has(metricType);
        return {
          metricType,
          available: false,
          unsupported: isUnsupported,
          value: null,
          displayText: isUnsupported ? 'غير مدعوم في السوار الحالي' : 'لا توجد بيانات',
          unit: def.unit,
          sourceNameAr: null,
          lastTimestamp: null,
          recordsCount: 0,
          records: []
        };
      }

      const latest = matching[0];
      let aggregatedValue = latest.value;
      if (def.cumulative) {
        aggregatedValue = Math.round(matching.reduce((sum, r) => sum + Number(r.value || 0), 0) * 100) / 100;
      }

      return {
        metricType,
        available: true,
        unsupported: false,
        value: aggregatedValue,
        latestReading: latest,
        displayText: metricType === 'blood_pressure' && latest.systolic && latest.diastolic
          ? `${latest.systolic}/${latest.diastolic} ${def.unit}`
          : `${aggregatedValue.toLocaleString('en-US')} ${def.unit}`,
        unit: def.unit,
        sourceNameAr: latest.sourceNameAr,
        lastTimestamp: latest.endTime || latest.startTime,
        recordsCount: matching.length,
        records: matching
      };
    };

    // بناء السلاسل الزمنية للرسم البياني حسب الفترة
    const buildChartSeries = (metricType) => {
      const def = HEALTH_METRIC_DEFS[metricType];
      const points = [];
      for (let i = daysCount - 1; i >= 0; i--) {
        const dStr = addDaysToDateString(referenceDate, -i);
        const dayRecs = primaryInRange.filter(r => r.localDate === dStr && r.metricType === metricType);
        if (dayRecs.length === 0) {
          points.push({ date: dStr, label: dStr.slice(5), value: null, hasData: false });
        } else {
          const val = def.cumulative
            ? Math.round(dayRecs.reduce((acc, r) => acc + Number(r.value || 0), 0) * 100) / 100
            : Math.round((dayRecs.reduce((acc, r) => acc + Number(r.value || 0), 0) / dayRecs.length) * 10) / 10;
          points.push({
            date: dStr,
            label: dStr.slice(5),
            value: val,
            hasData: true,
            sourceNameAr: dayRecs[0].sourceNameAr
          });
        }
      }
      return {
        metricType,
        hasAnyData: points.some(p => p.hasData),
        points
      };
    };

    const scopeForCards = period === 'day' ? todayPrimary : primaryInRange;

    return {
      period,
      startDate,
      endDate: referenceDate,
      totalRawRecordsInPeriod: inRange.length,
      suppressedDuplicatesInPeriod: inRange.filter(r => r.dedupStatus === 'suppressed_duplicate').length,
      metrics: {
        steps: buildMetricCardSummary('steps', scopeForCards),
        distance: buildMetricCardSummary('distance', scopeForCards),
        calories: buildMetricCardSummary('calories', scopeForCards),
        heart_rate: buildMetricCardSummary('heart_rate', primaryInRange),
        resting_heart_rate: buildMetricCardSummary('resting_heart_rate', primaryInRange),
        sleep: buildMetricCardSummary('sleep', scopeForCards),
        exercise: buildMetricCardSummary('exercise', scopeForCards),
        spo2: buildMetricCardSummary('spo2', primaryInRange),
        stress: buildMetricCardSummary('stress', primaryInRange),
        blood_pressure: buildMetricCardSummary('blood_pressure', primaryInRange),
        weight: buildMetricCardSummary('weight', primaryInRange),
        respiratory_rate: buildMetricCardSummary('respiratory_rate', primaryInRange)
      },
      buildChartSeries,
      allPeriodRecords: inRange.sort((a, b) => String(b.startTime).localeCompare(String(a.startTime)))
    };
  }
};

    window.Capacitor &&
    window.Capacitor.Plugins &&
    window.Capacitor.Plugins.YawmiHealthWearable
  ) {
    return window.Capacitor.Plugins.YawmiHealthWearable;
  }

    isNativeAndroidApk: Boolean(nativePlugin),

  buildLinkLayerFrame(serviceId, commandId, tlvBytes = []) {
    const len = 2 + tlvBytes.length;
    const body = new Uint8Array(4 + tlvBytes.length);
    body[0] = 0xAA;
    body[1] = len & 0xFF;
    body[2] = serviceId & 0xFF;
    body[3] = commandId & 0xFF;
    for (let i = 0; i < tlvBytes.length; i++) {
      body[4 + i] = tlvBytes[i] & 0xFF;
    }
    const crc = this.computeCrc16(body);
    const frame = new Uint8Array(body.length + 2);
    frame.set(body, 0);
    frame[body.length] = (crc >>> 8) & 0xFF;
    frame[body.length + 1] = crc & 0xFF;
    return frame;
  }
};

// Runtime map of real Web Bluetooth GATT connections in current session
const activeWebBleConnections = new Map();

async function getOrInitHealthSyncState(dbName = DB_NAME) {
  await initDatabase(dbName);
  const existing = await getRecord(STORE_NAMES.HEALTH_SYNC_STATE, HEALTH_SYNC_STATE_ID, dbName);
  const nativePlugin = getNativeHealthPlugin();

  if (existing) {
    // تصحيح تلقائي: إذا لم تكن الإضافة الأصلية محمّلة (أي داخل معاينة الويب)، لا ندّعي أبدًا أن Health Connect مرتبط!
    if (!nativePlugin && existing.healthConnectLinked) {
      const corrected = {
        ...existing,
        environmentType: 'web_browser_or_webview',
        healthConnectSdkStatus: 'requires_native_android_apk',
        healthConnectLinked: false,
        grantedPermissions: [],
        updatedAt: new Date().toISOString()
      };
      await updateRecord(STORE_NAMES.HEALTH_SYNC_STATE, corrected, dbName);
      return corrected;
    }
    return existing;
  }

  const initial = {
    id: HEALTH_SYNC_STATE_ID,
    environmentType: nativePlugin ? 'capacitor_android_native' : 'web_browser_or_webview',
    healthConnectSdkStatus: nativePlugin ? 'checking' : 'requires_native_android_apk',
    healthConnectLinked: false,
    grantedPermissions: [],
    googleFitSourceDetected: false,
    sourcesDetected: [],
    lastSuccessfulSyncAt: null,
    lastAttemptedSyncAt: null,
    lastSyncStatus: 'idle',
    lastSyncProgressPct: null,
    lastSyncError: null,
    backgroundSyncEnabled: false,
    consentGranted: true,
    clockDriftOffsetMs: 0,
    updatedAt: new Date().toISOString()
  };
  await addRecord(STORE_NAMES.HEALTH_SYNC_STATE, initial, dbName);
  return initial;
}

async function patchHealthSyncState(patch, dbName = DB_NAME) {
  const current = await getOrInitHealthSyncState(dbName);
  const updated = {
    ...current,
    ...patch,
    id: HEALTH_SYNC_STATE_ID,
    updatedAt: new Date().toISOString()
  };
  await updateRecord(STORE_NAMES.HEALTH_SYNC_STATE, updated, dbName);
  return updated;
}

const YawmiHealthAPI = {
  isNativeAndroidAvailable() {
    return Boolean(getNativeHealthPlugin());
  },

  isWebBluetoothAvailable() {
    return hasWebBluetoothSupport();
  },

  diagnoseRuntimeCapabilities,
  PhoneSensorPedometer,

  /**
   * 1. scanDevices() — بحث حقيقي فقط عبر Capacitor Native BLE أو Web Bluetooth API
   * لا يُنشئ أبدًا أجهزة وهمية إذا لم يكن البلوتوث الحقيقي متاحًا!
   */
  async scanDevices(options = {}, dbName = DB_NAME) {
    const nativePlugin = getNativeHealthPlugin();

    // المسار 1: إضافة Android الأصلية المكتوبة بـ Kotlin (داخل APK المثبت)
    if (nativePlugin) {
      const permRes = await nativePlugin.requestBlePermissions();
      if (!permRes || !permRes.granted) {
        throw new Error('تم رفض أذونات Bluetooth للأجهزة القريبة في أندرويد. يرجى السماح بإذن BLUETOOTH_SCAN و BLUETOOTH_CONNECT.');
      }
      const res = await nativePlugin.scanDevices();
      const found = Array.isArray(res?.devices) ? res.devices : [];
      for (const dev of found) {
        const existing = await getRecord(STORE_NAMES.WEARABLE_DEVICES, dev.id, dbName);
        const merged = {
          id: dev.id,
          name: dev.name || 'سوار ذكي مكتشف',
          family: dev.family || 'generic_ble',
          rssi: dev.rssi ?? null,
          connectionState: existing?.connectionState || 'disconnected',
          batteryLevel: existing?.batteryLevel ?? null,
          firmwareVersion: existing?.firmwareVersion || null,
          authConfigured: Boolean(dev.authConfigured || existing?.authConfigured),
          autoReconnect: existing?.autoReconnect ?? true,
          lastConnectedAt: existing?.lastConnectedAt || null,
          lastSyncedAt: existing?.lastSyncedAt || null,
          lastError: null,
          updatedAt: new Date().toISOString()
        };
        await updateRecord(STORE_NAMES.WEARABLE_DEVICES, merged, dbName);
      }
      return found;
    }

    // المسار 2: Web Bluetooth API الحقيقي في متصفح Chrome على الهاتف أو الحاسوب
    if (hasWebBluetoothSupport()) {
      try {
        const btDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            XiaomiBand10Protocol.SERVICE_UUID,
            HonorBand4Protocol.SERVICE_UUID,
            XiaomiBand10Protocol.BATTERY_SERVICE_UUID,
            XiaomiBand10Protocol.DEVICE_INFO_UUID,
            '0000180d-0000-1000-8000-00805f9b34fb'
          ]
        });

        const name = btDevice.name || 'جهاز Bluetooth LE حقيقي';
        const family = /smart band 10|mi band 10/i.test(name)
          ? 'xiaomi_band_10'
          : (/honor band 4|crs-b19/i.test(name) ? 'honor_band_4' : 'generic_ble');

        const devId = btDevice.id || generateId('ble_dev');
        activeWebBleConnections.set(devId, { btDevice, gattServer: null });

        const record = {
          id: devId,
          name,
          family,
          rssi: null,
          connectionState: 'disconnected',
          batteryLevel: null,
          firmwareVersion: null,
          authConfigured: false,
          autoReconnect: true,
          lastConnectedAt: null,
          lastSyncedAt: null,
          lastError: null,
          updatedAt: new Date().toISOString()
        };
        await updateRecord(STORE_NAMES.WEARABLE_DEVICES, record, dbName);
        return [record];
      } catch (err) {
        const msg = String(err?.message || err || '');
        if (/user cancelled|canceled/i.test(msg)) {
          throw new Error('تم إلغاء نافذة اختيار جهاز البلوتوث من قِبل المستخدم.');
        }
        const errObj = new Error('تعذر تشغيل مسح البلوتوث المباشر من داخل نافذة المعاينة المعزولة.');
        errObj.code = 'BLE_BLOCKED_IN_PREVIEW';
        throw errObj;
      }
    }

    const errObj = new Error('نافذة المعاينة الحالية (WebView) لا تملك صلاحية الوصول إلى شريحة البلوتوث في الهاتف.');
    errObj.code = 'BLE_UNAVAILABLE_IN_WEBVIEW';
    throw errObj;
  },

  /**
   * تسجيل ملف تعريف جهاز في قائمة الأجهزة المحفوظة بحالة «غير متصل» بانتظار الاتصال الحقيقي
   */
  async registerDeviceProfile(input, dbName = DB_NAME) {
    const family = ['xiaomi_band_10', 'honor_band_4', 'generic_ble'].includes(input?.family)
      ? input.family
      : 'xiaomi_band_10';
    const profile = DEVICE_CAPABILITY_PROFILES[family];
    const name = String(input?.name || profile?.displayName || 'سوار ذكي').trim();
    const macOrId = String(input?.macAddress || '').trim() || `saved_${family}_${Date.now().toString(36)}`;

    const record = {
      id: macOrId,
      name,
      family,
      macAddress: String(input?.macAddress || '').trim() || null,
      rssi: null,
      connectionState: 'disconnected',
      batteryLevel: null,
      firmwareVersion: null,
      authConfigured: false,
      autoReconnect: Boolean(input?.autoReconnect ?? true),
      lastConnectedAt: null,
      lastSyncedAt: null,
      lastError: null,
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };

    await updateRecord(STORE_NAMES.WEARABLE_DEVICES, record, dbName);
    return record;
  },

  /**
   * التحقق من مفتاح المصادقة وحفظه في Android Keystore عند توفر الإضافة الأصلية
   */
  async setDeviceAuthKey(deviceId, rawSecret, dbName = DB_NAME) {
    const dev = await getRecord(STORE_NAMES.WEARABLE_DEVICES, deviceId, dbName);
    if (!dev) throw new Error('الجهاز غير موجود في قائمة الأجهزة المحفوظة.');

    let validated = '';
    if (dev.family === 'xiaomi_band_10') {
      validated = XiaomiBand10Protocol.validateAuthKey(rawSecret);
    } else if (dev.family === 'honor_band_4') {
      validated = HonorBand4Protocol.validateHuaweiAccountId(rawSecret);
    } else {
      validated = String(rawSecret || '').trim();
    }

    const nativePlugin = getNativeHealthPlugin();
    if (nativePlugin) {
      await nativePlugin.setDeviceAuthKey({
        deviceId: dev.id,
        family: dev.family,
        authKey: validated
      });
      const updated = {
        ...dev,
        authConfigured: true,
        authStorageMode: 'android_keystore_aes_gcm',
        updatedAt: new Date().toISOString()
      };
      await updateRecord(STORE_NAMES.WEARABLE_DEVICES, updated, dbName);
      return { savedInKeystore: true, mode: 'android_keystore_aes_gcm' };
    }

    const updated = {
      ...dev,
      authConfigured: Boolean(validated),
      authStorageMode: 'verified_format_pending_apk_keystore',
      updatedAt: new Date().toISOString()
    };
    await updateRecord(STORE_NAMES.WEARABLE_DEVICES, updated, dbName);
    return {
      savedInKeystore: false,
      mode: 'verified_format_pending_apk_keystore',
      notice: 'تم التحقق من صحة صيغة المفتاح. لا يتم تخزين المفتاح كنص صريح في المتصفح؛ يُشفر داخل Android Keystore عند تثبيت تطبيق APK.'
    };
  },

  /**
   * 2. connectDevice(deviceId) — اتصال حقيقي فقط! لا يكتب «متصل» أبدًا دون اتصال GATT فعلي!
   */
  async connectDevice(deviceId, dbName = DB_NAME) {
    const dev = await getRecord(STORE_NAMES.WEARABLE_DEVICES, deviceId, dbName);
    if (!dev) throw new Error('الجهاز المطلوب غير موجود في قائمة الأجهزة.');

    await updateRecord(STORE_NAMES.WEARABLE_DEVICES, {
      ...dev,
      connectionState: 'connecting',
      lastError: null,
      updatedAt: new Date().toISOString()
    }, dbName);

    const nativePlugin = getNativeHealthPlugin();
    if (nativePlugin) {
      try {
        const res = await nativePlugin.connectDevice({
          deviceId: dev.id,
          family: dev.family
        });
        const nextState = res?.connectionState || 'connected';
        const updated = {
          ...dev,
          connectionState: nextState,
          batteryLevel: res?.batteryLevel ?? dev.batteryLevel,
          firmwareVersion: res?.firmwareVersion ?? dev.firmwareVersion,
          lastConnectedAt: nextState === 'connected' ? new Date().toISOString() : dev.lastConnectedAt,
          lastError: res?.lastError || null,
          updatedAt: new Date().toISOString()
        };
        await updateRecord(STORE_NAMES.WEARABLE_DEVICES, updated, dbName);
        return updated;
      } catch (err) {
        const errMsg = err?.message || 'فشل الاتصال بالسوار عبر Bluetooth LE';
        const failed = {
          ...dev,
          connectionState: 'connection_failed',
          lastError: errMsg,
          updatedAt: new Date().toISOString()
        };
        await updateRecord(STORE_NAMES.WEARABLE_DEVICES, failed, dbName);
        throw new Error(errMsg);
      }
    }

    // التحقق من وجود جلسة Web Bluetooth حقيقية مختارة من المستخدم
    const webSession = activeWebBleConnections.get(deviceId);
    if (webSession && webSession.btDevice && webSession.btDevice.gatt) {
      try {
        const server = await webSession.btDevice.gatt.connect();
        webSession.gattServer = server;

        let batteryVal = null;
        try {
          const battService = await server.getPrimaryService('0000180f-0000-1000-8000-00805f9b34fb');
          const battChar = await battService.getCharacteristic('00002a19-0000-1000-8000-00805f9b34fb');
          const dv = await battChar.readValue();
          batteryVal = dv.getUint8(0);
        } catch {
          // قد لا يوفر السوار قراءة البطارية القياسية قبل إتمام المصادقة المشفرة
        }

        const nowIso = new Date().toISOString();
        const updated = {
          ...dev,
          connectionState: 'connected',
          batteryLevel: batteryVal,
          lastConnectedAt: nowIso,
          lastError: null,
          updatedAt: nowIso
        };
        await updateRecord(STORE_NAMES.WEARABLE_DEVICES, updated, dbName);

        webSession.btDevice.addEventListener('gattserverdisconnected', async () => {
          const latest = await getRecord(STORE_NAMES.WEARABLE_DEVICES, deviceId, dbName);
          if (latest) {
            await updateRecord(STORE_NAMES.WEARABLE_DEVICES, {
              ...latest,
              connectionState: 'disconnected',
              updatedAt: new Date().toISOString()
            }, dbName);
          }
        });

        return updated;
      } catch (err) {
        const failed = {
          ...dev,
          connectionState: 'connection_failed',
          lastError: `فشل اتصال GATT الحقيقي بالسوار: ${err.message || err}`,
          updatedAt: new Date().toISOString()
        };
        await updateRecord(STORE_NAMES.WEARABLE_DEVICES, failed, dbName);
        throw new Error(failed.lastError);
      }
    }

    // لا يوجد اتصال GATT حقيقي -> نضع الحالة «فشل الاتصال» بصدق تام ولا ندّعي الاتصال أبدًا!
    const honestReason = 'لم يتم الاتصال الفعلي بالسوار: أنت تفتح التطبيق حاليًا داخل نافذة معاينة ويب معزولة لا تملك صلاحية الوصول إلى بلوتوث الهاتف. لإجراء اتصال حقيقي، افتح الملف في متصفح Google Chrome الخارجي أو ثبّت حزمة Android APK.';
    const failed = {
      ...dev,
      connectionState: 'connection_failed',
      batteryLevel: null,
      lastError: honestReason,
      updatedAt: new Date().toISOString()
    };
    await updateRecord(STORE_NAMES.WEARABLE_DEVICES, failed, dbName);
    const errObj = new Error(honestReason);
    errObj.code = 'NO_REAL_GATT_AVAILABLE';
    throw errObj;
  },

  /**
   * 3. disconnectDevice(deviceId) — قطع الاتصال بالسوار
   */
  async disconnectDevice(deviceId, dbName = DB_NAME) {
    const dev = await getRecord(STORE_NAMES.WEARABLE_DEVICES, deviceId, dbName);
    if (!dev) throw new Error('الجهاز غير موجود.');

    const nativePlugin = getNativeHealthPlugin();
    if (nativePlugin) {
      await nativePlugin.disconnectDevice({ deviceId });
    }

    const webSession = activeWebBleConnections.get(deviceId);
    if (webSession?.btDevice?.gatt?.connected) {
      webSession.btDevice.gatt.disconnect();
    }

    const updated = {
      ...dev,
      connectionState: 'disconnected',
      updatedAt: new Date().toISOString()
    };
    await updateRecord(STORE_NAMES.WEARABLE_DEVICES, updated, dbName);
    return updated;
  },

  /**
   * 4. getDeviceStatus(deviceId)
   */
  async getDeviceStatus(deviceId, dbName = DB_NAME) {
    const dev = await getRecord(STORE_NAMES.WEARABLE_DEVICES, deviceId, dbName);
    if (!dev) return null;
    const profile = DEVICE_CAPABILITY_PROFILES[dev.family] || null;
    return {
      ...dev,
      capabilityProfile: profile
    };
  },

  /**
   * إزالة الجهاز من قائمة الأجهزة المحفوظة
   */
  async removeSavedDevice(deviceId, dbName = DB_NAME) {
    try {
      await this.disconnectDevice(deviceId, dbName);
    } catch {
      // ignore
    }
    activeWebBleConnections.delete(deviceId);
    return deleteRecord(STORE_NAMES.WEARABLE_DEVICES, deviceId, dbName);
  },

  /**
   * 5. syncDeviceData(deviceId) — يزامن فقط إذا كان السوار متصلًا فعليًا عبر GATT أو الإضافة الأصلية
   */
  async syncDeviceData(deviceId, dbName = DB_NAME) {
    const dev = await getRecord(STORE_NAMES.WEARABLE_DEVICES, deviceId, dbName);
    if (!dev) throw new Error('الجهاز غير موجود.');

    const nativePlugin = getNativeHealthPlugin();
    const webSession = activeWebBleConnections.get(deviceId);
    const hasRealConnection = Boolean(nativePlugin && dev.connectionState === 'connected') ||
      Boolean(webSession?.gattServer?.connected);

    if (!hasRealConnection) {
      await updateRecord(STORE_NAMES.WEARABLE_DEVICES, {
        ...dev,
        connectionState: 'disconnected',
        batteryLevel: null,
        lastError: 'السوار غير متصل فعليًا عبر Bluetooth GATT.',
        updatedAt: new Date().toISOString()
      }, dbName);
      throw new Error(`السوار «${dev.name}» غير متصل فعليًا عبر البلوتوث. لا يمكن إجراء مزامنة وهمية.`);
    }

    await updateRecord(STORE_NAMES.WEARABLE_DEVICES, {
      ...dev,
      connectionState: 'syncing',
      updatedAt: new Date().toISOString()
    }, dbName);

    try {
      const recordsToIngest = [];
      if (webSession?.gattServer?.connected) {
        try {
          const battService = await webSession.gattServer.getPrimaryService('0000180f-0000-1000-8000-00805f9b34fb');
          const battChar = await battService.getCharacteristic('00002a19-0000-1000-8000-00805f9b34fb');
          const dv = await battChar.readValue();
          const batt = dv.getUint8(0);
          dev.batteryLevel = batt;
          recordsToIngest.push({
            metricType: 'battery',
            value: batt,
            unit: '%',
            sourceType: dev.family === 'honor_band_4' ? 'honor_band_4_ble' : 'xiaomi_band_10_ble',
            deviceModel: dev.name,
            deviceId: dev.id
          });
        } catch {
          // ignore if battery service restricted
        }
      }

      const ingestStats = recordsToIngest.length > 0
        ? await HealthNormalizer.ingestHealthRecords(recordsToIngest, {}, dbName)
        : { insertedCount: 0, updatedCount: 0, suppressedDuplicatesCount: 0, totalRecords: 0 };

      const nowIso = new Date().toISOString();
      const afterSync = {
        ...dev,
        connectionState: 'connected',
        lastSyncedAt: nowIso,
        updatedAt: nowIso
      };
      await updateRecord(STORE_NAMES.WEARABLE_DEVICES, afterSync, dbName);
      await patchHealthSyncState({
        lastSuccessfulSyncAt: nowIso,
        lastAttemptedSyncAt: nowIso,
        lastSyncStatus: 'succeeded',
        lastSyncError: null
      }, dbName);
      return { device: afterSync, ingestStats };
    } catch (err) {
      await updateRecord(STORE_NAMES.WEARABLE_DEVICES, {
        ...dev,
        connectionState: 'connected',
        lastError: err.message,
        updatedAt: new Date().toISOString()
      }, dbName);
      throw err;
    }
  },

  /**
   * 6. connectHealthConnect() — يتحقق بصدق من وجود HealthConnectClient الأصلي في Android APK
   * لا يكتب «مرتبط ومفعّل ✓» أبدًا إذا كان التطبيق يعمل داخل متصفح أو نافذة معاينة!
   */
  async connectHealthConnect(dbName = DB_NAME) {
    const nativePlugin = getNativeHealthPlugin();
    if (!nativePlugin) {
      const honestMsg = 'لم يتم الربط مع Health Connect لأنك تشغّل التطبيق حاليًا كملف ويب داخل نافذة المعاينة، وخدمة Android Health Connect (androidx.health.connect.client) لا تقبل الاتصال إلا من تطبيق Android APK مثبّت على النظام.';
      const state = await patchHealthSyncState({
        environmentType: 'web_browser_or_webview',
        healthConnectSdkStatus: 'requires_native_android_apk',
        healthConnectLinked: false,
        grantedPermissions: [],
        lastSyncStatus: 'failed',
        lastSyncError: honestMsg
      }, dbName);
      return state;
    }

    const res = await nativePlugin.connectHealthConnect();
    const granted = Array.isArray(res?.grantedPermissions) ? res.grantedPermissions : [];
    const linked = res?.sdkStatus === 'available' && granted.length > 0;
    return patchHealthSyncState({
      environmentType: 'capacitor_android_native',
      healthConnectSdkStatus: res?.sdkStatus || 'unavailable',
      healthConnectLinked: linked,
      grantedPermissions: granted,
      lastSyncError: linked ? null : 'يرجى منح صلاحيات القراءة في نافذة Health Connect الأصلية.'
    }, dbName);
  },

  /**
   * 7. requestHealthPermissions()
   */
  async requestHealthPermissions(requestedPermissions = [], dbName = DB_NAME) {
    const syncState = await getOrInitHealthSyncState(dbName);
    if (!syncState.consentGranted) {
      throw new Error('تم إلغاء موافقة الخصوصية الصحية. يرجى تفعيل الموافقة أولًا.');
    }

    const nativePlugin = getNativeHealthPlugin();
    if (!nativePlugin) {
      throw new Error('لا يمكن فتح نافذة صلاحيات Android Health Connect الأصلية من داخل متصفح الويب أو شاشة المعاينة؛ يتطلب ذلك تثبيت التطبيق كحزمة Android APK.');
    }

    const res = await nativePlugin.connectHealthConnect();
    const granted = Array.isArray(res?.grantedPermissions) ? res.grantedPermissions : requestedPermissions;
    return patchHealthSyncState({
      healthConnectLinked: granted.length > 0,
      grantedPermissions: granted
    }, dbName);
  },

  /**
   * 8. readHealthData(dateRange) — يقرأ فقط البيانات الحقيقية من HealthConnectClient الأصلي دون مسح البيانات السابقة عند الفشل
   */
  async readHealthData(dateRange = {}, dbName = DB_NAME) {
    const syncState = await getOrInitHealthSyncState(dbName);
    const attemptIso = new Date().toISOString();

    await patchHealthSyncState({
      lastAttemptedSyncAt: attemptIso,
      lastSyncStatus: 'syncing',
      lastSyncProgressPct: 25,
      lastSyncError: null
    }, dbName);

    const nativePlugin = getNativeHealthPlugin();
    if (!nativePlugin) {
      const errMsg = 'تعذرت المزامنة مع Health Connect: التطبيق يعمل حاليًا في وضع معاينة الويب (بدون إضافة Kotlin الأصلية)، لذلك لم يتم جلب أي قراءات وهمية ولم يتم مسح أي بيانات محلية سابقة.';
      await patchHealthSyncState({
        healthConnectLinked: false,
        lastAttemptedSyncAt: attemptIso,
        lastSyncStatus: 'failed',
        lastSyncProgressPct: null,
        lastSyncError: errMsg
      }, dbName);
      const errObj = new Error(errMsg);
      errObj.code = 'HC_REQUIRES_NATIVE_APK';
      throw errObj;
    }

    try {
      const startTime = dateRange.startTime || new Date(Date.now() - 7 * 86400000).toISOString();
      const endTime = dateRange.endTime || new Date().toISOString();

      await patchHealthSyncState({ lastSyncProgressPct: 60 }, dbName);
      const hcPayload = await nativePlugin.readHealthData({ startTime, endTime });
      const rawRecords = Array.isArray(hcPayload?.records) ? hcPayload.records : [];

      const ingestStats = await HealthNormalizer.ingestHealthRecords(rawRecords, {
        clockDriftOffsetMs: syncState.clockDriftOffsetMs || 0
      }, dbName);

      const doneIso = new Date().toISOString();
      const updatedState = await patchHealthSyncState({
        lastSuccessfulSyncAt: doneIso,
        lastAttemptedSyncAt: attemptIso,
        lastSyncStatus: 'succeeded',
        lastSyncProgressPct: 100,

  async getSyncStatus(dbName = DB_NAME) {
    const [syncState, rawDevices, allRecords] = await Promise.all([
      getOrInitHealthSyncState(dbName),
      getAllRecords(STORE_NAMES.WEARABLE_DEVICES, dbName),
      getAllRecords(STORE_NAMES.HEALTH_RECORDS, dbName)
    ]);

    const nativePlugin = getNativeHealthPlugin();
    // تنظيف تلقائي لأي أجهزة أو قراءات محاكاة سابقة في حال عدم وجود إضافة أصلية
    const SIMULATED_IDS_PREFIX = /^(miband10_|hb4_|gfit_|phone_overlap_|batt_ble_)/;
    const filteredRecords = [];
    for (const r of allRecords) {
      if (!nativePlugin && r.sourceRecordId && SIMULATED_IDS_PREFIX.test(r.sourceRecordId)) {
        await deleteRecord(STORE_NAMES.HEALTH_RECORDS, r.id, dbName);
      } else {
        filteredRecords.push(r);
      }
    }
    const devices = [];
    for (const d of rawDevices) {
      if (!nativePlugin && (d.id === 'ble_xiaomi_band_10' || d.id === 'ble_honor_band_4' || d.bridgeMode === 'webview_companion_bridge')) {
        await deleteRecord(STORE_NAMES.WEARABLE_DEVICES, d.id, dbName);

          connectionState: 'disconnected',
          batteryLevel: null,
          lastError: 'غير متصل فعليًا (يتطلب اتصال Bluetooth GATT حقيقي)',
          updatedAt: new Date().toISOString()
        };
        await updateRecord(STORE_NAMES.WEARABLE_DEVICES, cleaned, dbName);
        devices.push(cleaned);
      } else {
        devices.push(d);
      }
    }

    const connectedDevice = devices.find(d => d.connectionState === 'connected' || d.connectionState === 'syncing') || null;
    const primaryDevice = connectedDevice || devices[0] || null;

    const distinctSources = Array.from(new Set(filteredRecords.map(r => r.sourceNameAr).filter(Boolean)));
    const hasGoogleFitRecords = filteredRecords.some(
      r => r.sourceType === 'google_fit_hc' || r.sourcePackage === 'com.google.android.apps.fitness'

      isNativeAndroid: this.isNativeAndroidAvailable(),
      isWebBluetoothSupported: this.isWebBluetoothAvailable(),
      diagnostics: diagnoseRuntimeCapabilities(),
      devices,
      connectedDevice,
      primaryDevice,
      totalHealthRecords: filteredRecords.length,
      distinctSources,
      hasGoogleFitRecords: Boolean(syncState.googleFitSourceDetected || hasGoogleFitRecords),

/**
 * حساب بداية اليوم ونهايته بالتوقيت المحلي الصحيح مع إزاحة المنطقة الزمنية (المرحلة السادسة)
 */
function getLocalDayBounds(dateInput = new Date()) {
  let year, month, day;
  if (typeof dateInput === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateInput.trim())) {
    [year, month, day] = dateInput.trim().split('-').map(Number);
  } else {
    const d = dateInput instanceof Date ? dateInput : new Date(dateInput);
    year = d.getFullYear();
    month = d.getMonth() + 1;
    day = d.getDate();
  }

  const startLocal = new Date(year, month - 1, day, 0, 0, 0, 0);
  const endLocal = new Date(year, month - 1, day, 23, 59, 59, 999);
  const tzOffsetMin = -startLocal.getTimezoneOffset();
  const sign = tzOffsetMin >= 0 ? '+' : '-';
  const absMin = Math.abs(tzOffsetMin);
  const pad2 = (n) => String(Math.floor(n)).padStart(2, '0');
  const zoneOffset = `${sign}${pad2(absMin / 60)}:${pad2(absMin % 60)}`;
  const localDateStr = `${year}-${pad2(month)}-${pad2(day)}`;

  return {
    localDate: localDateStr,
    startTime: startLocal,
    endTime: endLocal,
    startIso: startLocal.toISOString(),
    endIso: endLocal.toISOString(),
    zoneOffset,
    timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone || zoneOffset
  };
}

/**
 * دمج مراحل النوم المتداخلة زمنيًا لمنع جمع المراحل المتداخلة مرتين (المرحلة السادسة)
 */
function mergeOverlappingSleepStages(stages = []) {
  if (!Array.isArray(stages) || stages.length === 0) {
    return { totalStageMinutes: null, mergedIntervalsCount: 0, normalizedStages: [] };
  }

  const validWithTimes = [];
  let fallbackMinutesSum = 0;
  let hasExplicitMinutesOnly = false;

  for (const st of stages) {
    if (st.startTime && st.endTime) {
      const s = new Date(st.startTime).getTime();
      const e = new Date(st.endTime).getTime();
      if (Number.isFinite(s) && Number.isFinite(e) && e > s) {
        validWithTimes.push({
          stage: st.stage || 'sleep',
          labelAr: st.labelAr || st.stage || 'مرحلة نوم',
          startMs: s,
          endMs: e,
          minutes: Math.round((e - s) / 60000)
        });
      }
    } else if (Number.isFinite(Number(st.minutes)) && Number(st.minutes) > 0) {
      hasExplicitMinutesOnly = true;
      fallbackMinutesSum += Number(st.minutes);
    }
  }

  if (validWithTimes.length === 0) {
    return {
      totalStageMinutes: hasExplicitMinutesOnly ? Math.round(fallbackMinutesSum) : null,
      mergedIntervalsCount: 0,
      normalizedStages: stages
    };
  }

  validWithTimes.sort((a, b) => a.startMs - b.startMs);
  const merged = [];
  let current = { startMs: validWithTimes[0].startMs, endMs: validWithTimes[0].endMs };

  for (let i = 1; i < validWithTimes.length; i++) {
    const next = validWithTimes[i];
    if (next.startMs <= current.endMs) {
      current.endMs = Math.max(current.endMs, next.endMs);
    } else {
      merged.push(current);
      current = { startMs: next.startMs, endMs: next.endMs };
    }
  }
  merged.push(current);

  const totalMinutes = Math.round(
    merged.reduce((acc, interval) => acc + (interval.endMs - interval.startMs) / 60000, 0)
  );

  return {
    totalStageMinutes: totalMinutes,
    mergedIntervalsCount: merged.length,
    normalizedStages: validWithTimes
  };
}

        lastSyncError: null
      }, dbName);

      try {
        const permCheck = await this.checkPermissions(dbName);
        if (!permCheck.isNativeAndroid) {
          currentUiStateCode = 'connection_failed';
          const msg = 'لا يمكن قراءة Health Connect داخل متصفح عادي أو WebView؛ يتطلب ذلك تشغيل تطبيق Android APK الأصلي.';
          await patchHealthSyncState({
            lastSyncStatus: 'failed',
            uiStateCode: 'connection_failed',
            lastSyncError: msg
          }, dbName);
          throw new Error(msg);
        }

        if (permCheck.permissionRevoked) {
          currentUiStateCode = 'permission_revoked';
          const msg = 'فقد التطبيق صلاحية الوصول إلى بيانات Health Connect. يرجى إعادة منح الصلاحية.';
          await patchHealthSyncState({
            lastSyncStatus: 'permission_revoked',
            uiStateCode: 'permission_revoked',
            lastSyncError: msg
          }, dbName);
          throw new Error(msg);
        }

        if (!permCheck.granted) {
          currentUiStateCode = 'needs_permissions';
          const msg = 'يحتاج التطبيق إلى صلاحيات القراءة من Health Connect أولًا.';
          await patchHealthSyncState({
            lastSyncStatus: 'needs_permissions',
            uiStateCode: 'needs_permissions',
            lastSyncError: msg
          }, dbName);
          throw new Error(msg);
        }

        const yawmiPlugin = getNativeYawmiPlugin();
        const ubiePlugin = getUbieHealthConnectPlugin();
        const rawRecords = [];
        const sourcesDetected = new Set();

        if (yawmiPlugin && typeof yawmiPlugin.readHealthData === 'function') {
          const payload = await yawmiPlugin.readHealthData({
            startTime: bounds.startIso,
            endTime: bounds.endIso
          });
          const list = Array.isArray(payload?.records) ? payload.records : [];
          for (const r of list) {
            rawRecords.push({
              ...r,
              localDate: bounds.localDate
            });
            if (r.sourcePackage) sourcesDetected.add(r.sourcePackage);
          }
          if (Array.isArray(payload?.sourcesDetected)) {
            payload.sourcesDetected.forEach(s => sourcesDetected.add(s));
          }
        } else if (ubiePlugin && typeof ubiePlugin.readRecords === 'function') {
          const timeRangeFilter = {
            type: 'between',
            startTime: bounds.startTime,
            endTime: bounds.endTime
          };
          // قراءة الأنواع المدعومة في ubie-oss/capacitor-health-connect
          for (const recType of UBIE_SUPPORTED_READ_TYPES) {
            try {
              const res = await ubiePlugin.readRecords({ type: recType, timeRangeFilter });
              const records = Array.isArray(res?.records) ? res.records : [];
              for (const item of records) {
                const originPkg = item?.metadata?.dataOrigin || 'com.google.android.apps.healthdata';
                sourcesDetected.add(originPkg);
                const recId = item?.metadata?.id || generateId(`ubie_${recType}`);
                if (recType === 'Steps' && Number(item.count) > 0) {
                  rawRecords.push({
                    sourceRecordId: recId,
                    metricType: 'steps',
                    value: Number(item.count),
                    unit: 'خطوة',
                    startTime: new Date(item.startTime).toISOString(),
                    endTime: new Date(item.endTime).toISOString(),
                    localDate: bounds.localDate,
                    sourcePackage: originPkg,
                    sourceType: originPkg === 'com.google.android.apps.fitness' ? 'google_fit_hc' : 'health_connect'
                  });
                } else if (recType === 'ActiveCaloriesBurned' && item.energy?.value > 0) {
                  const kcal = item.energy.unit === 'joules'
                    ? item.energy.value / 4184
                    : (item.energy.unit === 'kilojoules' ? item.energy.value / 4.184 : item.energy.value);
                  rawRecords.push({
                    sourceRecordId: recId,
                    metricType: 'calories',
                    value: Math.round(kcal * 10) / 10,
                    unit: 'سعرة (kcal)',
                    startTime: new Date(item.startTime).toISOString(),
                    endTime: new Date(item.endTime).toISOString(),
                    localDate: bounds.localDate,
                    sourcePackage: originPkg,
                    sourceType: 'health_connect'
                  });
                } else if (recType === 'HeartRateSeries' && Array.isArray(item.samples)) {
                  for (const smp of item.samples) {
                    rawRecords.push({
                      sourceRecordId: `${recId}_${new Date(smp.time).getTime()}`,
                      metricType: 'heart_rate',
                      value: Number(smp.beatsPerMinute),
                      unit: 'نبضة/د (bpm)',
                      startTime: new Date(smp.time).toISOString(),
                      endTime: new Date(smp.time).toISOString(),
                      localDate: bounds.localDate,
                      sourcePackage: originPkg,
                      sourceType: 'health_connect'
                    });
                  }
                } else if (recType === 'RestingHeartRate' && Number(item.beatsPerMinute) > 0) {
                  rawRecords.push({
                    sourceRecordId: recId,
                    metricType: 'resting_heart_rate',
                    value: Number(item.beatsPerMinute),
                    unit: 'نبضة/د (bpm)',
                    startTime: new Date(item.time).toISOString(),
                    endTime: new Date(item.time).toISOString(),
                    localDate: bounds.localDate,
                    sourcePackage: originPkg,
                    sourceType: 'health_connect'
                  });
                } else if (recType === 'Weight' && item.weight?.value > 0) {
                  const kg = item.weight.unit === 'gram'
                    ? item.weight.value / 1000
                    : (item.weight.unit === 'pound' ? item.weight.value * 0.453592 : item.weight.value);
                  rawRecords.push({
                    sourceRecordId: recId,
                    metricType: 'weight',
                    value: Math.round(kg * 100) / 100,
                    unit: 'كغ',
                    startTime: new Date(item.time).toISOString(),
                    endTime: new Date(item.time).toISOString(),
                    localDate: bounds.localDate,
                    sourcePackage: originPkg,
                    sourceType: 'health_connect'
                  });
                } else if (recType === 'OxygenSaturation' && item.percentage?.value > 0) {
                  rawRecords.push({
                    sourceRecordId: recId,
                    metricType: 'spo2',
                    value: Number(item.percentage.value),
                    unit: '%',
                    startTime: new Date(item.time).toISOString(),
                    endTime: new Date(item.time).toISOString(),
                    localDate: bounds.localDate,
                    sourcePackage: originPkg,
                    sourceType: 'health_connect'
                  });
                } else if (recType === 'RespiratoryRate' && Number(item.rate) > 0) {
                  rawRecords.push({
                    sourceRecordId: recId,
                    metricType: 'respiratory_rate',
                    value: Number(item.rate),
                    unit: 'نفس/د',
                    startTime: new Date(item.time).toISOString(),
                    endTime: new Date(item.time).toISOString(),
                    localDate: bounds.localDate,
                    sourcePackage: originPkg,
                    sourceType: 'health_connect'
                  });
                }
              }
            } catch {
              // ignore individual unsupported type error
            }
          }
        }

        const ingestStats = rawRecords.length > 0
          ? await HealthNormalizer.ingestHealthRecords(rawRecords, {}, dbName)
          : { insertedCount: 0, updatedCount: 0, suppressedDuplicatesCount: 0, totalRecords: 0 };

        const doneIso = new Date().toISOString();
        const nextUiState = rawRecords.length > 0 ? 'read_success' : 'no_data';
        currentUiStateCode = nextUiState;

        await patchHealthSyncState({
          lastSuccessfulSyncAt: doneIso,
          lastAttemptedSyncAt: attemptIso,
          lastSyncStatus: nextUiState,
          uiStateCode: nextUiState,
          lastSyncError: null,
          sourcesDetected: Array.from(sourcesDetected),
          googleFitSourceDetected: sourcesDetected.has('com.google.android.apps.fitness')
        }, dbName);

        return {
          uiState: this.getUiStateInfo(nextUiState),
          recordsReadCount: rawRecords.length,
          ingestStats,
          bounds
        };
      } catch (err) {
        if (currentUiStateCode === 'reading_data') {
          currentUiStateCode = 'connection_failed';
        }
        await patchHealthSyncState({
          lastAttemptedSyncAt: attemptIso,
          lastSyncStatus: 'failed',
          uiStateCode: currentUiStateCode,
          lastSyncError: err.message || 'فشل الاتصال أو قراءة البيانات من Health Connect'
        }, dbName);
        throw err;
      } finally {
        activeSyncPromise = null;
      }
    })();

    return activeSyncPromise;
  },

  /**
   * قراءة سجلات اليوم المحفوظة محليًا (مع خيار المزامنة الحية من Health Connect عند التوفر)
   */
  async _getDayPrimaryRecords(dateInput = new Date(), syncFromNative = false, dbName = DB_NAME) {
    const bounds = getLocalDayBounds(dateInput);
    if (syncFromNative && (getNativeYawmiPlugin() || getUbieHealthConnectPlugin())) {
      await this._fetchAndIngestWindow(bounds, dbName);
    }
    const allRecords = await getAllRecords(STORE_NAMES.HEALTH_RECORDS, dbName);
    const dayRecords = allRecords.filter(
      r => r.localDate === bounds.localDate && r.dedupStatus === 'unique_primary'
    );
    return { bounds, dayRecords, allRecords };
  },

  /**
   * 4. readTodaySummary() — قراءة ملخص اليوم الكامل
   */
  async readTodaySummary(options = { syncFromNative: false, date: new Date() }, dbName = DB_NAME) {
    const bounds = getLocalDayBounds(options?.date || new Date());
    if (options?.syncFromNative) {
      await this._fetchAndIngestWindow(bounds, dbName);
    }
    const [steps, distance, calories, heartRate, sleep, weight, exercises, syncStatus] = await Promise.all([
      this.readSteps({ date: bounds.localDate }, dbName),
      this.readDistance({ date: bounds.localDate }, dbName),
      this.readCalories({ date: bounds.localDate }, dbName),
      this.readHeartRate({ date: bounds.localDate }, dbName),
      this.readSleep({ date: bounds.localDate }, dbName),
      this.readWeight({ date: bounds.localDate }, dbName),
      this.readExerciseSessions({ date: bounds.localDate }, dbName),
      this.getLastSyncStatus(dbName)
    ]);

    const hasAnyDataToday = [steps, distance, calories, heartRate, sleep, weight, exercises].some(m => m.available);

    return {
      localDate: bounds.localDate,
      timeWindow: {
        startIso: bounds.startIso,
        endIso: bounds.endIso,
        zoneOffset: bounds.zoneOffset,
        timeZone: bounds.timeZone
      },
      hasAnyDataToday,
      steps,
      distance,
      calories,
      heartRate,
      sleep,
      weight,
      exercises,
      syncStatus
    };
  },

  /**
   * 5. readSteps() — قراءة إجمالي الخطوات عبر التجميع الموحد دون مضاعفة السجلات
   */
  async readSteps(options = {}, dbName = DB_NAME) {
    const { bounds, dayRecords } = await this._getDayPrimaryRecords(options.date || new Date(), Boolean(options.syncFromNative), dbName);
    const matching = dayRecords.filter(r => r.metricType === 'steps');
    if (matching.length === 0) {
      return {
        metricType: 'steps',
        available: false,
        value: null,
        unit: 'خطوة',
        displayText: 'لا توجد بيانات',
        sourceNameAr: null,
        sourcePackage: null,
        timeWindow: `${bounds.localDate} (00:00 - 23:59)`,
        recordsCount: 0
      };
    }
    const totalSteps = Math.round(matching.reduce((sum, r) => sum + Number(r.value || 0), 0));
    const primary = matching[0];
    return {
      metricType: 'steps',
      available: true,
      value: totalSteps,
      unit: 'خطوة',
      displayText: `${totalSteps.toLocaleString('en-US')} خطوة`,
      sourceNameAr: primary.sourceNameAr,
      sourcePackage: primary.sourcePackage || null,
      timeWindow: `${bounds.localDate} (00:00 - 23:59)`,
      lastTimestamp: primary.endTime || primary.startTime,
      recordsCount: matching.length
    };
  },

  /**
   * 6. readDistance() — قراءة المسافة المقطوعة
   */
  async readDistance(options = {}, dbName = DB_NAME) {
    const { bounds, dayRecords } = await this._getDayPrimaryRecords(options.date || new Date(), Boolean(options.syncFromNative), dbName);
    const matching = dayRecords.filter(r => r.metricType === 'distance');
    const onlyUbiePlugin = !getNativeYawmiPlugin() && Boolean(getUbieHealthConnectPlugin());

    if (matching.length === 0) {
      return {
        metricType: 'distance',
        available: false,
        unsupportedInPlugin: onlyUbiePlugin,
        value: null,
        unit: 'كم',
        displayText: onlyUbiePlugin ? 'غير مدعوم في إصدار capacitor-health-connect' : 'لا توجد بيانات',
        sourceNameAr: null,
        timeWindow: `${bounds.localDate} (00:00 - 23:59)`,
        recordsCount: 0
      };
    }
    const totalKm = Math.round(matching.reduce((sum, r) => sum + Number(r.value || 0), 0) * 100) / 100;
    const primary = matching[0];
    return {
      metricType: 'distance',
      available: true,
      unsupportedInPlugin: false,
      value: totalKm,
      unit: 'كم',
      displayText: `${totalKm.toLocaleString('en-US')} كم`,
      sourceNameAr: primary.sourceNameAr,
      sourcePackage: primary.sourcePackage || null,
      timeWindow: `${bounds.localDate} (00:00 - 23:59)`,
      lastTimestamp: primary.endTime || primary.startTime,
      recordsCount: matching.length
    };
  },

  /**
   * 7. readCalories() — قراءة السعرات المحروقة
   */
  async readCalories(options = {}, dbName = DB_NAME) {
    const { bounds, dayRecords } = await this._getDayPrimaryRecords(options.date || new Date(), Boolean(options.syncFromNative), dbName);
    const matching = dayRecords.filter(r => r.metricType === 'calories');
    if (matching.length === 0) {
      return {
        metricType: 'calories',
        available: false,
        value: null,
        unit: 'سعرة (kcal)',
        displayText: 'لا توجد بيانات',
        sourceNameAr: null,
        timeWindow: `${bounds.localDate} (00:00 - 23:59)`,
        recordsCount: 0
      };
    }
    const totalKcal = Math.round(matching.reduce((sum, r) => sum + Number(r.value || 0), 0) * 10) / 10;
    const primary = matching[0];
    return {
      metricType: 'calories',
      available: true,
      value: totalKcal,
      unit: 'سعرة (kcal)',
      displayText: `${totalKcal.toLocaleString('en-US')} سعرة (kcal)`,
      sourceNameAr: primary.sourceNameAr,
      sourcePackage: primary.sourcePackage || null,
      timeWindow: `${bounds.localDate} (00:00 - 23:59)`,
      lastTimestamp: primary.endTime || primary.startTime,
      recordsCount: matching.length
    };
  },

  /**
   * 8. readHeartRate() — قراءة سجلات معدل ضربات القلب (آخر قراءة + توقيتها + السجل، دون تحويل الغياب إلى 0)
   */
  async readHeartRate(options = {}, dbName = DB_NAME) {
    const { bounds, dayRecords } = await this._getDayPrimaryRecords(options.date || new Date(), Boolean(options.syncFromNative), dbName);
    const hrList = dayRecords
      .filter(r => r.metricType === 'heart_rate')
      .sort((a, b) => String(b.endTime || b.startTime).localeCompare(String(a.endTime || a.startTime)));
    const restingList = dayRecords
      .filter(r => r.metricType === 'resting_heart_rate')
      .sort((a, b) => String(b.endTime || b.startTime).localeCompare(String(a.endTime || a.startTime)));

    if (hrList.length === 0) {
      return {
        metricType: 'heart_rate',
        available: false,
        isLiveReading: false,
        latestBpm: null,
        latestTimestamp: null,
        restingBpm: restingList[0]?.value ?? null,
        unit: 'نبضة/د (bpm)',
        displayText: 'لا توجد بيانات',
        sourceNameAr: null,
        samples: [],
        timeWindow: `${bounds.localDate} (00:00 - 23:59)`
      };
    }

    const latest = hrList[0];
    return {
      metricType: 'heart_rate',
      available: true,
      isLiveReading: Boolean(latest.isLiveReading),
      latestBpm: latest.value,
      latestTimestamp: latest.endTime || latest.startTime,
      restingBpm: restingList[0]?.value ?? null,
      unit: 'نبضة/د (bpm)',
      displayText: `${latest.value} نبضة/د (bpm)`,
      sourceNameAr: latest.sourceNameAr,
      sourcePackage: latest.sourcePackage || null,
      samples: hrList.map(r => ({
        bpm: r.value,
        timestamp: r.endTime || r.startTime,
        sourceNameAr: r.sourceNameAr
      })),
      timeWindow: `${bounds.localDate} (00:00 - 23:59)`
    };
  },

  /**
   * 9. readSleep() — قراءة سجلات النوم ومراحله مع منع جمع المراحل المتداخلة مرتين
   */
  async readSleep(options = {}, dbName = DB_NAME) {
    const { bounds, dayRecords } = await this._getDayPrimaryRecords(options.date || new Date(), Boolean(options.syncFromNative), dbName);
    const sleepList = dayRecords.filter(r => r.metricType === 'sleep');
    const onlyUbiePlugin = !getNativeYawmiPlugin() && Boolean(getUbieHealthConnectPlugin());

    if (sleepList.length === 0) {
      return {
        metricType: 'sleep',
        available: false,
        unsupportedInPlugin: onlyUbiePlugin,
        totalMinutes: null,
        unit: 'دقيقة',
        displayText: onlyUbiePlugin ? 'غير مدعوم في إصدار capacitor-health-connect' : 'لا توجد بيانات',
        hasStages: false,
        stages: [],
        sourceNameAr: null,
        timeWindow: `${bounds.localDate}`
      };
    }

    let totalMinutes = 0;
    const allStages = [];
    for (const rec of sleepList) {
      if (Array.isArray(rec.stages) && rec.stages.length > 0) {
        const mergedInfo = mergeOverlappingSleepStages(rec.stages);
        const recDuration = Number(rec.value || 0);
        if (mergedInfo.totalStageMinutes !== null && mergedInfo.totalStageMinutes > 0) {
          totalMinutes += recDuration > 0 ? Math.min(recDuration, mergedInfo.totalStageMinutes) : mergedInfo.totalStageMinutes;
        } else {
          totalMinutes += recDuration;
        }
        allStages.push(...rec.stages);
      } else {
        totalMinutes += Number(rec.value || 0);
      }
    }

    const hrs = Math.floor(totalMinutes / 60);
    const mins = Math.round(totalMinutes % 60);
    const primary = sleepList[0];

    return {
      metricType: 'sleep',
      available: true,
      unsupportedInPlugin: false,
      totalMinutes: Math.round(totalMinutes),
      unit: 'دقيقة',
      displayText: `${hrs} س و ${mins} د`,
      hasStages: allStages.length > 0,
      stages: allStages,
      sourceNameAr: primary.sourceNameAr,
      sourcePackage: primary.sourcePackage || null,
      lastTimestamp: primary.endTime || primary.startTime,
      timeWindow: `${bounds.localDate}`
    };
  },

  /**
   * 10. readWeight() — قراءة الوزن عند توفره مع التاريخ والوحدة
   */
  async readWeight(options = {}, dbName = DB_NAME) {
    const { bounds, allRecords } = await this._getDayPrimaryRecords(options.date || new Date(), Boolean(options.syncFromNative), dbName);
    // الوزن يُقرأ لليوم أو أحدث قياس مسجل حتى تاريخ اليوم
    const weightsUpToDate = allRecords
      .filter(r => r.metricType === 'weight' && r.localDate <= bounds.localDate)
      .sort((a, b) => String(b.endTime || b.startTime).localeCompare(String(a.endTime || a.startTime)));

    if (weightsUpToDate.length === 0) {
      return {
        metricType: 'weight',
        available: false,
        value: null,
        unit: 'كغ',
        recordedDate: null,
        displayText: 'لا توجد بيانات',
        sourceNameAr: null
      };
    }

    const latest = weightsUpToDate[0];
    return {
      metricType: 'weight',
      available: true,
      value: latest.value,
      unit: latest.unit || 'كغ',
      recordedDate: latest.localDate,
      recordedTimestamp: latest.endTime || latest.startTime,
      displayText: `${latest.value} ${latest.unit || 'كغ'} (${latest.localDate})`,
      sourceNameAr: latest.sourceNameAr,
      sourcePackage: latest.sourcePackage || null
    };
  },

  /**
   * 11. readExerciseSessions() — قراءة جلسات التمارين وتوقيتها ومدتها ونوعها
   */
  async readExerciseSessions(options = {}, dbName = DB_NAME) {
    const { bounds, dayRecords } = await this._getDayPrimaryRecords(options.date || new Date(), Boolean(options.syncFromNative), dbName);
    const exList = dayRecords
      .filter(r => r.metricType === 'exercise')
      .sort((a, b) => String(b.startTime).localeCompare(String(a.startTime)));
    const onlyUbiePlugin = !getNativeYawmiPlugin() && Boolean(getUbieHealthConnectPlugin());

    if (exList.length === 0) {
      return {
        metricType: 'exercise',
        available: false,
        unsupportedInPlugin: onlyUbiePlugin,
        totalMinutes: null,
        sessionsCount: 0,
        unit: 'دقيقة',
        displayText: onlyUbiePlugin ? 'غير مدعوم في إصدار capacitor-health-connect' : 'لا توجد بيانات',
        sessions: [],
        sourceNameAr: null
      };
    }

    const totalMinutes = Math.round(exList.reduce((acc, r) => acc + Number(r.value || 0), 0));
    const primary = exList[0];
    return {
      metricType: 'exercise',
      available: true,
      unsupportedInPlugin: false,
      totalMinutes,
      sessionsCount: exList.length,
      unit: 'دقيقة',
      displayText: `${totalMinutes} دقيقة (${exList.length} جلسة)`,
      sessions: exList.map(s => ({
        id: s.id,
        title: s.exerciseTitle || 'تمرين رياضي',
        exerciseType: s.exerciseType || 'general',
        durationMinutes: s.value,
        startTime: s.startTime,
        endTime: s.endTime,
        sourceNameAr: s.sourceNameAr
      })),
      sourceNameAr: primary.sourceNameAr,
      sourcePackage: primary.sourcePackage || null
    };
  },

  /**
   * 12. getLastSyncStatus() — عرض حالة آخر قراءة أو مزامنة مع الحالة الحالية من الحالات الـ 8 المنفصلة
   */
  async getLastSyncStatus(dbName = DB_NAME) {
    const [syncState, allRecords] = await Promise.all([
      getOrInitHealthSyncState(dbName),
      getAllRecords(STORE_NAMES.HEALTH_RECORDS, dbName)
    ]);

    const isNative = Boolean(getNativeYawmiPlugin() || getUbieHealthConnectPlugin());
    let resolvedStateCode = syncState.uiStateCode || currentUiStateCode || 'unlinked';

    if (!isNative) {
      if (syncState.lastSyncStatus === 'failed') {
        resolvedStateCode = 'connection_failed';
      } else if (allRecords.length > 0) {
        resolvedStateCode = 'read_success';
      } else {
        resolvedStateCode = 'unlinked';
      }
    } else if (syncState.lastSyncStatus === 'permission_revoked') {
      resolvedStateCode = 'permission_revoked';
    } else if (syncState.healthConnectLinked) {
      resolvedStateCode = allRecords.length > 0 ? 'read_success' : 'no_data';
    } else if (syncState.healthConnectSdkStatus === 'available') {
      resolvedStateCode = 'needs_permissions';
    }

    const uiState = this.getUiStateInfo(resolvedStateCode);
    const distinctSources = Array.from(new Set(allRecords.map(r => r.sourceNameAr).filter(Boolean)));

    return {
      uiStateCode: uiState.code,
      uiStateLabelAr: uiState.labelAr,
      uiStateBadgeClass: uiState.badgeClass,
      uiStateDescriptionAr: uiState.descriptionAr,
      bannerTextAr: uiState.bannerTextAr || uiState.labelAr,
      isSyncInProgress: Boolean(activeSyncPromise),
      isNativeAndroid: isNative,
      healthConnectLinked: Boolean(syncState.healthConnectLinked && isNative),
      sdkStatus: syncState.healthConnectSdkStatus,
      grantedPermissions: syncState.grantedPermissions || [],
      lastSuccessfulSyncAt: syncState.lastSuccessfulSyncAt || null,
      lastAttemptedSyncAt: syncState.lastAttemptedSyncAt || null,
      lastSyncError: syncState.lastSyncError || null,
      totalCachedRecords: allRecords.length,
      distinctSources
    };
  },

  /**
   * تنفيذ وظيفة «مزامنة الآن» الكاملة وفق المرحلة الثامنة (مع منع التضارب وعدم مسح البيانات عند الفشل)
   */
  async syncNow(dateInput = new Date(), dbName = DB_NAME) {
    const bounds = getLocalDayBounds(dateInput);
    await this._fetchAndIngestWindow(bounds, dbName);
    return this.readTodaySummary({ syncFromNative: false, date: bounds.localDate }, dbName);
  }
};

if (typeof window !== 'undefined') {
  window.HealthConnectService = HealthConnectService;
}
