/* === css/variables.css === */
:root {
  /* Brand Colors - Deep Calm Emerald & Warm Gold */
  --color-primary: #134E3A;
  --color-primary-dark: #0D3829;
  --color-primary-light: #1E6B50;
  --color-primary-soft: #E6F2ED;
  --color-accent: #10B981;
  --color-gold: #E6C15A;
  --color-gold-soft: rgba(230, 193, 90, 0.18);

  /* Light Mode Surfaces */
  --bg-app: #F3F6F4;
  --bg-surface: #FFFFFF;
  --bg-surface-elevated: #FFFFFF;
  --bg-surface-muted: #EBF0ED;
  --bg-hero: #163E31;
  --bg-hero-card: rgba(255, 255, 255, 0.09);
  --border-hero-card: rgba(255, 255, 255, 0.14);

  /* Text Colors */
  --text-primary: #11221B;
  --text-secondary: #4A6358;
  --text-muted: #758E83;
  --text-on-primary: #FFFFFF;
  --text-on-hero: #F4FBF7;
  --text-on-hero-muted: #B6D3C6;

  /* Borders & Dividers */
  --border-color: #DCE5E0;
  --border-strong: #C2D1C9;

  /* Semantic Status Colors */
  --color-success: #16A34A;
  --color-success-bg: #DCFCE7;
  --color-warning: #D97706;
  --color-warning-bg: #FEF3C7;
  --color-danger: #DC2626;
  --color-danger-bg: #FEE2E2;
  --color-info: #2563EB;
  --color-info-bg: #DBEAFE;

  /* Priority Colors */
  --prio-low: #64748B;
  --prio-medium: #2563EB;
  --prio-high: #D97706;
  --prio-urgent: #DC2626;

  /* Spacing & Radius */
  --radius-xs: 8px;
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --radius-xl: 28px;
  --radius-full: 9999px;

  /* Shadows */
  --shadow-xs: 0 1px 3px rgba(13, 56, 41, 0.05);
  --shadow-sm: 0 4px 12px rgba(13, 56, 41, 0.06);
  --shadow-md: 0 8px 24px rgba(13, 56, 41, 0.10);
  --shadow-lg: 0 16px 36px rgba(0, 0, 0, 0.18);

  /* Safe Areas for Android Status & Navigation Bars */
  --safe-top: env(safe-area-inset-top, 10px);
  --safe-bottom: env(safe-area-inset-bottom, 10px);
  --nav-height: 68px;

  /* Typography */
  --font-sans: 'Noto Sans Arabic', 'Segoe UI', 'Cairo', 'Tajawal', system-ui, -apple-system, sans-serif;
  --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 220ms cubic-bezier(0.4, 0, 0.2, 1);
}
/* === css/dark.css === */
[data-theme="dark"] {
  --color-primary: #1F6E52;
  --color-primary-dark: #144936;
  --color-primary-light: #2E8B69;
  --color-primary-soft: rgba(46, 139, 105, 0.18);
  --color-accent: #34D399;
  --color-gold: #E8C564;
  --color-gold-soft: rgba(232, 197, 100, 0.18);

  /* Dark Mode Surfaces matching reference image 1000169449.jpg */
  --bg-app: #080E0B;
  --bg-surface: #111A16;
  --bg-surface-elevated: #17241E;
  --bg-surface-muted: #1D2D25;
  --bg-hero: #173F32;
  --bg-hero-card: rgba(255, 255, 255, 0.08);
  --border-hero-card: rgba(255, 255, 255, 0.12);

  --text-primary: #F2F7F4;
  --text-secondary: #A6BDB2;
  --text-muted: #6E877B;
  --text-on-primary: #FFFFFF;
  --text-on-hero: #F4FBF7;
  --text-on-hero-muted: #B8D5C8;

  --border-color: #1F3128;
  --border-strong: #2C4438;

  --color-success: #4ADE80;
  --color-success-bg: rgba(74, 222, 128, 0.14);
  --color-warning: #FBBF24;
  --color-warning-bg: rgba(251, 191, 36, 0.14);
  --color-danger: #F87171;
  --color-danger-bg: rgba(248, 113, 113, 0.15);
  --color-info: #60A5FA;
  --color-info-bg: rgba(96, 165, 250, 0.15);

  --shadow-xs: 0 1px 3px rgba(0, 0, 0, 0.3);
  --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.45);
}
/* === css/reset.css === */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.55;
  color: var(--text-primary);
  background-color: var(--bg-app);
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  background-color: var(--bg-app);
  color: var(--text-primary);
  overflow-x: hidden;
  transition: background-color var(--transition-normal), color var(--transition-normal);
}

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  background: none;
  border: none;
  outline: none;
}

button {
  cursor: pointer;
  user-select: none;
}

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

ul, ol {
  list-style: none;
}

a {
  color: inherit;
  text-decoration: none;
}

svg {
  display: inline-block;
  vertical-align: middle;
  flex-shrink: 0;
}
/* === css/layout.css === */
.app-shell {
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding-top: var(--safe-top);
  padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 18px);
  position: relative;
}

.app-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px 8px;
  gap: 10px;
  position: sticky;
  top: 0;
  z-index: 30;
  background-color: var(--bg-app);
}

.brand-bar {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-logo {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: radial-gradient(circle at center, #101a30, #0a0f1d);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--color-gold);
  box-shadow: var(--shadow-xs);
  border: 1.5px solid rgba(230, 193, 90, 0.45);
  overflow: hidden;
  padding: 0;
  flex-shrink: 0;
}
.brand-logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border-radius: 50%;
}

.brand-title {
  font-size: 1.1rem;
  font-weight: 800;
  letter-spacing: -0.01em;
  line-height: 1.2;
}

.brand-subtitle {
  font-size: 0.73rem;
  color: var(--text-muted);
  display: block;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.main-view {
  flex: 1;
  padding: 6px 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  animation: fadeInView 180ms ease-out;
}

@keyframes fadeInView {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Bottom Navigation Bar */
.bottom-nav-wrap {
  position: fixed;
  bottom: 0;
  inset-inline: 0;
  z-index: 50;
  background: var(--bg-surface);
  border-top: 1px solid var(--border-color);
  padding-bottom: var(--safe-bottom);
  box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
}

.bottom-nav {
  max-width: 520px;
  margin: 0 auto;
  height: var(--nav-height);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  align-items: center;
  padding: 0 8px;
}

.health-fab-btn {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: var(--color-primary);
  color: #FFFFFF;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 16px rgba(19, 78, 58, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.14);
  transition: transform var(--transition-fast), background-color var(--transition-fast);
  flex-shrink: 0;
}

.health-fab-btn:hover {
  background: var(--color-primary-light);
}

.health-fab-btn:active {
  transform: scale(0.94);
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 56px;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  font-size: 0.74rem;
  font-weight: 600;
  transition: color var(--transition-fast), background-color var(--transition-fast);
}

.nav-item:hover {
  color: var(--text-primary);
}

.nav-item.active {
  color: var(--color-accent);
}

[data-theme="light"] .nav-item.active {
  color: var(--color-primary);
}

.nav-item svg {
  width: 22px;
  height: 22px;
}

.nav-fab-holder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.nav-fab-btn {
  width: 48px;
  height: 48px;
  border-radius: 16px;
  background: var(--color-primary);
  color: #FFFFFF;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 16px rgba(19, 78, 58, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.14);
  transition: transform var(--transition-fast), background-color var(--transition-fast);
}

.nav-fab-btn:active {
  transform: scale(0.94);
}

.nav-fab-label {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-top: 2px;
  font-weight: 600;
}
/* === css/components.css === */
.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  transition: all var(--transition-fast);
}

.icon-btn:hover, .icon-btn:focus-visible {
  color: var(--text-primary);
  border-color: var(--border-strong);
  background: var(--bg-surface-muted);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 0.9rem;
  transition: all var(--transition-fast);
  white-space: nowrap;
}

.btn-primary {
  background: var(--color-primary);
  color: #FFFFFF;
}

.btn-primary:hover {
  background: var(--color-primary-light);
}

/**
 * YAWMI — IndexedDB Schema Migrations & Upgrade Handler
 */
function applyMigrations(db, oldVersion, newVersion, transaction = null) {
  for (const [storeName, storeDef] of Object.entries(SCHEMA_STORES)) {
    let store;
    if (!db.objectStoreNames.contains(storeName)) {
      store = db.createObjectStore(storeName, { keyPath: storeDef.keyPath });
    } else if (transaction) {
      store = transaction.objectStore(storeName);
    }
    if (store && Array.isArray(storeDef.indexes)) {
      for (const idx of storeDef.indexes) {
        if (!store.indexNames.contains(idx.name)) {
          store.createIndex(idx.name, idx.keyPath, { unique: Boolean(idx.unique) });
        }
      }
    }
  }
  return { from: oldVersion, to: newVersion, storesConfigured: Object.keys(SCHEMA_STORES).length };
}

/**
 * YAWMI — Core IndexedDB Data Layer with Connection Reuse, Promises, and Safe Transactions
 * Includes automatic spec-compliant in-memory engine fallback when running in Node.js CLI tests.

const connections = new Map();
const memoryDatabases = new Map();

function hasNativeIndexedDB() {
  return typeof indexedDB !== 'undefined' && indexedDB !== null;
}

function getMemoryDB(dbName, version) {
  let mem = memoryDatabases.get(dbName);
  if (!mem) {
    mem = {
      name: dbName,
      version: version || DB_VERSION,
      stores: {},
      indexes: {}
    };
    for (const [sName, sDef] of Object.entries(SCHEMA_STORES)) {
      mem.stores[sName] = new Map();
      mem.indexes[sName] = sDef.indexes || [];
    }
    memoryDatabases.set(dbName, mem);
  } else if (version && version > mem.version) {
    mem.version = version;
    for (const [sName, sDef] of Object.entries(SCHEMA_STORES)) {
      if (!mem.stores[sName]) mem.stores[sName] = new Map();
      mem.indexes[sName] = sDef.indexes || [];
    }
  }
  return mem;
}

  if (!SCHEMA_STORES[storeName]) {
    throw new Error(`مخزن البيانات غير موجود: ${storeName}`);
  }
  if (!record || typeof record !== 'object') {
    throw new Error('بيانات السجل غير صالحة: يجب أن يكون كائنًا.');
  }
  if (!record.id || typeof record.id !== 'string' || !record.id.trim()) {
    throw new Error('كل سجل يجب أن يحتوي على معرّف فريد (id) صالح.');
  }

  const storeMap = mem.stores[storeName];
  if (!isUpdate && storeMap.has(record.id)) {
    throw new Error(`تعارض في المعرّف: السجل (${record.id}) موجود مسبقًا في ${storeName}.`);
  }
  const idxDefs = mem.indexes[storeName] || [];
  for (const idx of idxDefs) {
    if (idx.unique) {
      for (const [existingId, existingRec] of storeMap.entries()) {
        if (existingId === record.id) continue;
        if (Array.isArray(idx.keyPath)) {
          const match = idx.keyPath.every(k => existingRec[k] !== undefined && existingRec[k] === record[k]);
          if (match) {
            throw new Error(`سجل مكرر لنفس الفهرس الفريد (${idx.name}) في ${storeName}.`);
          }
        } else if (existingRec[idx.keyPath] !== undefined && existingRec[idx.keyPath] === record[idx.keyPath]) {
          throw new Error(`سجل مكرر لنفس الفهرس الفريد (${idx.name}) في ${storeName}.`);
        }

    }
  }

async function initDatabase(customDbName = DB_NAME, customVersion = DB_VERSION) {
  const cacheKey = `${customDbName}@${customVersion}`;
  if (connections.has(cacheKey)) {
    return connections.get(cacheKey);
  }

  if (!hasNativeIndexedDB()) {
    const mem = getMemoryDB(customDbName, customVersion);
    if (mem.stores.categories.size === 0 && customDbName === DB_NAME) {
      for (const cat of DEFAULT_CATEGORIES) {
        mem.stores.categories.set(cat.id, structuredClone(cat));
      }
    }
    const conn = { isMemory: true, name: customDbName, version: mem.version, mem };
    connections.set(cacheKey, conn);
    return conn;
  }

  const dbPromise = new Promise((resolve, reject) => {
    try {
      const request = indexedDB.open(customDbName, customVersion);

      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        const tx = event.target.transaction;
        applyMigrations(db, event.oldVersion, event.newVersion || customVersion, tx);
      };

      request.onsuccess = (event) => {
        const db = event.target.result;
        db.onversionchange = () => {
          db.close();
          connections.delete(cacheKey);
        };
        resolve(db);
      };

      request.onerror = () => {
        reject(new Error(`تعذر فتح قاعدة البيانات المحلية: ${request.error?.message || 'Unknown error'}`));
      };

      request.onblocked = () => {
        reject(new Error('قاعدة البيانات محجوبة بواسطة علامة تبويب أخرى مفتوحة.'));
      };
    } catch (err) {
      reject(err);
    }
  });

  const db = await dbPromise;
  connections.set(cacheKey, db);

  if (customDbName === DB_NAME) {
    const existingCats = await getAllRecords('categories', customDbName);
    if (existingCats.length === 0) {
      for (const cat of DEFAULT_CATEGORIES) {
        try {
          await addRecord('categories', cat, customDbName);
        } catch {

        }
      }
    }
  }

  const db = await initDatabase(customDbName);
  if (db.isMemory) {
    return {
      name: db.name,
      version: db.version,
      storeNames: Object.keys(SCHEMA_STORES),
      indexes: Object.fromEntries(
        Object.entries(SCHEMA_STORES).map(([k, v]) => [k, v.indexes.map(i => i.name)])
      )
    };
  }
  const storeNames = Array.from(db.objectStoreNames);
  const tx = db.transaction(storeNames, 'readonly');
  const indexes = {};
  for (const s of storeNames) {
    indexes[s] = Array.from(tx.objectStore(s).indexNames);
  }
  return {
    name: db.name,
    version: db.version,
    storeNames,
    indexes

    checkUniqueConstraintsMemory(db.mem, storeName, clone, false);
    db.mem.stores[storeName].set(clone.id, clone);
    return structuredClone(clone);
  }

  return new Promise((resolve, reject) => {
    const tx = db.transaction([storeName], 'readwrite');
    const store = tx.objectStore(storeName);
    const req = store.add(clone);

    tx.oncomplete = () => resolve(structuredClone(clone));
    tx.onerror = () => {
      const errName = tx.error?.name || req.error?.name || '';
      if (errName === 'QuotaExceededError') {
        reject(new Error('امتلأت مساحة التخزين المحلية على الجهاز. يرجى تصدير نسخة احتياطية وتفريغ مساحة.'));

      } else {

      }
    };
  });

  validateStoreAndRecord(storeName, record);
  const db = await initDatabase(customDbName);
  const clone = structuredClone(record);

  if (db.isMemory) {
    checkUniqueConstraintsMemory(db.mem, storeName, clone, true);
    db.mem.stores[storeName].set(clone.id, clone);
    return structuredClone(clone);
  }

  return new Promise((resolve, reject) => {
    const tx = db.transaction([storeName], 'readwrite');
    const store = tx.objectStore(storeName);
    store.put(clone);

    tx.oncomplete = () => resolve(structuredClone(clone));
    tx.onerror = () => {
      reject(new Error(`تعذر تحديث السجل في ${storeName}: ${tx.error?.message || 'خطأ غير معروف'}`));
    };
  });

async function deleteRecord(storeName, id, customDbName = DB_NAME) {

  if (!id) throw new Error('معرّف السجل مطلوب للحذف.');
  const db = await initDatabase(customDbName);

  if (db.isMemory) {
    const existed = db.mem.stores[storeName].delete(id);
    return existed;
  }

  return new Promise((resolve, reject) => {
    const tx = db.transaction([storeName], 'readwrite');
    const store = tx.objectStore(storeName);
    store.delete(id);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(new Error(`تعذر حذف السجل من ${storeName}`));
  });
}

  if (!SCHEMA_STORES[storeName]) throw new Error(`مخزن غير معروف: ${storeName}`);
  const db = await initDatabase(customDbName);

  if (db.isMemory) {
    const item = db.mem.stores[storeName].get(id);
    return item ? structuredClone(item) : null;
  }

  return new Promise((resolve, reject) => {
    const tx = db.transaction([storeName], 'readonly');
    const store = tx.objectStore(storeName);
    const req = store.get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(new Error(`تعذر قراءة السجل من ${storeName}`));

  if (!SCHEMA_STORES[storeName]) throw new Error(`مخزن غير معروف: ${storeName}`);
  const db = await initDatabase(customDbName);

    return Array.from(db.mem.stores[storeName].values()).map(v => structuredClone(v));

  return new Promise((resolve, reject) => {

        const inCat = task.category?.toLowerCase().includes(q);
        const inNotes = Array.isArray(task.notes) && task.notes.some(n => n.text?.toLowerCase().includes(q));
        if (!inTitle && !inDesc && !inCat && !inNotes) return false;
      }
      return true;
    });

    return filtered.sort((a, b) => {
      if (sortBy === 'priority') {
        const diff = (PRIORITY_WEIGHT[b.priority] || 0) - (PRIORITY_WEIGHT[a.priority] || 0);
        if (diff !== 0) return diff;
      }
      if (sortBy === 'dueDate' || sortBy === 'priority') {
        const da = a.dueDate || '9999-12-31';
        const db = b.dueDate || '9999-12-31';
        if (da !== db) return da.localeCompare(db);
      }
      return String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
    });
  }
};

/* ==========================================
 * 2. EVENTS & CALENDAR REPOSITORY
 * ========================================== */
const EventsRepo = {
  parseEventRange(ev) {
    const sDate = ev.startDate;
    const eDate = ev.endDate || ev.startDate;
    const sTime = ev.allDay ? '00:00' : (ev.startTime || '09:00');
    const eTime = ev.allDay ? '23:59' : (ev.endTime || '10:00');
    const start = parseLocalDate(sDate, sTime);
    const end = parseLocalDate(eDate, eTime);
    return { start, end };
  },

  detectOverlaps(candidate, allEvents) {
    const { start: cStart, end: cEnd } = this.parseEventRange(candidate);
    if (!cStart || !cEnd) return [];
    return allEvents.filter(other => {
      if (other.id === candidate.id) return false;
      const { start: oStart, end: oEnd } = this.parseEventRange(other);
      if (!oStart || !oEnd) return false;
      return cStart < oEnd && cEnd > oStart;
    });
  },

  async createEvent(input, dbName = DB_NAME) {
    const title = String(input?.title || '').trim();
    if (!title) throw new Error('عنوان الموعد إلزامي.');
    const startDate = String(input?.startDate || '').trim();
    if (!startDate) throw new Error('تاريخ بداية الموعد إلزامي.');
    const endDate = String(input?.endDate || startDate).trim();
    const allDay = Boolean(input?.allDay);
    const startTime = allDay ? '00:00' : String(input?.startTime || '09:00').trim();
    const endTime = allDay ? '23:59' : String(input?.endTime || '10:00').trim();

    const startObj = parseLocalDate(startDate, startTime);
    const endObj = parseLocalDate(endDate, endTime);
    if (endObj < startObj) {
      throw new Error('وقت نهاية الموعد لا يمكن أن يكون قبل وقت البداية.');
    }

    const nowIso = new Date().toISOString();
    const eventRecord = {
      id: input.id || generateId('ev'),
      title,
      description: String(input.description || '').trim(),
      startDate,
      startTime,
      endDate,
      endTime,
      allDay,
      location: String(input.location || '').trim(),
      notes: String(input.notes || '').trim(),
      reminderMinutes: input.reminderMinutes !== undefined && input.reminderMinutes !== ''
        ? Number(input.reminderMinutes)
        : 30,
      reminderStatus: input.reminderStatus || 'scheduled',
      notificationId: input.notificationId || null,
      createdAt: input.createdAt || nowIso,
      updatedAt: nowIso
    };

    return addRecord(STORE_NAMES.EVENTS, eventRecord, dbName);
  },

  async updateEvent(id, patch, dbName = DB_NAME) {
    const existing = await getRecord(STORE_NAMES.EVENTS, id, dbName);
    if (!existing) throw new Error('الموعد غير موجود.');
    const merged = {
      ...existing,
      ...patch,
      id: existing.id,
      updatedAt: new Date().toISOString()
    };
    if (!String(merged.title || '').trim()) {
      throw new Error('عنوان الموعد إلزامي.');
    }
    const { start, end } = this.parseEventRange(merged);
    if (end < start) {
      throw new Error('وقت نهاية الموعد لا يمكن أن يكون قبل وقت البداية.');
    }
    return updateRecord(STORE_NAMES.EVENTS, merged, dbName);
  },

  async deleteEvent(id, dbName = DB_NAME) {
    const reminders = await queryRecords(STORE_NAMES.REMINDERS, r => r.targetType === 'event' && r.targetId === id, dbName);
    for (const rem of reminders) {
      await deleteRecord(STORE_NAMES.REMINDERS, rem.id, dbName);
    }
    return deleteRecord(STORE_NAMES.EVENTS, id, dbName);
  }
};

/* ==========================================
 * 3. FINANCE & BUDGETS REPOSITORY (DZD Exact Minor Units)
 * ========================================== */
const FinanceRepo = {
  async createTransaction(input, dbName = DB_NAME) {
    const type = input?.type === 'income' ? 'income' : (input?.type === 'expense' ? 'expense' : null);
    if (!type) {
      throw new Error('نوع العملية المالية يجب أن يكون دخلًا (income) أو مصروفًا (expense).');
    }

    const amountMinor = input.amountMinor !== undefined
      ? Math.round(Number(input.amountMinor))
      : toMinorUnits(input.amount);

    if (!Number.isFinite(amountMinor) || amountMinor <= 0) {
      throw new Error('المبلغ يجب أن يكون رقمًا موجبًا أكبر من الصفر.');
    }

    const date = String(input.date || getLocalDateString()).trim();
    const time = String(input.time || getLocalTimeString()).trim();
    const categoryId = String(input.categoryId || (type === 'income' ? 'cat_salary' : 'cat_other')).trim();
    const nowIso = new Date().toISOString();

    const tx = {
      id: input.id || generateId('tx'),
      type,
      amountMinor,
      amount: fromMinorUnits(amountMinor),
      categoryId,
      date,
      month: date.slice(0, 7),
      time,
      description: String(input.description || '').trim(),
      paymentMethod: String(input.paymentMethod || 'cash').trim(),
      notes: String(input.notes || '').trim(),
      createdAt: input.createdAt || nowIso,
      updatedAt: nowIso
    };

    return addRecord(STORE_NAMES.TRANSACTIONS, tx, dbName);
  },

  async updateTransaction(id, patch, dbName = DB_NAME) {
    const existing = await getRecord(STORE_NAMES.TRANSACTIONS, id, dbName);
    if (!existing) throw new Error('العملية المالية غير موجودة.');

    let amountMinor = existing.amountMinor;
    if (patch.amountMinor !== undefined) {
      amountMinor = Math.round(Number(patch.amountMinor));
    } else if (patch.amount !== undefined) {
      amountMinor = toMinorUnits(patch.amount);
    }

    if (!Number.isFinite(amountMinor) || amountMinor <= 0) {
      throw new Error('المبلغ يجب أن يكون رقمًا موجبًا أكبر من الصفر.');
    }

    const date = patch.date ? String(patch.date).trim() : existing.date;
    const updated = {
      ...existing,
      ...patch,
      id: existing.id,
      amountMinor,
      amount: fromMinorUnits(amountMinor),
      date,
      month: date.slice(0, 7),
      updatedAt: new Date().toISOString()
    };

    return updateRecord(STORE_NAMES.TRANSACTIONS, updated, dbName);
  },

  async deleteTransaction(id, dbName = DB_NAME) {
    return deleteRecord(STORE_NAMES.TRANSACTIONS, id, dbName);
  },

  calculateSummary(transactions, filters = {}) {
    const {
      startDate = null,
      endDate = null,
      month = null,
      categoryId = 'all',
      type = 'all',
      query = ''
    } = filters;

    const q = String(query || '').trim().toLowerCase();
    const seenIds = new Set();
    let incomeMinor = 0;
    let expenseMinor = 0;
    const byCategoryMinor = {};
    const matchedTransactions = [];

    for (const tx of transactions) {
      if (!tx || !tx.id || seenIds.has(tx.id)) continue;
      seenIds.add(tx.id);

      if (month && tx.date?.slice(0, 7) !== month) continue;
      if (startDate && tx.date < startDate) continue;
      if (endDate && tx.date > endDate) continue;
      if (categoryId !== 'all' && tx.categoryId !== categoryId) continue;
      if (type !== 'all' && tx.type !== type) continue;

      if (q) {
        const descMatch = tx.description?.toLowerCase().includes(q);
        const noteMatch = tx.notes?.toLowerCase().includes(q);
        const catMatch = tx.categoryId?.toLowerCase().includes(q);
        if (!descMatch && !noteMatch && !catMatch) continue;
      }

      const minor = Number.isFinite(tx.amountMinor) ? Math.round(tx.amountMinor) : toMinorUnits(tx.amount);
      if (!Number.isFinite(minor) || minor <= 0) continue;

      matchedTransactions.push(tx);
      if (tx.type === 'income') {
        incomeMinor += minor;
      } else if (tx.type === 'expense') {
        expenseMinor += minor;
        byCategoryMinor[tx.categoryId] = (byCategoryMinor[tx.categoryId] || 0) + minor;
      }
    }

    const netMinor = incomeMinor - expenseMinor;
    const topCategories = Object.entries(byCategoryMinor)
      .map(([catId, totalMinor]) => ({
        categoryId: catId,
        totalMinor,
        total: fromMinorUnits(totalMinor),
        percentage: expenseMinor > 0 ? Math.round((totalMinor / expenseMinor) * 1000) / 10 : 0
      }))
      .sort((a, b) => b.totalMinor - a.totalMinor);

    return {
      incomeMinor,
      expenseMinor,
      netMinor,
      income: fromMinorUnits(incomeMinor),
      expense: fromMinorUnits(expenseMinor),
      net: fromMinorUnits(netMinor),
      count: matchedTransactions.length,
      topCategories,
      transactions: matchedTransactions.sort((a, b) => {
        const dComp = String(b.date || '').localeCompare(String(a.date || ''));
        if (dComp !== 0) return dComp;
        return String(b.time || '').localeCompare(String(a.time || ''));
      })
    };
  },

  async setBudget(input, dbName = DB_NAME) {
    const month = String(input.month || getLocalDateString().slice(0, 7)).trim();
    const categoryId = String(input.categoryId || 'ALL').trim();
    const limitMinor = input.limitMinor !== undefined
      ? Math.round(Number(input.limitMinor))
      : toMinorUnits(input.limitAmount);

    if (!Number.isFinite(limitMinor) || limitMinor <= 0) {
      throw new Error('حد الميزانية يجب أن يكون مبلغًا موجبًا أكبر من الصفر.');
    }

    const id = input.id || `budget_${month}_${categoryId}`;
    const existing = await getRecord(STORE_NAMES.BUDGETS, id, dbName);
    const record = {
      id,
      month,
      categoryId,
      limitMinor,
      limitAmount: fromMinorUnits(limitMinor),
      updatedAt: new Date().toISOString(),
      createdAt: existing?.createdAt || new Date().toISOString()
    };

    if (existing) {
      return updateRecord(STORE_NAMES.BUDGETS, record, dbName);
    }
    return addRecord(STORE_NAMES.BUDGETS, record, dbName);
  },

  async evaluateBudgets(monthKey, dbName = DB_NAME) {
    const [budgets, transactions] = await Promise.all([
      queryRecords(STORE_NAMES.BUDGETS, b => b.month === monthKey, dbName),
      queryRecords(STORE_NAMES.TRANSACTIONS, tx => tx.date?.slice(0, 7) === monthKey && tx.type === 'expense', dbName)
    ]);

    const summary = this.calculateSummary(transactions, { month: monthKey, type: 'expense' });
    const catMap = {};
    for (const c of summary.topCategories) {
      catMap[c.categoryId] = c.totalMinor;
    }

    return budgets.map(b => {
      const spentMinor = b.categoryId === 'ALL' ? summary.expenseMinor : (catMap[b.categoryId] || 0);
      const remainingMinor = b.limitMinor - spentMinor;
      const usagePercent = b.limitMinor > 0 ? Math.round((spentMinor / b.limitMinor) * 1000) / 10 : 0;
      return {
        ...b,
        spentMinor,
        remainingMinor,
        spent: fromMinorUnits(spentMinor),
        remaining: fromMinorUnits(remainingMinor),
        usagePercent,
        isNearLimit: usagePercent >= 80 && usagePercent <= 100,
        isExceeded: spentMinor > b.limitMinor
      };
    });
  }
};

const HabitsRepo = {
  async createHabit(input, dbName = DB_NAME) {
    const name = String(input?.name || '').trim();
    if (!name) throw new Error('اسم العادة إلزامي.');
    const repeatDays = Array.isArray(input.repeatDays) && input.repeatDays.length > 0
      ? input.repeatDays.map(Number)
      : [0, 1, 2, 3, 4, 5, 6];
    const targetValue = Number(input.targetValue) > 0 ? Number(input.targetValue) : 1;
    const nowIso = new Date().toISOString();

    const habit = {
      id: input.id || generateId('hab'),
      name,
      description: String(input.description || '').trim(),
      icon: String(input.icon || '🎯').trim(),
      targetType: input.targetType === 'weekly' ? 'weekly' : 'daily',
      targetValue,
      repeatDays,
      reminderTime: input.reminderTime ? String(input.reminderTime).trim() : '',
      startDate: String(input.startDate || getLocalDateString()).trim(),

  async updateHabit(id, patch, dbName = DB_NAME) {

    const updated = {
      ...existing,

    };
    if (!String(updated.name || '').trim()) {
      throw new Error('اسم العادة إلزامي.');
    }
    return updateRecord(STORE_NAMES.HABITS, updated, dbName);
  },

  async logHabit(habitId, localDate = getLocalDateString(), value = 1, note = '', dbName = DB_NAME) {
    if (!habitId) throw new Error('معرّف العادة مطلوب.');
    const existingLogs = await queryRecords(
      STORE_NAMES.HABIT_LOGS,
      l => l.habitId === habitId && l.localDate === localDate,
      dbName
    );
    if (existingLogs.length > 0) {
      throw new Error('تم تسجيل إنجاز هذه العادة لهذا التاريخ مسبقًا.');
    }
    const logRecord = {
      id: `${habitId}_${localDate}`,
      habitId,
      localDate,
      value: Number(value) > 0 ? Number(value) : 1,
      note: String(note || '').trim(),
      createdAt: new Date().toISOString()
    };
    return addRecord(STORE_NAMES.HABIT_LOGS, logRecord, dbName);
  },

  async unlogHabit(habitId, localDate = getLocalDateString(), dbName = DB_NAME) {
    const existingLogs = await queryRecords(
      STORE_NAMES.HABIT_LOGS,
      l => l.habitId === habitId && l.localDate === localDate,
      dbName
    );
    for (const l of existingLogs) {
      await deleteRecord(STORE_NAMES.HABIT_LOGS, l.id, dbName);
    }
    return true;
  },

  async toggleHabitForDate(habitId, localDate = getLocalDateString(), dbName = DB_NAME) {
    const existingLogs = await queryRecords(
      STORE_NAMES.HABIT_LOGS,
      l => l.habitId === habitId && l.localDate === localDate,
      dbName
    );
    if (existingLogs.length > 0) {
      await this.unlogHabit(habitId, localDate, dbName);
      return { completed: false };
    }
    const habit = await getRecord(STORE_NAMES.HABITS, habitId, dbName);
    const val = habit?.targetValue || 1;
    await this.logHabit(habitId, localDate, val, '', dbName);
    return { completed: true };
  },

  calculateHabitStats(habit, habitLogs, referenceDateStr = getLocalDateString()) {
    const logsForHabit = habitLogs.filter(l => l.habitId === habit.id);
    const completedDates = new Set(
      logsForHabit
        .filter(l => Number(l.value || 1) >= Number(habit.targetValue || 1))
        .map(l => l.localDate)
    );

    const repeatDays = Array.isArray(habit.repeatDays) && habit.repeatDays.length > 0
      ? new Set(habit.repeatDays.map(Number))
      : new Set([0, 1, 2, 3, 4, 5, 6]);

    const isScheduledDay = (dateStr) => {
      const dt = parseLocalDate(dateStr);
      return dt ? repeatDays.has(dt.getDay()) : true;
    };

    // 1. Current Streak (skipping non-scheduled days)
    let currentStreak = 0;
    let cursor = referenceDateStr;
    for (let i = 0; i < 366; i++) {
      if (cursor < habit.startDate) break;
      if (isScheduledDay(cursor)) {
        if (completedDates.has(cursor)) {
          currentStreak++;
        } else {
          // If today is not completed yet, check if yesterday keeps the streak alive
          if (cursor === referenceDateStr) {
            cursor = addDaysToDateString(cursor, -1);
            continue;
          }
          break;
        }
      }
      cursor = addDaysToDateString(cursor, -1);
    }

    // 2. Adherence Rate since startDate (up to referenceDateStr)
    let scheduledCount = 0;
    let completedScheduledCount = 0;
    let dayPtr = habit.startDate <= referenceDateStr ? habit.startDate : referenceDateStr;
    let guard = 0;
    while (dayPtr <= referenceDateStr && guard < 366) {
      if (isScheduledDay(dayPtr)) {
        scheduledCount++;
        if (completedDates.has(dayPtr)) {
          completedScheduledCount++;
        }
      }
      dayPtr = addDaysToDateString(dayPtr, 1);
      guard++;
    }

    const adherencePercent = scheduledCount > 0
      ? Math.min(100, Math.round((completedScheduledCount / scheduledCount) * 100))
      : (completedDates.size > 0 ? 100 : 0);

    // 3. Last 7 days array for visual week tracker
    const weekDays = [];
    for (let offset = -6; offset <= 0; offset++) {
      const dStr = addDaysToDateString(referenceDateStr, offset);
      weekDays.push({
        date: dStr,
        scheduled: isScheduledDay(dStr),
        completed: completedDates.has(dStr)
      });
    }

    return {
      currentStreak,
      adherencePercent,
      scheduledCount,
      completedScheduledCount,
      totalLogs: logsForHabit.length,
      completedToday: completedDates.has(referenceDateStr),
      weekDays
    };
  }
};

const SUPPORTED_BACKUP_VERSIONS = [1];
async function exportBackupData(nonSensitiveSettings = {}, dbName = DB_NAME) {

  const storesData = {};

  for (const storeName of Object.keys(SCHEMA_STORES)) {

function validateBackupPayload(rawJsonOrObj) {
  let parsed;
  if (typeof rawJsonOrObj === 'string') {
    try {
      parsed = JSON.parse(rawJsonOrObj);
    } catch {
      return { valid: false, error: 'ملف النسخة الاحتياطية ليس بتنسيق JSON صالح.' };
    }
  } else if (rawJsonOrObj && typeof rawJsonOrObj === 'object') {
    parsed = rawJsonOrObj;
  } else {
    return { valid: false, error: 'محتوى ملف النسخة الاحتياطية فارغ أو غير صالح.' };
  }

  if (parsed.app !== 'YAWMI') {
    return { valid: false, error: 'هذا الملف لا ينتمي لتطبيق يومي (YAWMI).' };
  }

  if (!SUPPORTED_BACKUP_VERSIONS.includes(Number(parsed.backupFormatVersion))) {
    return {
      valid: false,
      error: `إصدار تنسيق النسخة الاحتياطية (${parsed.backupFormatVersion}) غير مدعوم في هذا الإصدار.`
    };
  }

  if (!parsed.stores || typeof parsed.stores !== 'object') {
    return { valid: false, error: 'بنية المخازن (stores) مفقودة في ملف النسخة الاحتياطية.' };
  }

  const summary = {};
  const seenIdsPerStore = {};

  for (const storeName of Object.keys(SCHEMA_STORES)) {
    const list = parsed.stores[storeName];
    if (list === undefined) {
      summary[storeName] = 0;
      continue;
    }
    if (!Array.isArray(list)) {
      return { valid: false, error: `بيانات المخزن (${storeName}) يجب أن تكون مصفوفة.` };
    }
    seenIdsPerStore[storeName] = new Set();
    for (const item of list) {
      if (!item || typeof item !== 'object' || typeof item.id !== 'string' || !item.id.trim()) {
        return { valid: false, error: `يوجد سجل بدون معرّف صالح (id) داخل مخزن (${storeName}).` };

async function importBackupData(rawJsonOrObj, options = { mode: 'replace' }, dbName = DB_NAME) {
  const validation = validateBackupPayload(rawJsonOrObj);
  if (!validation.valid) {
    throw new Error(validation.error);
  }

  const { data, summary } = validation;
  const mode = options?.mode === 'merge' ? 'merge' : 'replace';

  // Snapshot current data before modifying so we can roll back if any unexpected error occurs
  const snapshot = {};
  for (const storeName of Object.keys(SCHEMA_STORES)) {
    snapshot[storeName] = await getAllRecords(storeName, dbName);
  }

  try {
    for (const storeName of Object.keys(SCHEMA_STORES)) {
      const incoming = data.stores[storeName] || [];
      if (mode === 'replace') {
        await clearStore(storeName, dbName);
        for (const rec of incoming) {
          await addRecord(storeName, rec, dbName);
        }
      } else {
        for (const rec of incoming) {
          await updateRecord(storeName, rec, dbName);
        }
      }
    }
    return {
      success: true,
      mode,
      summary,
      preferences: data.preferences || null
    };
  } catch (err) {
    // Restore from snapshot to guarantee zero data loss
    for (const [storeName, oldRecords] of Object.entries(snapshot)) {
      await clearStore(storeName, dbName);
      for (const rec of oldRecords) {
        await updateRecord(storeName, rec, dbName);
      }
    }
    throw new Error(`فشل الاستيراد وتمت استعادة البيانات الأصلية بأمان: ${err.message}`);
  }
}

/**
 * YAWMI — Unified Cross-Store Search & Filtering Engine
 * Searches Tasks, Events, Notes, and Financial Transactions directly from yawmiDB.
 */
async function executeUnifiedSearch(filters = {}, dbName = DB_NAME) {
  const {
    query = '',
    scope = 'all', // 'all' | 'tasks' | 'events' | 'transactions' | 'notes'
    status = 'all',
    category = 'all',
    dateFrom = '',
    dateTo = ''
  } = filters;

  const q = String(query || '').trim().toLowerCase();
  const [tasks, events, transactions, notes, categories] = await Promise.all([
    scope === 'all' || scope === 'tasks' ? getAllRecords(STORE_NAMES.TASKS, dbName) : [],
    scope === 'all' || scope === 'events' ? getAllRecords(STORE_NAMES.EVENTS, dbName) : [],
    scope === 'all' || scope === 'transactions' ? getAllRecords(STORE_NAMES.TRANSACTIONS, dbName) : [],
    scope === 'all' || scope === 'notes' ? getAllRecords(STORE_NAMES.NOTES, dbName) : [],
    getAllRecords(STORE_NAMES.CATEGORIES, dbName)
  ]);

  const catNameMap = Object.fromEntries(categories.map(c => [c.id, c.name]));
  const results = [];

  for (const t of tasks) {
    if (status !== 'all' && t.status !== status) continue;
    if (category !== 'all' && t.category !== category) continue;
    if (dateFrom && (!t.dueDate || t.dueDate < dateFrom)) continue;
    if (dateTo && (!t.dueDate || t.dueDate > dateTo)) continue;
    if (q) {
      const hay = `${t.title} ${t.description || ''} ${t.category || ''}`.toLowerCase();
      if (!hay.includes(q)) continue;
    }
    results.push({
      type: 'task',
      id: t.id,
      title: t.title,
      subtitle: `مهمة • ${t.dueDate || 'دون تاريخ'} • ${t.status === 'completed' ? 'مكتملة' : 'مفتوحة'}`,
      date: t.dueDate || t.createdAt?.slice(0, 10) || '',
      raw: t
    });
  }

  for (const ev of events) {
    if (dateFrom && ev.startDate < dateFrom) continue;
    if (dateTo && ev.startDate > dateTo) continue;
    if (q) {
      const hay = `${ev.title} ${ev.description || ''} ${ev.location || ''} ${ev.notes || ''}`.toLowerCase();
      if (!hay.includes(q)) continue;
    }
    results.push({
      type: 'event',
      id: ev.id,
      title: ev.title,
      subtitle: `موعد • ${ev.startDate} ${ev.allDay ? '(طوال اليوم)' : ev.startTime}`,
      date: ev.startDate,
      raw: ev
    });
  }

  for (const tx of transactions) {
    if (category !== 'all' && tx.categoryId !== category && catNameMap[tx.categoryId] !== category) continue;
    if (dateFrom && tx.date < dateFrom) continue;
    if (dateTo && tx.date > dateTo) continue;
    const catLabel = catNameMap[tx.categoryId] || tx.categoryId;
    if (q) {
      const hay = `${tx.description || ''} ${tx.notes || ''} ${catLabel}`.toLowerCase();
      if (!hay.includes(q)) continue;
    }
    results.push({
      type: 'transaction',
      id: tx.id,
      title: `${tx.type === 'income' ? '+' : '-'}${formatMoney(tx.amountMinor)} — ${catLabel}`,
      subtitle: `عملية مالية • ${tx.date} ${tx.description ? '• ' + tx.description : ''}`,
      date: tx.date,
      raw: tx
    });
  }

  for (const n of notes) {
    if (category !== 'all' && n.category !== category) continue;
    const nDate = (n.updatedAt || n.createdAt || '').slice(0, 10);
    if (dateFrom && nDate < dateFrom) continue;
    if (dateTo && nDate > dateTo) continue;
    if (q) {
      const checklistText = (n.checklistItems || []).map(i => i.text).join(' ');
      const tagsText = (n.tags || []).join(' ');
      const hay = `${n.title} ${n.content || ''} ${checklistText} ${tagsText}`.toLowerCase();
      if (!hay.includes(q)) continue;
    }
    results.push({
      type: 'note',
      id: n.id,
      title: n.title,
      subtitle: `ملاحظة • ${(n.tags || []).join(', ') || n.category || 'عام'}`,
      date: nDate,
      raw: n
    });
  }

  return {
    totalCount: results.length,
    results
  };
}

const PRIORITY_BASE = {

  medium: 40,
  low: 15

  /**
   * Ranks open tasks using configurable weights and actual user fields.
   * Never invents estimatedMinutes or dueDate if not provided by user.
   */
  rankTasks(tasks, weights = {}, context = {}) {
    const referenceDateStr = context.referenceDateStr || getLocalDateString();
    const availableMinutesBeforeNextEvent = context.availableMinutesBeforeNextEvent ?? null;

    const wPriority = Number(weights.priority ?? 35) / 35;
    const wProximity = Number(weights.dueProximity ?? 25) / 25;
    const wOverdue = Number(weights.overdueBonus ?? 40) / 40;
    const wShortDuration = Number(weights.shortDurationBonus ?? 15) / 15;

    const openTasks = tasks.filter(t => t && t.status !== 'completed');

    return openTasks.map(task => {
      let score = 0;
      const reasons = [];

      // 1. Priority Factor
      const pScore = (PRIORITY_BASE[task.priority] || 40) * wPriority;
      score += pScore;
      if (task.priority === 'urgent') reasons.push('أولوية عاجلة');
      else if (task.priority === 'high') reasons.push('أولوية عالية');

      // 2. Overdue & Due Proximity Factor (strictly from real dueDate)
      let isOverdue = false;
      let isDueToday = false;
      if (task.dueDate) {
        if (task.dueDate < referenceDateStr) {
          isOverdue = true;
          score += 95 * wOverdue;
          reasons.push(`متأخرة منذ ${task.dueDate}`);
        } else if (task.dueDate === referenceDateStr) {
          isDueToday = true;
          score += 55 * wProximity;
          reasons.push('مستحقة اليوم');
        } else {
          score += 15 * wProximity;
        }
      }

      // 3. Fit before next appointment (ONLY if user explicitly entered estimatedMinutes)
      let fitsBeforeNextEvent = false;
      if (
        Number.isFinite(task.estimatedMinutes) &&
        task.estimatedMinutes > 0 &&
        availableMinutesBeforeNextEvent !== null &&
        availableMinutesBeforeNextEvent > 0
      ) {
        if (task.estimatedMinutes <= availableMinutesBeforeNextEvent) {
          fitsBeforeNextEvent = true;
          score += 35 * wShortDuration;
          reasons.push(`تستغرق ${task.estimatedMinutes} دقيقة وتناسب الوقت المتاح قبل موعدك القادم (${availableMinutesBeforeNextEvent} دقيقة)`);
        }
      }

      return {
        task,
        score: Math.round(score * 10) / 10,
        isOverdue,
        isDueToday,
        fitsBeforeNextEvent,
        reasons
      };
    }).sort((a, b) => b.score - a.score);
  },

  async analyzeWorkspace(options = {}, dbName = DB_NAME) {

    const weights = options.weights || {};
    const dismissedIds = new Set(options.dismissedSuggestionIds || []);

      getAllRecords(STORE_NAMES.HABITS, dbName),

    // 1. Check upcoming events today and calculate available window before next event
    const todayEvents = events

      .sort((a, b) => String(a.startTime).localeCompare(String(b.startTime)));

    let nextEvent = null;
    let availableMinutesBeforeNextEvent = null;
    const nowDt = parseLocalDate(todayStr, nowTimeStr);

    for (const ev of todayEvents) {
      const evStart = parseLocalDate(ev.startDate, ev.startTime);
      if (evStart && nowDt && evStart > nowDt) {

/**

const calendarSearchState = {
  query: ''
};

async function syncEventReminder(ev) {
  if (ev.reminderMinutes === null || ev.reminderMinutes === undefined || ev.reminderMinutes === '' || ev.reminderMinutes < 0) {
    await NotificationsService.cancelRemindersForTarget('event', ev.id);
    return;
  }
  const startDt = parseLocalDate(ev.startDate, ev.allDay ? '09:00' : (ev.startTime || '09:00'));
  if (!startDt) return;
  const triggerDt = new Date(startDt.getTime() - Number(ev.reminderMinutes) * 60000);
  if (triggerDt.getTime() > Date.now() - 60000) {
    await NotificationsService.scheduleReminder({
      targetType: 'event',
      targetId: ev.id,
      title: `تذكير بموعد: ${ev.title}`,
      body: `${ev.startDate} ${ev.allDay ? '(طوال اليوم)' : ev.startTime}${ev.location ? ' • ' + ev.location : ''}`,
      triggerDateObj: triggerDt
    });
  }
}

      </div>
    </form>

      const allDayChk = document.getElementById('ev-allday');
      const sDateEl = document.getElementById('ev-start-date');
      const sTimeEl = document.getElementById('ev-start-time');
      const eDateEl = document.getElementById('ev-end-date');
      const eTimeEl = document.getElementById('ev-end-time');
      const warnEl = document.getElementById('event-overlap-warning');

      const updateVisibilityAndOverlap = () => {
        const isAllDay = allDayChk.checked;
        document.getElementById('ev-start-time-wrap').style.display = isAllDay ? 'none' : 'flex';
        document.getElementById('ev-end-time-wrap').style.display = isAllDay ? 'none' : 'flex';

        const candidate = {
          id: ev.id || 'temp_candidate',
          startDate: sDateEl.value,
          endDate: eDateEl.value || sDateEl.value,
          startTime: sTimeEl.value,
          endTime: eTimeEl.value,
          allDay: isAllDay

          warnEl.style.display = 'none';
        }
      };

      allDayChk.addEventListener('change', updateVisibilityAndOverlap);
      sDateEl.addEventListener('change', () => {
        if (!eDateEl.value || eDateEl.value < sDateEl.value) eDateEl.value = sDateEl.value;
        updateVisibilityAndOverlap();
      });
      sTimeEl.addEventListener('change', updateVisibilityAndOverlap);
      eDateEl.addEventListener('change', updateVisibilityAndOverlap);
      eTimeEl.addEventListener('change', updateVisibilityAndOverlap);

      document.getElementById('ev-modal-cancel')?.addEventListener('click', closeModal);

          try {
            const payload = {
              title: document.getElementById('ev-title').value,
              allDay: allDayChk.checked,
              startDate: sDateEl.value,
              startTime: sTimeEl.value,

              reminderMinutes: Number(document.getElementById('ev-reminder').value),
              notes: document.getElementById('ev-notes').value
            };

              ? await EventsRepo.updateEvent(ev.id, payload)
              : await EventsRepo.createEvent(payload);

            await syncEventReminder(saved);
            closeModal();
            showToast(isEdit ? 'تم تحديث الموعد' : 'تمت إضافة الموعد', 'success');

function buildMonthGridDays(selectedDateStr, allEvents) {
  const [year, month] = selectedDateStr.split('-').map(Number);
  const firstDayOfMonth = new Date(year, month - 1, 1);
  const startDayOfWeek = firstDayOfMonth.getDay(); // 0=Sun..6=Sat
  const daysInMonth = new Date(year, month, 0).getDate();

  const eventsByDate = {};
  for (const ev of allEvents) {
    eventsByDate[ev.startDate] = (eventsByDate[ev.startDate] || 0) + 1;
  }

  const cells = [];
  for (let i = 0; i < startDayOfWeek; i++) {
    cells.push({ empty: true });
  }
  const todayStr = getLocalDateString();
  for (let day = 1; day <= daysInMonth; day++) {
    const dStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    cells.push({
      empty: false,
      day,
      dateStr: dStr,
      isToday: dStr === todayStr,
      isSelected: dStr === selectedDateStr,
      count: eventsByDate[dStr] || 0
    });
  }
  return { year, month, cells };
}
async function renderCalendarSection(containerEl, onRefreshApp) {
  const todayStr = getLocalDateString();
  if (!appState.selectedCalendarDate) {
    appState.selectedCalendarDate = todayStr;
  }
  const selectedDate = appState.selectedCalendarDate;
  const viewMode = appState.calendarViewMode || 'month';
  const allEvents = await getAllRecords(STORE_NAMES.EVENTS);

  const q = calendarSearchState.query.trim().toLowerCase();
  const filteredByQuery = q
    ? allEvents.filter(ev => `${ev.title} ${ev.location || ''} ${ev.notes || ''}`.toLowerCase().includes(q))
    : allEvents;

  let displayedEvents = [];
  if (q) {
    displayedEvents = filteredByQuery;
  } else if (viewMode === 'day' || viewMode === 'month') {
    displayedEvents = filteredByQuery.filter(ev => ev.startDate <= selectedDate && (ev.endDate || ev.startDate) >= selectedDate);
  } else if (viewMode === 'week') {
    const weekEnd = addDaysToDateString(selectedDate, 6);
    displayedEvents = filteredByQuery.filter(ev => ev.startDate >= selectedDate && ev.startDate <= weekEnd);
  }

  displayedEvents.sort((a, b) => {
    const d = String(a.startDate).localeCompare(String(b.startDate));
    if (d !== 0) return d;
    return String(a.startTime || '').localeCompare(String(b.startTime || ''));
  });

  const { year, month, cells } = buildMonthGridDays(selectedDate, allEvents);
  const weekDayNames = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

    </div>

        </div>
        <div class="calendar-grid-days">
          ${cells.map(c => c.empty ? `<div></div>` : `
            <button type="button" class="cal-day-cell ${c.isToday ? 'today' : ''} ${c.isSelected ? 'selected' : ''}" data-cal-date="${c.dateStr}">

            actionId: 'cal-empty-add-btn'
          })
        : displayedEvents.map(ev => {

    <div class="kpi-grid-3">

/**
 * YAWMI — Habits & Daily Goals Module (Streaks, Adherence Rate, Weekly Progress, History Log)
 */
const habitsFilterState = {
  status: 'active' // 'active' | 'archived'
};

const WEEKDAYS_AR = [
  { day: 0, short: 'أحد' },
  { day: 1, short: 'إثن' },
  { day: 2, short: 'ثلا' },
  { day: 3, short: 'أرب' },
  { day: 4, short: 'خمي' },
  { day: 5, short: 'جمع' },
  { day: 6, short: 'سبت' }
];
function openHabitFormModal(existingHabit = null, onSaved = null) {
  const isEdit = Boolean(existingHabit && existingHabit.id);
  const habit = existingHabit || {
    name: '',
    description: '',
    icon: '🎯',
    targetType: 'daily',
    targetValue: 1,
    repeatDays: [0, 1, 2, 3, 4, 5, 6],
    reminderTime: '',
    startDate: getLocalDateString(),
    status: 'active'
  };

  const selectedDays = new Set(Array.isArray(habit.repeatDays) ? habit.repeatDays.map(Number) : [0, 1, 2, 3, 4, 5, 6]);

  const bodyHtml = `
    <form id="yawmi-habit-form" class="form-grid">
      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label" for="hab-name">اسم العادة *</label>
          <input type="text" id="hab-name" class="form-input" required placeholder="مثال: المشي اليومي / قراءة 10 صفحات" value="${escapeHtml(habit.name)}">
        </div>
        <div class="form-group">
          <label class="form-label" for="hab-icon">الرمز / الأيقونة</label>
          <input type="text" id="hab-icon" class="form-input" style="text-align:center;" value="${escapeHtml(habit.icon || '🎯')}">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="hab-desc">وصف أو دافع (اختياري)</label>
        <input type="text" id="hab-desc" class="form-input" placeholder="لماذا تهمك هذه العادة؟" value="${escapeHtml(habit.description || '')}">
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label" for="hab-target-type">نوع الهدف</label>
          <select id="hab-target-type" class="form-select">
            <option value="daily" ${habit.targetType === 'daily' ? 'selected' : ''}>يومي</option>
            <option value="weekly" ${habit.targetType === 'weekly' ? 'selected' : ''}>أسبوعي</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="hab-target-val">قيمة الهدف اليومي</label>
          <input type="number" id="hab-target-val" class="form-input" min="1" max="100" value="${escapeHtml(habit.targetValue || 1)}">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">أيام التكرار المطلوبة في الأسبوع</label>
        <div class="weekday-picker" id="hab-days-picker">
          ${WEEKDAYS_AR.map(w => `
            <button type="button" class="day-chip ${selectedDays.has(w.day) ? 'selected' : ''}" data-day="${w.day}">
              ${w.short}
            </button>
          `).join('')}
        </div>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label" for="hab-start">تاريخ البداية</label>
          <input type="date" id="hab-start" class="form-input" value="${escapeHtml(habit.startDate || getLocalDateString())}">
        </div>
        <div class="form-group">
          <label class="form-label" for="hab-reminder">وقت التذكير (اختياري)</label>
          <input type="time" id="hab-reminder" class="form-input" value="${escapeHtml(habit.reminderTime || '')}">
        </div>
      </div>

      ${isEdit ? `
        <div class="form-group">
          <label class="form-label" for="hab-status">حالة العادة</label>
          <select id="hab-status" class="form-select">
            <option value="active" ${habit.status === 'active' ? 'selected' : ''}>نشطة</option>
            <option value="archived" ${habit.status === 'archived' ? 'selected' : ''}>مؤرشفة</option>
          </select>
        </div>
      ` : ''}
    </form>
  `;

  const footerHtml = `
    ${isEdit ? `<button type="button" class="btn btn-danger btn-sm" id="hab-delete-btn">${getIconSvg('trash', 15)} حذف</button>` : ''}
    <button type="button" class="btn btn-secondary" id="hab-cancel-btn">إلغاء</button>
    <button type="button" class="btn btn-primary" id="hab-save-btn">${isEdit ? 'حفظ التعديلات' : 'إضافة العادة'}</button>
  `;

  openModal({
    title: isEdit ? 'تعديل العادة' : 'عادة جديدة',
    bodyHtml,
    footerHtml,
    onMount: (modalEl) => {
      modalEl.querySelectorAll('[data-day]').forEach(chip => {
        chip.addEventListener('click', () => {
          const d = Number(chip.getAttribute('data-day'));
          if (selectedDays.has(d)) {
            if (selectedDays.size > 1) {
              selectedDays.delete(d);
              chip.classList.remove('selected');
            } else {
              showToast('اختر يومًا واحدًا على الأقل في الأسبوع', 'warning');
            }
          } else {
            selectedDays.add(d);
            chip.classList.add('selected');
          }
        });
      });

      document.getElementById('hab-cancel-btn')?.addEventListener('click', closeModal);

      document.getElementById('hab-delete-btn')?.addEventListener('click', () => {
        confirmAction({
          title: 'حذف العادة',
          message: `هل أنت متأكد من حذف العادة «${habit.name}» وجميع سجلاتها؟`,
          onConfirm: async () => {
            await deleteRecord(STORE_NAMES.HABITS, habit.id);
            const logs = await getAllRecords(STORE_NAMES.HABIT_LOGS);
            for (const l of logs.filter(x => x.habitId === habit.id)) {
              await deleteRecord(STORE_NAMES.HABIT_LOGS, l.id);
            }
            showToast('تم حذف العادة وسجلاتها', 'info');
            if (typeof onSaved === 'function') await onSaved();
          }
        });
      });

      document.getElementById('hab-save-btn')?.addEventListener('click', () => {
        withSubmitLock('save-habit', async () => {
          try {
            const payload = {
              name: document.getElementById('hab-name').value,
              icon: document.getElementById('hab-icon').value,
              description: document.getElementById('hab-desc').value,
              targetType: document.getElementById('hab-target-type').value,
              targetValue: Number(document.getElementById('hab-target-val').value || 1),
              repeatDays: Array.from(selectedDays).sort(),
              startDate: document.getElementById('hab-start').value,
              reminderTime: document.getElementById('hab-reminder').value,
              status: isEdit ? document.getElementById('hab-status').value : 'active'
            };

            if (isEdit) {
              await HabitsRepo.updateHabit(habit.id, payload);
            } else {
              await HabitsRepo.createHabit(payload);
            }
            closeModal();
            showToast(isEdit ? 'تم تحديث العادة' : 'تمت إضافة العادة بنجاح', 'success');
            if (typeof onSaved === 'function') await onSaved();
          } catch (err) {
            showToast(err.message || 'تعذر حفظ العادة', 'error');
          }
        });
      });
    }
  });
}
async function renderHabitsView(containerEl, onRefreshApp) {

    getAllRecords(STORE_NAMES.HABITS),
    getAllRecords(STORE_NAMES.HABIT_LOGS)

  const filteredHabits = allHabits.filter(h => h.status === habitsFilterState.status);

      <div class="segmented-tabs" style="flex:1;">

        <button type="button" class="seg-tab ${habitsFilterState.status === 'archived' ? 'active' : ''}" data-hab-status="archived">المؤرشفة (${allHabits.filter(h => h.status === 'archived').length})</button>
      </div>
      <button type="button" class="btn btn-primary btn-sm" id="hab-new-btn">
        ${getIconSvg('plus', 16)}

    <div class="item-list">
      ${filteredHabits.length === 0
        ? renderEmptyState({
            icon: 'target',
            title: habitsFilterState.status === 'active' ? 'لا توجد عادات نشطة بعد' : 'لا توجد عادات مؤرشفة',
            description: 'ابنِ عاداتك اليومية وتابع سلسلة الإنجاز ونسبة الالتزام الحقيقية حسب جدول أيام التكرار.',
            actionLabel: 'إضافة عادة جديدة',
            actionId: 'hab-empty-add-btn'
          })
        : filteredHabits.map(h => {
            const stats = HabitsRepo.calculateHabitStats(h, allLogs, todayStr);
            return `
              <div class="card" style="display:flex;flex-direction:column;gap:12px;">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
                  <div style="display:flex;align-items:center;gap:10px;cursor:pointer;" data-edit-habit="${escapeHtml(h.id)}">
                    <span style="width:40px;height:40px;border-radius:12px;background:var(--bg-surface-muted);display:inline-flex;align-items:center;justify-content:center;font-size:1.25rem;">
                      ${escapeHtml(h.icon || '🎯')}
                    </span>
                    <div>
                      <div style="font-weight:800;font-size:0.96rem;">${escapeHtml(h.name)}</div>
                      <div style="font-size:0.76rem;color:var(--text-muted);">
                        🔥 السلسلة: <strong>${stats.currentStreak} يوم</strong> • الالتزام: <strong>${stats.adherencePercent}%</strong>
                      </div>
                    </div>
                  </div>
                  <button type="button" class="btn ${stats.completedToday ? 'btn-primary' : 'btn-secondary'} btn-sm" data-toggle-habit="${escapeHtml(h.id)}" data-date="${todayStr}">
                    ${stats.completedToday ? 'مكتمل اليوم ✓' : 'تسجيل اليوم'}
                  </button>
                </div>

/**
 * YAWMI — Local Notebook, Checklists & Shopping Lists Module with Safe Auto-Save
 */
const notesFilterState = {
  query: '',
  noteType: 'all' // 'all' | 'text' | 'checklist' | 'shopping'
};

let activeDraftNoteFlush = null;
registerBeforeLeaveHook(async () => {
  if (typeof activeDraftNoteFlush === 'function') {
    await activeDraftNoteFlush();
  }
});
function openNoteModal(existingNote = null, onSaved = null) {
  const isEdit = Boolean(existingNote && existingNote.id);
  const draftId = existingNote?.id || generateId('note');
  const note = existingNote || {
    id: draftId,
    title: '',
    content: '',
    noteType: 'text',
    checklistItems: [],
    tags: [],
    category: 'عام',
    pinned: false
  };

  let checklistItems = Array.isArray(note.checklistItems) ? structuredClone(note.checklistItems) : [];
  let isDirty = false;

  const persistDraftNow = async (silent = true) => {
    if (!isDirty) return null;
    const titleEl = document.getElementById('note-title-input');
    const contentEl = document.getElementById('note-content-input');
    const typeEl = document.getElementById('note-type-select');
    const tagsEl = document.getElementById('note-tags-input');
    const catEl = document.getElementById('note-cat-input');
    const pinEl = document.getElementById('note-pin-chk');
    if (!titleEl || !contentEl) return null;

    const title = titleEl.value.trim();
    const content = contentEl.value.trim();
    if (!title && !content && checklistItems.length === 0) return null;

    try {
      const saved = await NotesRepo.saveNote({
        id: draftId,
        title: title || 'ملاحظة محفوظة تلقائيًا',
        content,
        noteType: typeEl?.value || 'text',
        checklistItems,
        tags: tagsEl?.value || '',
        category: catEl?.value || 'عام',
        pinned: Boolean(pinEl?.checked)
      });
      isDirty = false;
      const statusEl = document.getElementById('note-autosave-indicator');
      if (statusEl) statusEl.textContent = 'تم الحفظ التلقائي آمنًا ✓';
      if (!silent && typeof onSaved === 'function') await onSaved(saved);
      return saved;
    } catch {
      return null;
    }
  };

  const debouncedAutoSave = debounce(() => {
    persistDraftNow(true);
  }, 600);

  activeDraftNoteFlush = () => persistDraftNow(true);

  const bodyHtml = `
    <form id="yawmi-note-form" class="form-grid">
      <div style="display:flex;align-items:center;justify-content:space-between;font-size:0.75rem;color:var(--color-accent);">
        <span id="note-autosave-indicator">الحفظ التلقائي مفعّل</span>
        <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--text-primary);font-weight:700;">
          <input type="checkbox" id="note-pin-chk" ${note.pinned ? 'checked' : ''} style="accent-color:var(--color-primary);">
          <span>📌 تثبيت في الأعلى</span>
        </label>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label" for="note-title-input">العنوان *</label>
          <input type="text" id="note-title-input" class="form-input" placeholder="عنوان الملاحظة أو القائمة" value="${escapeHtml(note.title)}">
        </div>
        <div class="form-group">
          <label class="form-label" for="note-type-select">نوع الملاحظة</label>
          <select id="note-type-select" class="form-select">
            <option value="text" ${note.noteType === 'text' ? 'selected' : ''}>ملاحظة نصية</option>
            <option value="checklist" ${note.noteType === 'checklist' ? 'selected' : ''}>قائمة تحقق (مهام فرعية)</option>
            <option value="shopping" ${note.noteType === 'shopping' ? 'selected' : ''}>قائمة مشتريات 🛒</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="note-content-input">المحتوى النصي</label>
        <textarea id="note-content-input" class="form-textarea" placeholder="اكتب أفكارك أو تفاصيل الملاحظة هنا...">${escapeHtml(note.content || '')}</textarea>
      </div>

      <div class="form-group">
        <label class="form-label">عناصر القائمة (قائمة تحقق / مشتريات)</label>
        <div style="display:flex;gap:6px;margin-bottom:8px;">
          <input type="text" id="note-new-chk-input" class="form-input" placeholder="أضف عنصرًا للقائمة...">
          <button type="button" class="btn btn-secondary btn-sm" id="note-add-chk-btn">+ عنصر</button>
        </div>
        <div id="note-chk-list" class="item-list" style="max-height:150px;overflow-y:auto;"></div>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label" for="note-tags-input">الوسوم (مفصولة بفاصلة)</label>
          <input type="text" id="note-tags-input" class="form-input" placeholder="عمل, أفكار, تسوق" value="${escapeHtml((note.tags || []).join(', '))}">
        </div>
        <div class="form-group">
          <label class="form-label" for="note-cat-input">التصنيف</label>
          <input type="text" id="note-cat-input" class="form-input" value="${escapeHtml(note.category || 'عام')}">
        </div>
      </div>
    </form>
  `;

  const footerHtml = `
    ${isEdit ? `<button type="button" class="btn btn-danger btn-sm" id="note-delete-btn">${getIconSvg('trash', 15)} حذف</button>` : ''}
    <button type="button" class="btn btn-secondary" id="note-cancel-btn">إغلاق</button>
    <button type="button" class="btn btn-primary" id="note-save-btn">حفظ الملاحظة</button>
  `;

  openModal({
    title: isEdit ? 'تحرير الملاحظة' : 'ملاحظة أو قائمة جديدة',
    bodyHtml,
    footerHtml,
    onMount: () => {
      const chkListEl = document.getElementById('note-chk-list');
      const renderChecklistEditor = () => {
        if (!chkListEl) return;
        chkListEl.innerHTML = checklistItems.map((item, idx) => `
          <div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg-surface-muted);padding:7px 10px;border-radius:var(--radius-xs);">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;flex:1;">
              <input type="checkbox" data-chk-idx="${idx}" ${item.completed ? 'checked' : ''} style="accent-color:var(--color-primary);">
              <span style="${item.completed ? 'text-decoration:line-through;color:var(--text-muted);' : ''}">${escapeHtml(item.text)}</span>
            </label>
            <button type="button" class="icon-btn" style="width:24px;height:24px;" data-del-chk-idx="${idx}">✕</button>
          </div>
        `).join('');

        chkListEl.querySelectorAll('[data-chk-idx]').forEach(cb => {
          cb.addEventListener('change', () => {
            const i = Number(cb.getAttribute('data-chk-idx'));
            if (checklistItems[i]) {
              checklistItems[i].completed = cb.checked;
              isDirty = true;
              renderChecklistEditor();
              debouncedAutoSave();
            }
          });
        });

        chkListEl.querySelectorAll('[data-del-chk-idx]').forEach(btn => {
          btn.addEventListener('click', () => {
            const i = Number(btn.getAttribute('data-del-chk-idx'));
            checklistItems.splice(i, 1);
            isDirty = true;
            renderChecklistEditor();
            debouncedAutoSave();
          });
        });
      };

      renderChecklistEditor();

      document.getElementById('note-add-chk-btn')?.addEventListener('click', () => {
        const inp = document.getElementById('note-new-chk-input');
        const val = inp?.value?.trim();
        if (!val) return;
        checklistItems.push({ id: generateId('chk'), text: val, completed: false });
        inp.value = '';
        isDirty = true;
        renderChecklistEditor();
        debouncedAutoSave();
      });

      ['note-title-input', 'note-content-input', 'note-type-select', 'note-tags-input', 'note-cat-input', 'note-pin-chk'].forEach(id => {
        document.getElementById(id)?.addEventListener('input', () => {
          isDirty = true;
          const statusEl = document.getElementById('note-autosave-indicator');
          if (statusEl) statusEl.textContent = 'جارٍ الحفظ التلقائي...';
          debouncedAutoSave();
        });
      });

      document.getElementById('note-cancel-btn')?.addEventListener('click', async () => {
        await persistDraftNow(true);
        activeDraftNoteFlush = null;
        closeModal();
        if (typeof onSaved === 'function') await onSaved();
      });

      document.getElementById('note-delete-btn')?.addEventListener('click', () => {
        confirmAction({
          title: 'حذف الملاحظة',
          message: `هل أنت متأكد من حذف الملاحظة «${note.title}»؟`,
          onConfirm: async () => {
            activeDraftNoteFlush = null;
            await NotesRepo.deleteNote(note.id);
            showToast('تم حذف الملاحظة', 'info');
            if (typeof onSaved === 'function') await onSaved();
          }
        });
      });

      document.getElementById('note-save-btn')?.addEventListener('click', async () => {
        isDirty = true;
        const saved = await persistDraftNow(false);
        if (!saved) {
          showToast('أدخل عنوانًا أو محتوى للملاحظة أولًا', 'error');
          return;
        }
        activeDraftNoteFlush = null;
        closeModal();
        showToast('تم حفظ الملاحظة بنجاح', 'success');
      });
    }
  });
}
async function renderNotesView(containerEl, onRefreshApp) {
  const allNotes = await getAllRecords(STORE_NAMES.NOTES);
  const q = notesFilterState.query.trim().toLowerCase();

  const filtered = allNotes
    .filter(n => {
      if (notesFilterState.noteType !== 'all' && n.noteType !== notesFilterState.noteType) return false;
      if (q) {
        const itemsText = (n.checklistItems || []).map(i => i.text).join(' ');
        const tagsText = (n.tags || []).join(' ');
        const hay = `${n.title} ${n.content || ''} ${itemsText} ${tagsText}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    })
    .sort((a, b) => {
      if (Boolean(b.pinned) !== Boolean(a.pinned)) return b.pinned ? 1 : -1;
      return String(b.updatedAt || '').localeCompare(String(a.updatedAt || ''));
    });

  containerEl.innerHTML = `
    <div class="card" style="display:flex;flex-direction:column;gap:10px;">
      <div style="display:flex;gap:8px;">
        <div class="search-bar" style="flex:1;">
          ${getIconSvg('search', 16)}
          <input type="search" id="notes-search-input" placeholder="ابحث في العناوين والمحتوى والوسوم..." value="${escapeHtml(notesFilterState.query)}">
        </div>
        <button type="button" class="btn btn-primary btn-sm" id="notes-new-btn">
          ${getIconSvg('plus', 16)}
          <span>ملاحظة</span>
        </button>
      </div>
      <div class="filter-pills">
        ${[
          { key: 'all', label: 'الكل' },
          { key: 'text', label: 'ملاحظات نصية' },
          { key: 'checklist', label: 'قوائم تحقق' },
          { key: 'shopping', label: 'قوائم مشتريات 🛒' }
        ].map(p => `
          <button type="button" class="pill ${notesFilterState.noteType === p.key ? 'active' : ''}" data-note-type="${p.key}">
            ${escapeHtml(p.label)}
          </button>
        `).join('')}
      </div>
    </div>

    <div class="item-list">
      ${filtered.length === 0
        ? renderEmptyState({
            icon: 'note',
            title: 'لا توجد ملاحظات أو قوائم محفوظة',
            description: 'دوّن ملاحظاتك، أفكارك، وقوائم المشتريات مع حفظ تلقائي فوري يمنع ضياع أي نص.',
            actionLabel: 'إنشاء ملاحظة جديدة',
            actionId: 'notes-empty-add-btn'
          })
        : filtered.map(n => {
            const chkCount = (n.checklistItems || []).length;
            const chkDone = (n.checklistItems || []).filter(i => i.completed).length;
            return `
              <div class="card card-interactive" data-open-note="${escapeHtml(n.id)}" style="display:flex;flex-direction:column;gap:8px;">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                  <div style="font-weight:800;font-size:0.96rem;display:flex;align-items:center;gap:6px;">
                    ${n.pinned ? `<span title="مثبتة">📌</span>` : ''}
                    <span>${escapeHtml(n.title)}</span>
                  </div>
                  <button type="button" class="icon-btn" style="width:30px;height:30px;" data-pin-note="${escapeHtml(n.id)}" aria-label="تثبيت الملاحظة">
                    ${getIconSvg('pin', 14)}
                  </button>
                </div>
                ${n.content ? `<p style="font-size:0.84rem;color:var(--text-secondary);white-space:pre-line;">${escapeHtml(n.content.slice(0, 160))}${n.content.length > 160 ? '...' : ''}</p>` : ''}
                ${chkCount > 0 ? `
                  <div style="font-size:0.78rem;color:var(--color-accent);font-weight:700;">
                    ☑️ عناصر القائمة: ${chkDone} من ${chkCount} مكتمل
                  </div>
                ` : ''}
                <div style="display:flex;align-items:center;justify-content:space-between;font-size:0.72rem;color:var(--text-muted);">
                  <span>آخر تعديل: ${escapeHtml((n.updatedAt || '').slice(0, 16).replace('T', ' '))}</span>
                  <div>
                    ${(n.tags || []).map(tag => `<span class="badge badge-low" style="margin-inline-start:4px;">#${escapeHtml(tag)}</span>`).join('')}
                  </div>
                </div>
              </div>
            `;
          }).join('')
      }
    </div>
  `;

  document.getElementById('notes-new-btn')?.addEventListener('click', () => openNoteModal(null, onRefreshApp));
  containerEl.querySelector('[data-empty-action="notes-empty-add-btn"]')?.addEventListener('click', () => openNoteModal(null, onRefreshApp));

  document.getElementById('notes-search-input')?.addEventListener('input', (e) => {
    notesFilterState.query = e.target.value;
    renderNotesView(containerEl, onRefreshApp);
  });

  containerEl.querySelectorAll('[data-note-type]').forEach(btn => {
    btn.addEventListener('click', () => {
      notesFilterState.noteType = btn.getAttribute('data-note-type');
      renderNotesView(containerEl, onRefreshApp);
    });
  });

  containerEl.querySelectorAll('[data-pin-note]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = btn.getAttribute('data-pin-note');
      await NotesRepo.togglePin(id);
      showToast('تم تحديث حالة تثبيت الملاحظة', 'info');
      renderNotesView(containerEl, onRefreshApp);
    });
  });

  containerEl.querySelectorAll('[data-open-note]').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.getAttribute('data-open-note');
      const found = allNotes.find(x => x.id === id);
      if (found) openNoteModal(found, onRefreshApp);
    });
  });
}

    const s2 = new Date(startIso2).getTime();

    const clockDriftOffsetMs = Number(options.clockDriftOffsetMs || 0);
    const existingRecords = await getAllRecords(STORE_NAMES.HEALTH_RECORDS, dbName);
    const byId = new Map(existingRecords.map(r => [r.id, r]));

    let insertedCount = 0;
    let updatedCount = 0;
    let suppressedDuplicatesCount = 0;

    for (const raw of rawRecordsList) {

      // 1. فحص التطابق التام عبر المعرف الأصلي (sourceRecordId) أو البصمة الدقيقة

        if (normalized.sourceRecordId && ex.sourceRecordId === normalized.sourceRecordId && ex.metricType === normalized.metricType && ex.sourceType === normalized.sourceType) {

        }
        return (
          ex.metricType === normalized.metricType &&
          ex.sourceType === normalized.sourceType &&
          ex.startTime === normalized.startTime &&
          ex.endTime === normalized.endTime &&
          Number(ex.value) === Number(normalized.value)

      const prioDiff = this.getSourcePriority(b) - this.getSourcePriority(a);
      if (prioDiff !== 0) return prioDiff;
      return Number(b.value) - Number(a.value);
